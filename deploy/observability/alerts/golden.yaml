group:
  name: vgkeep
  folder: vgkeep
  interval: 1m
datasource: prometheus
services: [auth, bff, collection, enrichment, social, user]
# kube_/node_ (kube-state-metrics/node-exporter) and up (Prometheus itself) come from infrastructure this repo
# never registers metrics for, so no name scan could discover them; frontend's vg_frontend_ needs no exemption since the TS scan finds it directly.
external_metric_prefixes: [kube_, node_, up]
templates:
  # summary uses datastore-neutral wording ("metrics exporters", not "postgres exporter") since bff (Valkey
  # only) also instantiates this template without Postgres; alerts/social.yaml overrides it with social's own wording.
  # runbook and panel_ref point at the shared golden-block section, not a per-service one (dashboards/golden.yaml's Availability panel; stack.md's "Service down" section).
  availability:
    uid: vg-{service}-down
    title: "{service} service down"
    expr: up{namespace="vgkeep", pod=~"{service}-.*"}
    condition: lt 1
    instant: true
    for: 2m
    noDataState: Alerting
    execErrState: Error
    severity: page
    summary: "{service} is down or its metrics exporters cannot reach it"
    runbook: stack.md#service-down
    panel_ref: "{service}/Availability"
  pdb_budget:
    uid: vg-{service}-pdb-exhausted
    title: "{Service} disruption budget exhausted"
    expr: min(kube_poddisruptionbudget_status_pod_disruptions_allowed{namespace="vgkeep", poddisruptionbudget=~"{service}.*"} and on(namespace, poddisruptionbudget) kube_poddisruptionbudget_status_expected_pods{namespace="vgkeep", poddisruptionbudget=~"{service}.*"} > 1)
    condition: lt 1
    instant: true
    for: 1h
    noDataState: OK
    execErrState: Error
    severity: warn
    summary: "{service} (or one of its datastores) cannot tolerate any pod disruption"
    runbook: stack.md#pdb-exhausted
