group:
  name: vgkeep
  folder: vgkeep
  interval: 1m
datasource: prometheus
services: [auth, bff, collection, enrichment, social, user]
# kube_ and node_ are emitted by kube-state-metrics and node-exporter;
# up is Prometheus's own scrape-health series. All three come from
# infrastructure this repo scrapes but never registers metrics for
# itself, so no scan - Go or TypeScript - could ever discover them.
# (Frontend browser-telemetry metrics, vg_frontend_, need no exemption
# here: the lint name scan's TypeScript pass over frontend/src
# resolves them directly.)
external_metric_prefixes: [kube_, node_, up]
templates:
  # Most fields below match vg-social-down's original values exactly
  # (social was this template's first instantiator): title uses the
  # lowercase {service} form ("social service down", not "Social
  # service down"); severity is page (not crit - this rule set only
  # uses page/warn). summary is the one field that departs from
  # social's wording: it names the datastore-neutral truth ("metrics
  # exporters", not "postgres exporter") because bff (Valkey only, no
  # Postgres) and enrichment (Mongo+Valkey, no Postgres) also
  # instantiate this template; alerts/social.yaml carries social's own
  # wording back as an explicit summary override. runbook and
  # panel_ref point at the shared golden-block section/panel
  # (dashboards/golden.yaml's Availability panel; stack.md's "Service
  # down" section), since every service instantiates this template
  # with the identical query shape.
  availability:
    uid: vg-{service}-down
    title: "{service} service down"
    expr: up{namespace="vgkeep", pod=~"{service}-.*"}
    condition: lt 1
    instant: true
    for: 2m
    noDataState: Alerting
    execErrState: Error
    severity: page
    summary: "{service} is down or its metrics exporters cannot reach it"
    runbook: stack.md#service-down
    panel_ref: "{service}/Availability"
  pdb_budget:
    uid: vg-{service}-pdb-exhausted
    title: "{Service} disruption budget exhausted"
    expr: min(kube_poddisruptionbudget_status_pod_disruptions_allowed{namespace="vgkeep", poddisruptionbudget=~"{service}.*"} and on(namespace, poddisruptionbudget) kube_poddisruptionbudget_status_expected_pods{namespace="vgkeep", poddisruptionbudget=~"{service}.*"} > 1)
    condition: lt 1
    instant: true
    for: 1h
    noDataState: OK
    execErrState: Error
    severity: warn
    summary: "{service} (or one of its datastores) cannot tolerate any pod disruption"
    runbook: stack.md#pdb-exhausted
