service: enrichment
golden:
  availability: {}
  pdb_budget: {}
alerts:
  - uid: vg-enrichment-refresh-stalled
    title: Enrichment nightly catalog refresh has not completed in 26h
    expr: time() - max(last_over_time(vg_enrichment_refresh_last_completed_seconds{step="prices"}[26h]))
    condition: gt 93600
    instant: true
    range: 26h
    for: 1h
    noDataState: Alerting
    execErrState: Error
    severity: warn
    summary: enrichment has not finished a price refresh in more than 26 hours; catalog prices are going stale
    runbook: enrichment.md#4-catalog-refresh-missing
    panel_ref: enrichment/Time since refresh completed by step
  - uid: vg-enrichment-search-degraded
    title: Enrichment search serving degraded answers
    expr: sum(rate(vg_enrichment_search_requests_total{source="degraded"}[15m])) / sum(rate(vg_enrichment_search_requests_total[15m]))
    condition: gt 0.1
    instant: true
    range: 15m
    for: 15m
    noDataState: OK
    execErrState: Error
    severity: warn
    summary: more than 10 percent of enrichment search answers are degraded local fallbacks; a provider is failing
    runbook: enrichment.md#3-search-degraded
