service: user
dashboard:
  uid: vg-user
  title: 'User Service'
sections:
  Overview: 0
  HTTP: 5
  Accounts: 22
  PostgreSQL: 31
  Runtime: 48
  Pods: 57
  Logs: 66
golden_blocks:
  stat_row: 1
  http: 6
  pg: 32
  runtime: 49
  pod: 58
  logs: 67
custom_panels:
  - |
    {
      "type": "timeseries",
      "title": "Account upserts by outcome (5m)",
      "gridPos": { "h": 8, "w": 8, "x": 0, "y": 23 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum by (outcome) (increase(vg_user_account_upserts_total[5m]))",
          "legendFormat": "{{outcome}}",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "New-account currency seed source (5m)",
      "gridPos": { "h": 8, "w": 8, "x": 8, "y": 23 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum by (source) (increase(vg_user_currency_seeds_total[5m]))",
          "legendFormat": "{{source}}",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Account deletions by outcome (5m)",
      "gridPos": { "h": 8, "w": 8, "x": 16, "y": 23 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum by (outcome) (increase(vg_user_account_deletes_total[5m]))",
          "legendFormat": "{{outcome}}",
          "exemplar": false
        }
      ]
    }
