service: social
dashboard:
  uid: vg-social
  title: 'Social Service'
sections:
  Overview: 0
  HTTP: 5
  Engagement: 22
  PostgreSQL: 39
  Runtime: 56
  Pods: 65
  Logs: 74
golden_blocks:
  stat_row: 1
  http: 6
  pg: 40
  runtime: 57
  pod: 66
  logs: 75
custom_panels:
  - |
    {
      "type": "timeseries",
      "title": "Follows by op",
      "gridPos": { "h": 8, "w": 8, "x": 0, "y": 23 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "ops" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum(rate(vg_social_follows_total[$__rate_interval])) by (op)",
          "legendFormat": "{{op}}",
          "exemplar": false
        }
      ]
    }
  - |
