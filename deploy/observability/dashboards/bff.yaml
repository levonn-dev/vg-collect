service: bff
dashboard:
  uid: vg-bff
  title: 'Bff Service'
custom_panels:
  - |
    {
      "type": "stat",
      "title": "Request rate",
      "gridPos": { "h": 4, "w": 8, "x": 0, "y": 0 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": {
        "defaults": {
          "unit": "reqps",
          "thresholds": {
            "mode": "absolute",
            "steps": [{ "color": "green", "value": null }]
          }
        },
        "overrides": []
      },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum(rate(http_server_request_duration_seconds_count{service_name=\"bff\"}[5m]))",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "stat",
      "title": "5xx ratio",
      "gridPos": { "h": 4, "w": 8, "x": 8, "y": 0 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": {
        "defaults": {
          "unit": "percentunit",
          "thresholds": {
            "mode": "absolute",
            "steps": [
              { "color": "green", "value": null },
              { "color": "red", "value": 0.05 }
            ]
          }
        },
        "overrides": []
      },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum(rate(http_server_request_duration_seconds_count{service_name=\"bff\",http_response_status_code=~\"5..\"}[5m])) / sum(rate(http_server_request_duration_seconds_count{service_name=\"bff\"}[5m]))",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "stat",
      "title": "p99 latency",
      "gridPos": { "h": 4, "w": 8, "x": 16, "y": 0 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": {
        "defaults": {
          "unit": "s",
          "thresholds": {
            "mode": "absolute",
            "steps": [
              { "color": "green", "value": null },
              { "color": "yellow", "value": 0.5 }
            ]
          }
        },
        "overrides": []
      },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "histogram_quantile(0.99, sum by (le) (rate(http_server_request_duration_seconds_bucket{service_name=\"bff\"}[5m])))",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Request rate by route",
      "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum by (http_route) (rate(http_server_request_duration_seconds_count{service_name=\"bff\"}[$__rate_interval]))",
          "legendFormat": "{{http_route}}",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Errors by route and status",
      "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum by (http_route, http_response_status_code) (rate(http_server_request_duration_seconds_count{service_name=\"bff\",http_response_status_code=~\"4..|5..\"}[$__rate_interval]))",
          "legendFormat": "{{http_route}} {{http_response_status_code}}",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Latency by route p95/p99",
      "gridPos": { "h": 8, "w": 24, "x": 0, "y": 12 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "histogram_quantile(0.95, sum by (le, http_route) (rate(http_server_request_duration_seconds_bucket{service_name=\"bff\"}[$__rate_interval])))",
          "legendFormat": "p95 {{http_route}}",
          "exemplar": true
        },
        {
          "refId": "B",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "histogram_quantile(0.99, sum by (le, http_route) (rate(http_server_request_duration_seconds_bucket{service_name=\"bff\"}[$__rate_interval])))",
          "legendFormat": "p99 {{http_route}}",
          "exemplar": true
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Login and link outcomes",
      "gridPos": { "h": 8, "w": 12, "x": 0, "y": 20 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum by (flow, outcome) (increase(vg_bff_auth_logins_total[5m]))",
          "legendFormat": "{{flow}} {{outcome}}",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Session refresh outcomes",
      "gridPos": { "h": 8, "w": 12, "x": 12, "y": 20 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum by (outcome) (increase(vg_bff_session_refreshes_total[5m]))",
          "legendFormat": "{{outcome}}",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Composition cache hit ratio (me, recs)",
      "gridPos": { "h": 8, "w": 8, "x": 0, "y": 28 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "percentunit" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum by (cache) (rate(vg_bff_cache_lookups_total{outcome=\"hit\"}[5m])) / sum by (cache) (rate(vg_bff_cache_lookups_total[5m]))",
          "legendFormat": "{{cache}}",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Valkey fail-open events by op",
      "gridPos": { "h": 8, "w": 8, "x": 8, "y": 28 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum by (op) (increase(vg_bff_cache_fail_open_total[5m]))",
          "legendFormat": "{{op}}",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Browser telemetry relay responses by route",
      "gridPos": { "h": 8, "w": 8, "x": 16, "y": 28 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum by (http_route, http_response_status_code) (rate(http_server_request_duration_seconds_count{service_name=\"bff\",http_route=~\"POST /api/otlp/v1/(traces|metrics)\"}[$__rate_interval]))",
          "legendFormat": "{{http_route}} {{http_response_status_code}}",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Valkey client pool connections",
      "gridPos": { "h": 8, "w": 12, "x": 0, "y": 36 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "vg_valkeykit_pool_connections{service_name=\"bff\"}",
          "legendFormat": "open",
          "exemplar": false
        },
        {
          "refId": "B",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "vg_valkeykit_pool_connections_idle{service_name=\"bff\"}",
          "legendFormat": "idle",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Valkey pool acquire outcomes",
      "gridPos": { "h": 8, "w": 12, "x": 12, "y": 36 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "ops" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "rate(vg_valkeykit_pool_hits_total{service_name=\"bff\"}[$__rate_interval])",
          "legendFormat": "hits",
          "exemplar": false
        },
        {
          "refId": "B",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "rate(vg_valkeykit_pool_misses_total{service_name=\"bff\"}[$__rate_interval])",
          "legendFormat": "misses",
          "exemplar": false
        },
        {
          "refId": "C",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "rate(vg_valkeykit_pool_timeouts_total{service_name=\"bff\"}[$__rate_interval])",
          "legendFormat": "timeouts",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "bff-valkey server memory",
      "gridPos": { "h": 8, "w": 12, "x": 0, "y": 44 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "redis_memory_used_bytes{service=\"bff-valkey\"}",
          "legendFormat": "{{service}}",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "bff-valkey evictions and clients",
      "gridPos": { "h": 8, "w": 12, "x": 12, "y": 44 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "rate(redis_evicted_keys_total{service=\"bff-valkey\"}[$__rate_interval])",
          "legendFormat": "evictions",
          "exemplar": false
        },
        {
          "refId": "B",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "redis_connected_clients{service=\"bff-valkey\"}",
          "legendFormat": "clients",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Goroutines",
      "gridPos": { "h": 8, "w": 12, "x": 0, "y": 52 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "go_goroutine_count{service_name=\"bff\"}",
          "legendFormat": "goroutines",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Heap used",
      "gridPos": { "h": 8, "w": 12, "x": 12, "y": 52 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "go_memory_used_bytes{service_name=\"bff\"}",
          "legendFormat": "heap",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Pod CPU",
      "gridPos": { "h": 8, "w": 8, "x": 0, "y": 60 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"vgkeep\", pod=~\"bff.*\", container!=\"\"}[$__rate_interval]))",
          "legendFormat": "{{pod}}",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Pod working-set memory",
      "gridPos": { "h": 8, "w": 8, "x": 8, "y": 60 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"vgkeep\", pod=~\"bff.*\", container!=\"\"})",
          "legendFormat": "{{pod}}",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Pod restarts (15m)",
      "gridPos": { "h": 8, "w": 8, "x": 16, "y": 60 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=\"vgkeep\", pod=~\"bff.*\"}[15m]))",
          "legendFormat": "{{pod}}",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "logs",
      "title": "Recent error logs",
      "gridPos": { "h": 8, "w": 24, "x": 0, "y": 68 },
      "datasource": { "type": "loki", "uid": "loki" },
      "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "loki", "uid": "loki" },
          "expr": "{service_name=\"bff\"} | severity_text=\"ERROR\""
        }
      ]
    }
