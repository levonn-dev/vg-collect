service: bff
dashboard:
  uid: vg-bff
  title: 'BFF Service'
sections:
  Overview: 0
  HTTP: 5
  Sessions and composition: 22
  Valkey: 39
  Runtime: 64
  Pods: 73
  Logs: 82
golden_blocks:
  stat_row: 1
  http: 6
  valkey: 40
  fail_open: 56
  runtime: 65
  pod: 74
  logs: 83
custom_panels:
  - |
    {
      "type": "timeseries",
      "title": "Login and link outcomes",
      "gridPos": { "h": 8, "w": 12, "x": 0, "y": 23 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum by (flow, outcome) (increase(vg_bff_auth_logins_total[5m]))",
          "legendFormat": "{{flow}} {{outcome}}",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Session refresh outcomes",
      "gridPos": { "h": 8, "w": 12, "x": 12, "y": 23 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum by (outcome) (increase(vg_bff_session_refreshes_total[5m]))",
          "legendFormat": "{{outcome}}",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Composition cache hit ratio (me, recs)",
      "gridPos": { "h": 8, "w": 12, "x": 0, "y": 31 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "percentunit" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum by (cache) (rate(vg_bff_cache_lookups_total{outcome=\"hit\"}[5m])) / sum by (cache) (rate(vg_bff_cache_lookups_total[5m]))",
          "legendFormat": "{{cache}}",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Browser telemetry relay responses by route",
      "gridPos": { "h": 8, "w": 12, "x": 12, "y": 31 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum by (http_route, http_response_status_code) (rate(http_server_request_duration_seconds_count{service_name=\"bff\",http_route=~\"POST /api/otlp/v1/(traces|metrics)\"}[$__rate_interval]))",
          "legendFormat": "{{http_route}} {{http_response_status_code}}",
          "exemplar": false
        }
      ]
    }
