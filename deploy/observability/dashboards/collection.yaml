service: collection
dashboard:
  uid: vg-collection
  title: 'Collection Service'
sections:
  Overview: 0
  HTTP: 5
  Pricing and submissions: 22
  PostgreSQL: 55
  Valkey: 72
  Runtime: 97
  Pods: 106
  Logs: 115
golden_blocks:
  stat_row: 1
  http: 6
  pg: 56
  valkey: 73
  fail_open: 89
  runtime: 98
  pod: 107
  logs: 116
custom_panels:
  - |
    {
      "type": "timeseries",
      "title": "Pricing composition outcomes",
      "gridPos": { "h": 8, "w": 12, "x": 0, "y": 23 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum by (op, outcome) (increase(vg_collection_pricing_compose_total[5m]))",
          "legendFormat": "{{op}} {{outcome}}",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Cache hit ratio by surface",
      "gridPos": { "h": 8, "w": 12, "x": 12, "y": 23 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "percentunit" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum by (cache) (rate(vg_collection_cache_lookups_total{outcome=\"hit\"}[5m])) / sum by (cache) (rate(vg_collection_cache_lookups_total[5m]))",
          "legendFormat": "{{cache}}",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Submission lifecycle events",
      "gridPos": { "h": 8, "w": 12, "x": 0, "y": 31 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum by (event) (increase(vg_collection_submissions_events_total[5m]))",
          "legendFormat": "{{event}}",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "stat",
      "title": "Pending submissions",
      "gridPos": { "h": 8, "w": 12, "x": 12, "y": 31 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": {
        "defaults": {
          "unit": "short",
          "thresholds": {
            "mode": "absolute",
            "steps": [
              { "color": "green", "value": null },
              { "color": "yellow", "value": 25 },
              { "color": "red", "value": 100 }
            ]
          }
        },
        "overrides": []
      },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "max(vg_collection_submissions_pending)",
          "legendFormat": "pending",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Entry rematch",
      "gridPos": { "h": 8, "w": 12, "x": 0, "y": 39 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum by (outcome) (increase(vg_collection_rematch_triples_total[1h]))",
          "legendFormat": "triples/{{outcome}}",
          "exemplar": false
        },
        {
          "refId": "B",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "increase(vg_collection_rematch_repoints_total[1h])",
          "legendFormat": "repoints",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Entry rematch duration",
      "gridPos": { "h": 8, "w": 12, "x": 12, "y": 39 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum(increase(vg_collection_rematch_duration_seconds_sum[1h]))",
          "legendFormat": "duration",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Normalize sweeps (rows/night by outcome)",
      "gridPos": { "h": 8, "w": 24, "x": 0, "y": 47 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum by (outcome) (increase(vg_collection_normalize_platforms_total[24h]))",
          "legendFormat": "platforms/{{outcome}}",
          "exemplar": false
        },
        {
          "refId": "B",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum by (outcome) (increase(vg_collection_normalize_regions_total[24h]))",
          "legendFormat": "regions/{{outcome}}",
          "exemplar": false
        }
      ]
    }
