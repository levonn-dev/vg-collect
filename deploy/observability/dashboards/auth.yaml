service: auth
dashboard:
  uid: vg-auth
  title: 'Auth Service'
sections:
  Overview: 0
  HTTP: 5
  Logins and providers: 22
  PostgreSQL: 39
  Runtime: 56
  Pods: 65
  Logs: 74
golden_blocks:
  stat_row: 1
  http: 6
  pg: 40
  runtime: 57
  pod: 66
  logs: 75
custom_panels:
  - |
    {
      "type": "timeseries",
      "title": "Logins by provider, flow, outcome, 5m",
      "gridPos": { "h": 8, "w": 8, "x": 0, "y": 23 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum by (provider, flow, outcome) (increase(vg_auth_login_outcomes_total[5m]))",
          "legendFormat": "{{provider}} {{flow}} {{outcome}}",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Refresh outcomes, 5m",
      "gridPos": { "h": 8, "w": 8, "x": 8, "y": 23 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum by (outcome) (increase(vg_auth_token_refreshes_total[5m]))",
          "legendFormat": "{{outcome}}",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "stat",
      "title": "Reuse detections, 24h",
      "gridPos": { "h": 8, "w": 4, "x": 16, "y": 23 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": {
        "defaults": {
          "unit": "short",
          "thresholds": {
            "mode": "absolute",
            "steps": [
              { "color": "green", "value": null },
              { "color": "red", "value": 1 }
            ]
          }
        },
        "overrides": []
      },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum(increase(vg_auth_token_refreshes_total{outcome=\"reuse_detected\"}[24h]))",
          "legendFormat": "reuse",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "stat",
      "title": "Active signing keys",
      "gridPos": { "h": 8, "w": 4, "x": 20, "y": 23 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": {
        "defaults": {
          "unit": "short",
          "thresholds": {
            "mode": "absolute",
            "steps": [
              { "color": "red", "value": null },
              { "color": "green", "value": 1 }
            ]
          }
        },
        "overrides": []
      },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "max(vg_auth_signing_keys_active)",
          "legendFormat": "keys",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Provider request p95 by op",
      "gridPos": { "h": 8, "w": 12, "x": 0, "y": 31 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "histogram_quantile(0.95, sum by (le, provider, op) (rate(vg_auth_provider_request_duration_seconds_bucket[$__rate_interval])))",
          "legendFormat": "{{provider}} {{op}}",
          "exemplar": true
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Provider request errors, 5m",
      "gridPos": { "h": 8, "w": 12, "x": 12, "y": 31 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum by (provider, op) (increase(vg_auth_provider_request_duration_seconds_count{outcome=\"error\"}[5m]))",
          "legendFormat": "{{provider}} {{op}}",
          "exemplar": false
        }
      ]
    }
