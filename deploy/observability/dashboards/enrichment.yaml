service: enrichment
dashboard:
  uid: vg-enrichment
  title: 'Enrichment Service'
custom_panels:
  - |
    {
      "type": "timeseries",
      "title": "Request rate by route",
      "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum by (http_route) (rate(http_server_request_duration_seconds_count{service_name=\"enrichment\"}[$__rate_interval]))",
          "legendFormat": "{{http_route}}",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "5xx ratio",
      "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "percentunit" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum (rate(http_server_request_duration_seconds_count{service_name=\"enrichment\",http_response_status_code=~\"5..\"}[5m])) / sum (rate(http_server_request_duration_seconds_count{service_name=\"enrichment\"}[5m]))",
          "legendFormat": "5xx ratio",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Latency by route (p95/p99)",
      "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "histogram_quantile(0.95, sum by (le, http_route) (rate(http_server_request_duration_seconds_bucket{service_name=\"enrichment\"}[$__rate_interval])))",
          "legendFormat": "p95 {{http_route}}",
          "exemplar": true
        },
        {
          "refId": "B",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "histogram_quantile(0.99, sum by (le, http_route) (rate(http_server_request_duration_seconds_bucket{service_name=\"enrichment\"}[$__rate_interval])))",
          "legendFormat": "p99 {{http_route}}",
          "exemplar": true
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Errors by route and status",
      "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum by (http_route, http_response_status_code) (rate(http_server_request_duration_seconds_count{service_name=\"enrichment\",http_response_status_code=~\"4..|5..\"}[$__rate_interval]))",
          "legendFormat": "{{http_route}} {{http_response_status_code}}",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Goroutines",
      "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": {
        "defaults": { "unit": "short" },
        "overrides": []
      },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "go_goroutine_count{service_name=\"enrichment\"}",
          "legendFormat": "goroutines",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Heap used",
      "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": {
        "defaults": { "unit": "bytes" },
        "overrides": []
      },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "go_memory_used_bytes{service_name=\"enrichment\"}",
          "legendFormat": "heap",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Search answers by source",
      "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum by (kind, source) (increase(vg_enrichment_search_requests_total[5m]))",
          "legendFormat": "{{kind}} {{source}}",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Auto-match outcomes",
      "gridPos": { "h": 8, "w": 12, "x": 12, "y": 24 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum by (source, outcome, region) (increase(vg_enrichment_match_outcomes_total[1h]))",
          "legendFormat": "{{source}}/{{outcome}}/{{region}}",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Match fallback searches",
      "gridPos": { "h": 8, "w": 24, "x": 0, "y": 32 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum by (outcome) (increase(vg_enrichment_match_fallback_search_total[1h]))",
          "legendFormat": "{{outcome}}",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Localization search legs",
      "gridPos": { "h": 8, "w": 24, "x": 0, "y": 40 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum by (outcome) (rate(vg_enrichment_search_localization_leg_total[5m]))",
          "legendFormat": "{{outcome}}",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Catalog refresh items by step and outcome",
      "gridPos": { "h": 8, "w": 12, "x": 0, "y": 48 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum by (step, outcome) (increase(vg_enrichment_refresh_items_total[1h]))",
          "legendFormat": "{{step}} {{outcome}}",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Catalog refresh duration by step",
      "gridPos": { "h": 8, "w": 12, "x": 12, "y": 48 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum by (step) (increase(vg_enrichment_refresh_step_duration_seconds_sum[1h]))",
          "legendFormat": "{{step}}",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Valkey fail-open events",
      "gridPos": { "h": 8, "w": 24, "x": 0, "y": 56 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum by (op) (increase(vg_enrichment_cache_fail_open_total[5m]))",
          "legendFormat": "{{op}}",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Valkey client pool connections",
      "gridPos": { "h": 8, "w": 12, "x": 0, "y": 64 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "vg_valkeykit_pool_connections{service_name=\"enrichment\"}",
          "legendFormat": "open",
          "exemplar": false
        },
        {
          "refId": "B",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "vg_valkeykit_pool_connections_idle{service_name=\"enrichment\"}",
          "legendFormat": "idle",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Valkey pool reuse ratio",
      "gridPos": { "h": 8, "w": 12, "x": 12, "y": 64 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "percentunit" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "rate(vg_valkeykit_pool_hits_total{service_name=\"enrichment\"}[5m]) / (rate(vg_valkeykit_pool_hits_total{service_name=\"enrichment\"}[5m]) + rate(vg_valkeykit_pool_misses_total{service_name=\"enrichment\"}[5m]))",
          "legendFormat": "reuse ratio",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Valkey pool timeouts",
      "gridPos": { "h": 8, "w": 12, "x": 0, "y": 72 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "increase(vg_valkeykit_pool_timeouts_total{service_name=\"enrichment\"}[5m])",
          "legendFormat": "timeouts",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "stat",
      "title": "Mongo up",
      "gridPos": { "h": 8, "w": 12, "x": 12, "y": 72 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": {
        "defaults": {
          "unit": "short",
          "thresholds": {
            "mode": "absolute",
            "steps": [
              { "color": "red", "value": null },
              { "color": "green", "value": 1 }
            ]
          }
        },
        "overrides": []
      },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "mongodb_up{service=\"enrichment-mongo\"}",
          "legendFormat": "{{service}}",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Mongo operations",
      "gridPos": { "h": 8, "w": 12, "x": 0, "y": 80 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "ops" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum by (legacy_op_type) (rate(mongodb_ss_opcounters{service=\"enrichment-mongo\"}[$__rate_interval]))",
          "legendFormat": "{{legacy_op_type}}",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Valkey server memory",
      "gridPos": { "h": 8, "w": 12, "x": 12, "y": 80 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "redis_memory_used_bytes{service=\"enrichment-valkey\"}",
          "legendFormat": "{{service}}",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Valkey keyspace hit ratio",
      "gridPos": { "h": 8, "w": 24, "x": 0, "y": 88 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "percentunit" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "rate(redis_keyspace_hits_total{service=\"enrichment-valkey\"}[5m]) / (rate(redis_keyspace_hits_total{service=\"enrichment-valkey\"}[5m]) + rate(redis_keyspace_misses_total{service=\"enrichment-valkey\"}[5m]))",
          "legendFormat": "{{service}}",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "CPU by pod",
      "gridPos": { "h": 8, "w": 12, "x": 0, "y": 96 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"vgkeep\", pod=~\"enrichment.*\", container!=\"\"}[$__rate_interval]))",
          "legendFormat": "{{pod}}",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Working-set memory by pod",
      "gridPos": { "h": 8, "w": 12, "x": 12, "y": 96 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"vgkeep\", pod=~\"enrichment.*\", container!=\"\"})",
          "legendFormat": "{{pod}}",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Restarts (15m windows) by pod",
      "gridPos": { "h": 8, "w": 24, "x": 0, "y": 104 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=\"vgkeep\", pod=~\"enrichment.*\"}[15m]))",
          "legendFormat": "{{pod}}",
          "exemplar": false
        }
      ]
    }
  - |
    {
      "type": "logs",
      "title": "Recent error logs",
      "gridPos": { "h": 8, "w": 24, "x": 0, "y": 112 },
      "datasource": { "type": "loki", "uid": "loki" },
      "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "loki", "uid": "loki" },
          "expr": "{service_name=\"enrichment\"} | severity_text=\"ERROR\""
        }
      ]
    }
  - |
    {
      "type": "timeseries",
      "title": "Normalize sweeps (rows/night by outcome)",
      "gridPos": { "h": 8, "w": 24, "x": 0, "y": 120 },
      "datasource": { "type": "prometheus", "uid": "prometheus" },
      "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
      "targets": [
        {
          "refId": "A",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "expr": "sum by (outcome) (increase(vg_enrichment_normalize_regions_total[24h]))",
          "legendFormat": "regions/{{outcome}}",
          "exemplar": false
        }
      ]
    }
