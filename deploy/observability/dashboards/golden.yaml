# Golden blocks: shared panels instantiated per service at the golden_blocks y anchor; fragment gridPos.y is the offset inside the block.
blocks:
  stat_row:
    panels:
      - |
        {
          "type": "timeseries",
          "title": "Availability",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "up{namespace=\"vgkeep\", pod=~\"{service}-.*\"}",
              "legendFormat": "{{pod}}",
              "exemplar": false
            }
          ]
        }
      - |
        {
          "type": "stat",
          "title": "Request rate",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "green", "value": null }]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(http_server_request_duration_seconds_count{service_name=\"{service}\"}[5m]))",
              "exemplar": false
            }
          ]
        }
      - |
        {
          "type": "stat",
          "title": "5xx ratio",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 0.05 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(http_server_request_duration_seconds_count{service_name=\"{service}\",http_response_status_code=~\"5..\"}[5m])) / sum(rate(http_server_request_duration_seconds_count{service_name=\"{service}\"}[5m]))",
              "exemplar": false
            }
          ]
        }
      - |
        {
          "type": "stat",
          "title": "p99 latency",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.5 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_server_request_duration_seconds_bucket{service_name=\"{service}\"}[5m])))",
              "exemplar": false
            }
          ]
        }
  http:
    panels:
      - |
        {
          "type": "timeseries",
          "title": "Request rate by route",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (http_route) (rate(http_server_request_duration_seconds_count{service_name=\"{service}\"}[$__rate_interval]))",
              "legendFormat": "{{http_route}}",
              "exemplar": false
            }
          ]
        }
      - |
        {
          "type": "timeseries",
          "title": "5xx ratio (5m)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percentunit" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(http_server_request_duration_seconds_count{service_name=\"{service}\",http_response_status_code=~\"5..\"}[5m])) / sum(rate(http_server_request_duration_seconds_count{service_name=\"{service}\"}[5m]))",
              "legendFormat": "5xx ratio",
              "exemplar": false
            }
          ]
        }
      - |
        {
          "type": "timeseries",
          "title": "Latency by route (p95/p99)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.95, sum by (le, http_route) (rate(http_server_request_duration_seconds_bucket{service_name=\"{service}\"}[$__rate_interval])))",
              "legendFormat": "p95 {{http_route}}",
              "exemplar": true
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.99, sum by (le, http_route) (rate(http_server_request_duration_seconds_bucket{service_name=\"{service}\"}[$__rate_interval])))",
              "legendFormat": "p99 {{http_route}}",
              "exemplar": true
            }
          ]
        }
      - |
        {
          "type": "timeseries",
          "title": "4xx and 5xx by route and status",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (http_route, http_response_status_code) (rate(http_server_request_duration_seconds_count{service_name=\"{service}\",http_response_status_code=~\"4..|5..\"}[$__rate_interval]))",
              "legendFormat": "{{http_route}} {{http_response_status_code}}",
              "exemplar": false
            }
          ]
        }
  runtime:
    panels:
      - |
        {
          "type": "timeseries",
          "title": "Goroutines",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "go_goroutine_count{service_name=\"{service}\"}",
              "legendFormat": "goroutines",
              "exemplar": false
            }
          ]
        }
      - |
        {
          "type": "timeseries",
          "title": "Heap used",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "go_memory_used_bytes{service_name=\"{service}\"}",
              "legendFormat": "heap",
              "exemplar": false
            }
          ]
        }
  pod:
    panels:
      - |
        {
          "type": "timeseries",
          "title": "CPU by pod",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"vgkeep\", container=\"{service}\"}[$__rate_interval]))",
              "legendFormat": "{{pod}}",
              "exemplar": false
            }
          ]
        }
      - |
        {
          "type": "timeseries",
          "title": "Working-set memory by pod",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"vgkeep\", container=\"{service}\"})",
              "legendFormat": "{{pod}}",
              "exemplar": false
            }
          ]
        }
      - |
        {
          "type": "timeseries",
          "title": "Restarts and OOM kills by pod (15m)",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=\"vgkeep\", container=\"{service}\"}[15m]))",
              "legendFormat": "restarts {{pod}}",
              "exemplar": false
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (pod) (kube_pod_container_status_last_terminated_reason{reason=\"OOMKilled\", namespace=\"vgkeep\", container=\"{service}\"})",
              "legendFormat": "oom {{pod}}",
              "exemplar": false
            }
          ]
        }
  logs:
    panels:
      - |
        {
          "type": "logs",
          "title": "Recent error and warn logs",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 0 },
          "datasource": { "type": "loki", "uid": "loki" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "{service_name=\"{service}\"} | severity_text=~\"ERROR|WARN\""
            }
          ]
        }
  pg:
    panels:
      - |
        {
          "type": "timeseries",
          "title": "PG pool connections",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "vg_pgkit_pool_connections{service_name=\"{service}\"}",
              "legendFormat": "in pool",
              "exemplar": false
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "vg_pgkit_pool_connections_idle{service_name=\"{service}\"}",
              "legendFormat": "idle",
              "exemplar": false
            },
            {
              "refId": "C",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "vg_pgkit_pool_connections_max{service_name=\"{service}\"}",
              "legendFormat": "max",
              "exemplar": false
            }
          ]
        }
      - |
        {
          "type": "timeseries",
          "title": "PG pool mean acquire wait",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "rate(vg_pgkit_pool_acquire_wait_seconds_total{service_name=\"{service}\"}[5m]) / rate(vg_pgkit_pool_acquires_total{service_name=\"{service}\"}[5m])",
              "legendFormat": "mean wait",
              "exemplar": false
            }
          ]
        }
      - |
        {
          "type": "timeseries",
          "title": "PG pool empty acquires",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "increase(vg_pgkit_pool_empty_acquires_total{service_name=\"{service}\"}[5m])",
              "legendFormat": "empty acquires",
              "exemplar": false
            }
          ]
        }
      - |
        {
          "type": "timeseries",
          "title": "PG server connections vs max",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(pg_stat_activity_count{service=\"{service}-pg\"})",
              "legendFormat": "connections",
              "exemplar": false
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "max(pg_settings_max_connections{service=\"{service}-pg\"})",
              "legendFormat": "max",
              "exemplar": false
            }
          ]
        }
      - |
        {
          "type": "timeseries",
          "title": "PG transactions",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(pg_stat_database_xact_commit{service=\"{service}-pg\",datname!~\"template.*\"}[$__rate_interval]))",
              "legendFormat": "commit",
              "exemplar": false
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(pg_stat_database_xact_rollback{service=\"{service}-pg\",datname!~\"template.*\"}[$__rate_interval]))",
              "legendFormat": "rollback",
              "exemplar": false
            }
          ]
        }
  mongo:
    panels:
      - |
        {
          "type": "timeseries",
          "title": "Mongo pool connections",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "vg_mongokit_pool_connections{service_name=\"{service}\"}",
              "legendFormat": "open",
              "exemplar": false
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "vg_mongokit_pool_connections_idle{service_name=\"{service}\"}",
              "legendFormat": "idle",
              "exemplar": false
            },
            {
              "refId": "C",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "vg_mongokit_pool_connections_max{service_name=\"{service}\"}",
              "legendFormat": "max",
              "exemplar": false
            }
          ]
        }
      - |
        {
          "type": "timeseries",
          "title": "Mongo pool acquire rate",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "rate(vg_mongokit_pool_acquires_total{service_name=\"{service}\"}[$__rate_interval])",
              "legendFormat": "acquires",
              "exemplar": false
            }
          ]
        }
      - |
        {
          "type": "timeseries",
          "title": "Mongo pool cleared events",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "increase(vg_mongokit_pool_cleared_total{service_name=\"{service}\"}[5m])",
              "legendFormat": "cleared",
              "exemplar": false
            }
          ]
        }
  valkey:
    panels:
      - |
        {
          "type": "timeseries",
          "title": "Valkey pool connections",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "vg_valkeykit_pool_connections{service_name=\"{service}\"}",
              "legendFormat": "open",
              "exemplar": false
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "vg_valkeykit_pool_connections_idle{service_name=\"{service}\"}",
              "legendFormat": "idle",
              "exemplar": false
            }
          ]
        }
      - |
        {
          "type": "timeseries",
          "title": "Valkey pool acquire outcomes",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "rate(vg_valkeykit_pool_hits_total{service_name=\"{service}\"}[$__rate_interval])",
              "legendFormat": "hits",
              "exemplar": false
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "rate(vg_valkeykit_pool_misses_total{service_name=\"{service}\"}[$__rate_interval])",
              "legendFormat": "misses",
              "exemplar": false
            },
            {
              "refId": "C",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "rate(vg_valkeykit_pool_timeouts_total{service_name=\"{service}\"}[$__rate_interval])",
              "legendFormat": "timeouts",
              "exemplar": false
            }
          ]
        }
      - |
        {
          "type": "timeseries",
          "title": "Valkey pool reuse ratio",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percentunit" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "rate(vg_valkeykit_pool_hits_total{service_name=\"{service}\"}[5m]) / (rate(vg_valkeykit_pool_hits_total{service_name=\"{service}\"}[5m]) + rate(vg_valkeykit_pool_misses_total{service_name=\"{service}\"}[5m]))",
              "legendFormat": "reuse ratio",
              "exemplar": false
            }
          ]
        }
      - |
        {
          "type": "timeseries",
          "title": "Valkey server memory",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "redis_memory_used_bytes{service=\"{service}-valkey\"}",
              "legendFormat": "used",
              "exemplar": false
            }
          ]
        }
      - |
        {
          "type": "timeseries",
          "title": "Valkey evictions and clients",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "rate(redis_evicted_keys_total{service=\"{service}-valkey\"}[$__rate_interval])",
              "legendFormat": "evictions",
              "exemplar": false
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "redis_connected_clients{service=\"{service}-valkey\"}",
              "legendFormat": "clients",
              "exemplar": false
            }
          ]
        }
      - |
        {
          "type": "timeseries",
          "title": "Valkey keyspace hit ratio",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percentunit" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "rate(redis_keyspace_hits_total{service=\"{service}-valkey\"}[5m]) / (rate(redis_keyspace_hits_total{service=\"{service}-valkey\"}[5m]) + rate(redis_keyspace_misses_total{service=\"{service}-valkey\"}[5m]))",
              "legendFormat": "hit ratio",
              "exemplar": false
            }
          ]
        }
  fail_open:
    panels:
      - |
        {
          "type": "timeseries",
          "title": "Valkey fail-open events by op",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (op) (increase(vg_{service}_cache_fail_open_total[5m]))",
              "legendFormat": "{{op}}",
              "exemplar": false
            }
          ]
        }
