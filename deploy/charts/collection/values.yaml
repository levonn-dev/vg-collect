image:
  repository: vgkeep/collection
  tag: dev
  pullPolicy: IfNotPresent

replicas: 1

env:
  jwksUrl: http://auth:8080/.well-known/jwks.json
  jwtIssuer: vgkeep-auth
  jwtAudience: vgkeep
  enrichmentServiceUrl: http://enrichment:8080
  valkeyUrl: rediss://collection-valkey:6379/0
  dashboardCacheTtl: 5m

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { memory: 128Mi }

# The daily entry rematch: a CronJob exchanges the shared internal
# secret for a short-lived service JWT at auth (POST
# /internal/service-token), then POSTs the cluster-internal rematch
# endpoint with that bearer. Scheduled an hour after enrichment's
# catalog refresh (0 6): the offset serializes the two nightly jobs
# against the shared provider budget, though correctness never depends
# on which one runs first.
rematch:
  schedule: "0 7 * * *"
  image: curlimages/curl:8.14.1

postgres:
  enabled: true            # the prod-path seam: disable + point DATABASE_URL at RDS/CNPG
  image: postgres:17-alpine
  database: collection
  username: collection
  storage: 1Gi
  exporterImage: quay.io/prometheuscommunity/postgres-exporter:v0.20.0
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }

valkey:
  enabled: true            # the prod-path seam: disable + point valkeyUrl at a managed cache
  image: valkey/valkey:8-alpine
  exporterImage: oliver006/redis_exporter:v1.86.0
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 128Mi }

otel:
  # OTLP gRPC endpoint for traces, metrics and logs. Empty string
  # disables export entirely (the service logs JSON to stdout only).
  exporterEndpoint: http://otel-agent.vg-platform.svc.cluster.local:4317

secretStore:
  name: vg-fake
  kind: ClusterSecretStore
  passwordKey: collection/pg-password
  internalServiceTokenKey: auth/internal-service-token
