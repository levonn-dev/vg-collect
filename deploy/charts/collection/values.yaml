image:
  repository: vgkeep/collection
  tag: dev
  pullPolicy: IfNotPresent

replicas: 1

env:
  jwksUrl: http://auth:8080/.well-known/jwks.json
  jwtIssuer: vgkeep-auth
  jwtAudience: vgkeep
  enrichmentServiceUrl: http://enrichment:8080
  valkeyUrl: rediss://collection-valkey:6379/0
  dashboardCacheTtl: 5m

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { memory: 128Mi }

# CronJob exchanges the shared internal secret for a service JWT at auth (POST /internal/service-token),
# then POSTs the internal rematch endpoint with that bearer; scheduled an hour after enrichment's 0 6 refresh to serialize shared provider-budget usage (order doesn't affect correctness).
rematch:
  schedule: "0 7 * * *"
  image: curlimages/curl:8.14.1

postgres:
  enabled: true            # the prod-path seam: disable + point DATABASE_URL at RDS/CNPG
  image: postgres:17-alpine
  database: collection
  username: collection
  storage: 1Gi
  exporterImage: quay.io/prometheuscommunity/postgres-exporter:v0.20.0
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }
  exporterResources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { memory: 32Mi }

valkey:
  enabled: true            # the prod-path seam: disable + point valkeyUrl at a managed cache
  image: valkey/valkey:8-alpine
  exporterImage: oliver006/redis_exporter:v1.86.0
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 128Mi }
  exporterResources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { memory: 32Mi }

otel:
  # OTLP gRPC endpoint for traces/metrics/logs; empty string disables export (JSON stdout logs only).
  exporterEndpoint: http://otel-agent.vg-platform.svc.cluster.local:4317

secretStore:
  name: vg-fake
  kind: ClusterSecretStore
  passwordKey: collection/pg-password
  internalServiceTokenKey: auth/internal-service-token
