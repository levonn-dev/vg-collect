{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-pg
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-pg
    app.kubernetes.io/part-of: vgkeep
spec:
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}-pg
  ports:
    - { name: pg, port: 5432, targetPort: pg }
    - name: metrics
      port: 9187
      targetPort: metrics
{{- end }}
