apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels: {{- include "collection.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
  template:
    metadata:
      labels: {{- include "collection.labels" . | nindent 8 }}
      annotations:
        # Re-rolls pods when the secret shape changes; value rotation re-rolls via Tilt re-apply in dev.
        checksum/externalsecret: {{ include (print $.Template.BasePath "/externalsecret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Chart.Name }}
      securityContext:
        runAsNonRoot: true
        # Numeric uid so the kubelet can verify runAsNonRoot (distroless nonroot = 65532).
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # migrate loads the full config before branching, so the init container reuses the app's env anchor.
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          securityContext: &appSecCtx
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
          env: &appEnv
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef: { name: collection-pg-credentials, key: password }
            - name: DATABASE_URL
              value: "postgres://{{ .Values.postgres.username }}:$(PG_PASSWORD)@{{ include "collection.pgHost" . }}:5432/{{ .Values.postgres.database }}?sslmode=verify-full&sslrootcert=/etc/vg/pg-ca/ca.crt"
            - name: VALKEY_URL
              value: {{ .Values.env.valkeyUrl | quote }}
            {{- if .Values.valkey.enabled }}
            - name: VALKEY_CA_FILE
              value: /etc/vg/valkey-ca/ca.crt
            {{- end }}
            - name: JWKS_URL
              value: {{ .Values.env.jwksUrl | quote }}
            - name: JWT_ISSUER
              value: {{ .Values.env.jwtIssuer | quote }}
            - name: JWT_AUDIENCE
              value: {{ .Values.env.jwtAudience | quote }}
            - name: ENRICHMENT_SERVICE_URL
              value: {{ .Values.env.enrichmentServiceUrl | quote }}
            - name: DASHBOARD_CACHE_TTL
              value: {{ .Values.env.dashboardCacheTtl | quote }}
            # Stamped onto telemetry as service.version; the image tag is the truth of what's running ("dev" locally, a release tag in pipelines).
            - name: SERVICE_VERSION
              value: {{ .Values.image.tag | quote }}
            {{- if .Values.otel.exporterEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.exporterEndpoint | quote }}
            {{- end }}
          volumeMounts: &caMounts
            - name: pg-ca
              mountPath: /etc/vg/pg-ca
              readOnly: true
            {{- if .Values.valkey.enabled }}
            - name: valkey-ca
              mountPath: /etc/vg/valkey-ca
              readOnly: true
            {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
          securityContext: *appSecCtx
          env: *appEnv
          volumeMounts: *caMounts
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: pg-ca
          secret:
            secretName: collection-pg-tls
            items: [{ key: ca.crt, path: ca.crt }]
        {{- if .Values.valkey.enabled }}
        - name: valkey-ca
          secret:
            secretName: collection-valkey-tls
            items: [{ key: ca.crt, path: ca.crt }]
        {{- end }}
