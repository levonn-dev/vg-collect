{{ include "vg-lib.pg.ownerOnly" . }}
{{ include "vg-lib.valkey.ownerOnly" . }}
# Collection's callers: bff (the whole surface is browser-driven), social (shelf resolves for
# follows/likes/comments), and the rematch CronJob (JWT via auth, then a normal bearer here; this is the outer admission layer).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: collection-from-callers-only
  labels: {{- include "collection.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bff
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: social
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Chart.Name }}-rematch
      ports:
        - { port: 8080, protocol: TCP }
