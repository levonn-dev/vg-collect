apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Chart.Name }}-rematch
  labels: {{- include "collection.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.rematch.schedule | quote }}
  # The service holds its own in-flight guard (409); Forbid keeps k8s from starting an overlapping trigger.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ .Chart.Name }}-rematch
            app.kubernetes.io/part-of: vgkeep
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            # Numeric uid so the kubelet can verify runAsNonRoot (curlimages/curl = 100:101).
            runAsUser: 100
            runAsGroup: 101
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: trigger
              image: {{ .Values.rematch.image | quote }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
                readOnlyRootFilesystem: true
              env:
                - name: INTERNAL_SERVICE_TOKEN
                  valueFrom:
                    secretKeyRef: { name: collection-secrets, key: internal-service-token }
              command: ["/bin/sh", "-c"]
              # Dependency-ordered chain: normalize-platforms, then normalize-regions (display re-picks ride
              # it), then rematch-entries, so a just-promoted region's pricing class corrects in the same run. && surfaces failures; the sweeps answer synchronous counts, rematch-entries answers 202 and detaches.
              args:
                - >-
                  set -e -o pipefail;
                  TOKEN=$(curl -fsS -X POST --max-time 30
                  -H "X-Internal-Token: $INTERNAL_SERVICE_TOKEN"
                  -H "Content-Type: application/json"
                  -d '{"service":"entry-rematch"}'
                  http://auth:8080/internal/service-token
                  | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
                  && curl -fsS -X POST --max-time 60
                  -H "Authorization: Bearer $TOKEN"
                  http://collection:8080/internal/normalize-platforms
                  && curl -fsS -X POST --max-time 60
                  -H "Authorization: Bearer $TOKEN"
                  http://collection:8080/internal/normalize-regions
                  && curl -fsS -X POST --max-time 60
                  -H "Authorization: Bearer $TOKEN"
                  http://collection:8080/internal/rematch-entries
              resources:
                requests: { cpu: 10m, memory: 16Mi }
                limits: { memory: 32Mi }
