apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: collection-pg-credentials
  labels: {{- include "collection.labels" . | nindent 4 }}
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: collection-pg-credentials
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.secretStore.passwordKey }}
