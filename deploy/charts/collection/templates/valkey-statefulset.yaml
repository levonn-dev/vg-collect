{{- if .Values.valkey.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: collection-valkey
  labels: {{- include "collection.labels" . | nindent 4 }}
spec:
  serviceName: collection-valkey
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: collection-valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: collection-valkey
        app.kubernetes.io/part-of: vg-collect
    spec:
      initContainers:
        # Secret mounts are read-only and root-owned; copy and chown so
        # the valkey user (uid 999, gid 1000 in valkey/valkey alpine
        # images) owns its key material.
        - name: tls-perms
          image: busybox:1.37
          command: ["sh", "-c", "cp /tls-src/* /tls/ && chmod 600 /tls/tls.key && chown 999:1000 /tls/*"]
          volumeMounts:
            - { name: tls-src, mountPath: /tls-src, readOnly: true }
            - { name: tls, mountPath: /tls }
      containers:
        - name: valkey
          image: {{ .Values.valkey.image | quote }}
          args:
            # TLS-only listener; client cert auth off (the CA gates
            # server identity, NetworkPolicy gates callers). Cache
            # semantics: no persistence - the dashboard cache rebuilds
            # from Postgres and enrichment on a restart.
            - --tls-port
            - "6379"
            - --port
            - "0"
            - --tls-cert-file
            - /tls/tls.crt
            - --tls-key-file
            - /tls/tls.key
            - --tls-ca-cert-file
            - /tls/ca.crt
            - --tls-auth-clients
            - "no"
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - { name: valkey, containerPort: 6379 }
          readinessProbe:
            exec:
              command: ["valkey-cli", "--tls", "--cacert", "/tls/ca.crt", "-p", "6379", "ping"]
            periodSeconds: 5
          resources: {{- toYaml .Values.valkey.resources | nindent 12 }}
          volumeMounts:
            - { name: tls, mountPath: /tls }
            - { name: data, mountPath: /data }
        - name: metrics
          image: {{ .Values.valkey.exporterImage | quote }}
          env:
            - name: REDIS_ADDR
              value: rediss://localhost:6379
            - name: REDIS_EXPORTER_TLS_CA_CERT_FILE
              value: /metrics-ca/ca.crt
          ports:
            - name: metrics
              containerPort: 9121
          volumeMounts:
            - name: metrics-ca
              mountPath: /metrics-ca
              readOnly: true
      volumes:
        - name: tls-src
          secret: { secretName: collection-valkey-tls }
        - name: tls
          emptyDir: {}
        - name: data
          emptyDir: {}
        - name: metrics-ca
          secret:
            secretName: collection-valkey-tls
            items:
              - key: ca.crt
                path: ca.crt
{{- end }}
