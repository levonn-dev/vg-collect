apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: {{ .Chart.Name }}
  labels: {{- include "bff.labels" . | nindent 4 }}
spec:
  ingressClassName: apisix
  http:
    # kubelet probes hit the pod directly; this route exists only to 404 external calls instead of proxying
    # (fault-injection aborts pre-proxy; backends is CRD-required boilerplate, unused).
    - name: internal-probes
      priority: 20
      match:
        paths: ["/healthz", "/readyz"]
      backends:
        - serviceName: {{ .Chart.Name }}
          servicePort: 8080
      plugins:
        - name: fault-injection
          enable: true
          config:
            abort:
              http_status: 404
    - name: auth-endpoints
      priority: 10
      match:
        paths: ["/api/auth/*"]
      backends:
        - serviceName: {{ .Chart.Name }}
          servicePort: 8080
      plugins:
        - name: limit-count
          enable: true
          config:
            count: {{ .Values.rateLimit.authPerMinute }}
            time_window: 60
            key_type: var
            key: remote_addr
            rejected_code: 429
            policy: local
        - name: prometheus
          enable: true
          config:
            prefer_name: true
    - name: api
      priority: 5
      match:
        paths: ["/api/*"]
      backends:
        - serviceName: {{ .Chart.Name }}
          servicePort: 8080
      plugins:
        - name: limit-count
          enable: true
          config:
            count: {{ .Values.rateLimit.apiPerMinute }}
            time_window: 60
            key_type: var
            key: remote_addr
            rejected_code: 429
            policy: local
        - name: prometheus
          enable: true
          config:
            prefer_name: true
    - name: app
      priority: 1
      match:
        paths: ["/*"]
      backends:
        - serviceName: {{ .Chart.Name }}
          servicePort: 8080
      plugins:
        - name: prometheus
          enable: true
          config:
            prefer_name: true
