{{- if .Values.valkey.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bff-valkey
  labels: {{- include "bff.labels" . | nindent 4 }}
spec:
  serviceName: bff-valkey
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bff-valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bff-valkey
        app.kubernetes.io/part-of: vg-collect
    spec:
      initContainers:
        # Secret mounts are read-only and root-owned; copy and chown so
        # the valkey user (uid 999, gid 1000 in valkey/valkey alpine
        # images) owns its key material. Valkey does not enforce key
        # permissions the way postgres does; tight modes by choice.
        - name: tls-perms
          image: busybox:1.37
          command: ["sh", "-c", "cp /tls-src/* /tls/ && chmod 600 /tls/tls.key && chown 999:1000 /tls/*"]
          volumeMounts:
            - { name: tls-src, mountPath: /tls-src, readOnly: true }
            - { name: tls, mountPath: /tls }
      containers:
        - name: valkey
          image: {{ .Values.valkey.image | quote }}
          args:
            # TLS-only listener; client cert auth off (the CA gates
            # server identity, NetworkPolicy gates callers). Cache
            # semantics: no persistence. Denylist entries live at most
            # accessTokenTtl + leeway, so losing them on a restart is
            # the accepted fail-open posture, not data loss.
            - --tls-port
            - "6379"
            - --port
            - "0"
            - --tls-cert-file
            - /tls/tls.crt
            - --tls-key-file
            - /tls/tls.key
            - --tls-ca-cert-file
            - /tls/ca.crt
            - --tls-auth-clients
            - "no"
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - { name: valkey, containerPort: 6379 }
          readinessProbe:
            exec:
              command: ["valkey-cli", "--tls", "--cacert", "/tls/ca.crt", "-p", "6379", "ping"]
            periodSeconds: 5
          resources: {{- toYaml .Values.valkey.resources | nindent 12 }}
          volumeMounts:
            - { name: tls, mountPath: /tls }
            - { name: data, mountPath: /data }
      volumes:
        - name: tls-src
          secret: { secretName: bff-valkey-tls }
        - name: tls
          emptyDir: {}
        - name: data
          emptyDir: {}
{{- end }}
