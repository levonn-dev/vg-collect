apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: bff-secrets
  labels: {{- include "bff.labels" . | nindent 4 }}
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: bff-secrets
  data:
    - secretKey: cookie-key
      remoteRef:
        key: {{ .Values.secretStore.keys.cookieKey }}
