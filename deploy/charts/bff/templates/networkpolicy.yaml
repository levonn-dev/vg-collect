{{ include "vg-lib.valkey.ownerOnly" . }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bff-from-gateway-only
  labels: {{- include "bff.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        # Namespace AND pod selector together: only the APISIX data plane in the gateway namespace, not any pod there.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.gateway.namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: apisix
      ports:
        - { port: 8080, protocol: TCP }
