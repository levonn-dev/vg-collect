apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels: {{- include "bff.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
  template:
    metadata:
      labels: {{- include "bff.labels" . | nindent 8 }}
      annotations:
        # Re-rolls pods when the secret shape changes; value rotation re-rolls via Tilt re-apply in dev.
        checksum/externalsecret: {{ include (print $.Template.BasePath "/externalsecret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Chart.Name }}
      securityContext:
        runAsNonRoot: true
        # Numeric uid so the kubelet can verify runAsNonRoot (distroless nonroot = 65532).
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      # No init container: the bff has no database and no migrations.
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
          env:
            - name: COOKIE_KEY
              valueFrom:
                secretKeyRef: { name: bff-secrets, key: cookie-key }
            - name: COOKIE_SECURE
              value: {{ .Values.env.cookieSecure | quote }}
            - name: PUBLIC_ORIGINS
              value: {{ .Values.env.publicOrigins | quote }}
            - name: AUTH_SERVICE_URL
              value: {{ .Values.env.authServiceUrl | quote }}
            - name: USER_SERVICE_URL
              value: {{ .Values.env.userServiceUrl | quote }}
            - name: ENRICHMENT_SERVICE_URL
              value: {{ .Values.env.enrichmentServiceUrl | quote }}
            - name: COLLECTION_SERVICE_URL
              value: {{ .Values.env.collectionServiceUrl | quote }}
            - name: SOCIAL_SERVICE_URL
              value: {{ .Values.env.socialServiceUrl | quote }}
            - name: VALKEY_URL
              value: {{ .Values.env.valkeyUrl | quote }}
            {{- if .Values.valkey.enabled }}
            - name: VALKEY_CA_FILE
              value: /etc/vg/valkey-ca/ca.crt
            {{- end }}
            - name: ACCESS_TOKEN_TTL
              value: {{ .Values.env.accessTokenTtl | quote }}
            - name: REFRESH_WINDOW
              value: {{ .Values.env.refreshWindow | quote }}
            - name: ME_CACHE_TTL
              value: {{ .Values.env.meCacheTtl | quote }}
            - name: RECS_CACHE_TTL
              value: {{ .Values.env.recsCacheTtl | quote }}
            - name: SERVE_STATIC
              value: {{ .Values.env.serveStatic | quote }}
            # Stamped onto telemetry as service.version; the image tag is the truth of what's running.
            - name: SERVICE_VERSION
              value: {{ .Values.image.tag | quote }}
            {{- if .Values.otel.exporterEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.exporterEndpoint | quote }}
            {{- end }}
            {{- if .Values.otel.proxyUrl }}
            - name: OTLP_PROXY_URL
              value: {{ .Values.otel.proxyUrl | quote }}
            {{- end }}
          {{- if .Values.valkey.enabled }}
          volumeMounts:
            - name: valkey-ca
              mountPath: /etc/vg/valkey-ca
              readOnly: true
          {{- end }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          resources: {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.valkey.enabled }}
      volumes:
        - name: valkey-ca
          secret:
            secretName: bff-valkey-tls
            items: [{ key: ca.crt, path: ca.crt }]
      {{- end }}
