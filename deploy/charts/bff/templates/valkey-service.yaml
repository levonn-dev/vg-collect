{{- if .Values.valkey.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: bff-valkey
  labels:
    app.kubernetes.io/name: bff-valkey
    app.kubernetes.io/part-of: vgkeep
spec:
  selector:
    app.kubernetes.io/name: bff-valkey
  ports:
    - { name: valkey, port: 6379, targetPort: valkey }
    - name: metrics
      port: 9121
      targetPort: metrics
{{- end }}
