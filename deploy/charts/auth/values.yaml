image:
  repository: vgkeep/auth
  tag: dev
  pullPolicy: IfNotPresent

replicas: 1

env:
  jwtIssuer: vgkeep-auth
  jwtAudience: vgkeep
  # Must match the bff chart's accessTokenTtl; bff sizes denylist TTLs off this value.
  accessTokenTtl: 5m
  refreshTokenTtl: 720h
  userServiceUrl: http://user:8080
  # Public callback URL registered with real providers (gateway's /api/auth/callback); required only
  # when Google or Twitch credentials are supplied.
  oauthRedirectUrl: ""
  googleIssuerUrl: https://accounts.google.com
  twitchIssuerUrl: https://id.twitch.tv/oauth2
  # Dev fixtures only; production MUST set this false (dev token endpoint then answers 404).
  devProviderEnabled: true

# Zero-downtime rotation of the internal service secret (docs/runbooks/auth.md): true also accepts
# auth/internal-service-token-previous while the CronJobs still present the old value.
previousTokenEnabled: false

# Signing-key rotation (manual; docs/runbooks/auth.md): the new kid joins the JWKS via redeploy; retire
# the old row only after the last token signed with it expires (access TTL).
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { memory: 128Mi }

postgres:
  enabled: true            # the prod-path seam: disable + point DATABASE_URL at RDS/CNPG
  image: postgres:17-alpine
  database: auth
  username: auth
  storage: 1Gi
  exporterImage: quay.io/prometheuscommunity/postgres-exporter:v0.20.0
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }
  exporterResources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { memory: 32Mi }

providers:
  # Set true only when the client-id/secret keys are present in the secret store; when false the
  # ExternalSecret and deployment omit those keys/env vars, so the auth service sees empty strings and stays disabled.
  google:
    enabled: false
  twitch:
    enabled: false

otel:
  # OTLP gRPC endpoint for traces/metrics/logs; empty string disables export (JSON stdout logs only).
  exporterEndpoint: http://otel-agent.vg-platform.svc.cluster.local:4317

secretStore:
  name: vg-fake
  kind: ClusterSecretStore
  keys:
    pgPassword: auth/pg-password
    jwtSigningKey: auth/jwt-signing-key
    googleClientId: auth/google-client-id
    googleClientSecret: auth/google-client-secret
    twitchClientId: auth/twitch-client-id
    twitchClientSecret: auth/twitch-client-secret
    internalServiceToken: auth/internal-service-token
    internalServiceTokenPrevious: auth/internal-service-token-previous
