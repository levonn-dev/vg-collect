{{- if .Values.postgres.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: auth-pg
  labels: {{- include "auth.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-pg
  endpoints:
    - port: metrics
      interval: 30s
{{- end }}
