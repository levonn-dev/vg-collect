{{- if .Values.postgres.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-pg-owner-only
  labels: {{- include "auth.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: auth-pg
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: auth
      ports:
        - { port: 5432, protocol: TCP }
{{- end }}
---
# Auth's callers: the bff (login + token lifecycle) and every
# JWT-validating service fetching the JWKS (today: user, enrichment).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-from-callers-only
  labels: {{- include "auth.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: auth
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bff
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: user
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: enrichment
      ports:
        - { port: 8080, protocol: TCP }
