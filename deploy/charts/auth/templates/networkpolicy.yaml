{{- if .Values.postgres.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-pg-owner-only
  labels: {{- include "auth.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: auth-pg
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: auth
      ports:
        - { port: 5432, protocol: TCP }
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vg-platform
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9187
{{- end }}
---
# Auth's callers: the bff (login + token lifecycle), every
# JWT-validating service fetching the JWKS (today: user, enrichment,
# collection, social), and the two CronJobs (catalog-refresh,
# entry-rematch) exchanging the shared internal secret for a service
# JWT at POST /internal/service-token.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-from-callers-only
  labels: {{- include "auth.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: auth
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bff
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: user
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: enrichment
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: collection
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: social
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: enrichment-refresh
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: collection-rematch
      ports:
        - { port: 8080, protocol: TCP }
