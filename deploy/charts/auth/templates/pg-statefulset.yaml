{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: auth-pg
  labels: {{- include "auth.labels" . | nindent 4 }}
spec:
  serviceName: auth-pg
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-pg
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-pg
        app.kubernetes.io/part-of: vg-collect
    spec:
      initContainers:
        # postgres requires the TLS key to be 0600 and owned by postgres
        # (uid 70 in alpine); secret mounts are read-only, so copy first.
        - name: tls-perms
          image: busybox:1.37
          command: ["sh", "-c", "cp /tls-src/* /tls/ && chmod 600 /tls/tls.key && chown 70:70 /tls/*"]
          volumeMounts:
            - { name: tls-src, mountPath: /tls-src, readOnly: true }
            - { name: tls, mountPath: /tls }
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          args:
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/tls/tls.crt
            - -c
            - ssl_key_file=/tls/tls.key
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: auth-secrets, key: pg-password }
          ports:
            - { name: pg, containerPort: 5432 }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.username | quote }}]
            periodSeconds: 5
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - { name: tls, mountPath: /tls }
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: tls-src
          secret: { secretName: auth-pg-tls }
        - name: tls
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
{{- end }}
