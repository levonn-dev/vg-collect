apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: auth-secrets
  labels: {{- include "auth.labels" . | nindent 4 }}
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: auth-secrets
  data:
    - secretKey: jwt-signing-key
      remoteRef:
        key: {{ .Values.secretStore.keys.jwtSigningKey }}
    {{- if .Values.providers.google.enabled }}
    - secretKey: google-client-id
      remoteRef:
        key: {{ .Values.secretStore.keys.googleClientId }}
    - secretKey: google-client-secret
      remoteRef:
        key: {{ .Values.secretStore.keys.googleClientSecret }}
    {{- end }}
    {{- if .Values.providers.twitch.enabled }}
    - secretKey: twitch-client-id
      remoteRef:
        key: {{ .Values.secretStore.keys.twitchClientId }}
    - secretKey: twitch-client-secret
      remoteRef:
        key: {{ .Values.secretStore.keys.twitchClientSecret }}
    {{- end }}
    - secretKey: internal-service-token
      remoteRef:
        key: {{ .Values.secretStore.keys.internalServiceToken }}
    {{- if .Values.previousTokenEnabled }}
    - secretKey: internal-service-token-previous
      remoteRef:
        key: {{ .Values.secretStore.keys.internalServiceTokenPrevious }}
    {{- end }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: auth-pg-credentials
  labels: {{- include "auth.labels" . | nindent 4 }}
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: auth-pg-credentials
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.secretStore.keys.pgPassword }}
