image:
  repository: vgkeep/user
  tag: dev
  pullPolicy: IfNotPresent

replicas: 1

env:
  jwksUrl: http://auth:8080/.well-known/jwks.json
  jwtIssuer: vgkeep-auth
  jwtAudience: vgkeep
  handleChangeCooldown: 24h

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { memory: 128Mi }

postgres:
  enabled: true            # the prod-path seam: disable + set externalUrl for RDS/CNPG
  image: postgres:17-alpine
  database: user
  username: user
  storage: 1Gi
  exporterImage: quay.io/prometheuscommunity/postgres-exporter:v0.20.0
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }

otel:
  # OTLP gRPC endpoint for traces, metrics and logs. Empty string
  # disables export entirely (the service logs JSON to stdout only).
  exporterEndpoint: http://otel-agent.vg-platform.svc.cluster.local:4317

secretStore:
  name: vg-fake
  kind: ClusterSecretStore
  passwordKey: user/pg-password
