{{ include "vg-lib.pg.ownerOnly" . }}
# User's callers: auth (profile upsert + role reads at mint/refresh),
# the bff (me composition), and social (followee validation).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: user-from-callers-only
  labels: {{- include "user.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: auth
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bff
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: social
      ports:
        - { port: 8080, protocol: TCP }
