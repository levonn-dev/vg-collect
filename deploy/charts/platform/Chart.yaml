apiVersion: v2
name: vg-platform
description: Third-party platform dependencies for vg-collect (cert-manager, external-secrets, APISIX, and the observability stack)
type: application
version: 0.1.0
dependencies:
  - name: cert-manager
    version: v1.16.2
    repository: https://charts.jetstack.io
  - name: external-secrets
    version: 0.12.1
    repository: https://charts.external-secrets.io
  - name: apisix
    version: 2.14.1
    repository: https://charts.apiseven.com
  - name: kube-prometheus-stack
    version: 87.10.1
    repository: https://prometheus-community.github.io/helm-charts
  - name: loki
    version: 6.55.0
    repository: https://grafana.github.io/helm-charts
  - name: jaeger
    version: 4.11.1
    repository: https://jaegertracing.github.io/helm-charts
  - name: grafana
    version: 10.5.15
    repository: https://grafana.github.io/helm-charts
  - name: opentelemetry-collector
    version: 0.162.0
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
    alias: otel-agent
  - name: opentelemetry-collector
    version: 0.162.0
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
    alias: otel-gateway
