apiVersion: v1
kind: ConfigMap
metadata:
  name: vg-alerting
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: vgkeep
    # Matches the chart's sidecar.alerts.label default so the alerts sidecar picks this ConfigMap up and
    # POSTs the reload endpoint on change.
    grafana_alert: "1"
data:
{{- range $path, $_ := .Files.Glob "files/alerting/*.yaml" }}
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
