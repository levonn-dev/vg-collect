cert-manager:
  crds:
    enabled: true
external-secrets:
  installCRDs: true
apisix:
  # Dev reaches the gateway via kubectl port-forward; LoadBalancer/NodePort behavior varies across clusters.
  service:
    type: ClusterIP
    # Chart defaults externalTrafficPolicy to Cluster, invalid on ClusterIP; empty emits a YAML null, which
    # admission treats as unset. Drop this override if the gateway type changes to NodePort/LoadBalancer.
    externalTrafficPolicy: ""
  # Single-node etcd: dev tier, no HA; accepted trade-off of the bundled etcd-backed APISIX mode.
  etcd:
    replicaCount: 1
    # Disabled: the hook deadlocks on first install (needs a secret only the install creates); single-node
    # dev etcd has no obsolete members to remove anyway.
    preUpgradeJob:
      enabled: false
  ingress-controller:
    enabled: true
    # Controller 2.x IngressClass apisix plus a default GatewayProxy; routes opt in via spec.ingressClassName: apisix.
    gatewayProxy:
      createDefault: true
      provider:
        controlPlane:
          service:
            name: vg-platform-apisix-admin
            port: 9180
          auth:
            type: AdminKey
            adminKey:
              # Chart's default admin key; fine for dev since the admin API is ClusterIP-only, never gateway-exposed.
              # Production must override this together with apisix.admin.credentials.admin.
              value: edd1c9f034335f136f87ad84b625c8f1
    # Disabled: webhook validation needs APISIX 3.17+; this release runs 3.16.
    webhook:
      enabled: false
  # Top-level key (sibling of service/etcd/ingress-controller), not the inner apisix: block below;
  # controls the ServiceMonitor CR.
  metrics:
    serviceMonitor:
      enabled: true
  # Inner apisix: config block (data-plane runtime). prometheus.enabled turns on the plugin and the
  # 9091 metrics port the ServiceMonitor above targets.
  apisix:
    prometheus:
      enabled: true
kube-prometheus-stack:
  fullnameOverride: kps
  # Drops the redundant operator-name infix (kps-prometheus, not kps-kube-prometheus-st-prometheus).
  cleanPrometheusOperatorObjectNames: true
  # Alerting is Grafana unified alerting via grafana.sidecar.alerts below; stock Prometheus rules and
  # Alertmanager stay off so there is exactly one alerting authority.
  defaultRules:
    create: false
  alertmanager:
    enabled: false
  # Grafana ships as its own pinned chart dependency with full file provisioning; the bundled one stays off.
  grafana:
    enabled: false
  # Control-plane scrape targets do not exist on managed/dev clusters (Docker Desktop); would be permanently down.
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeProxy:
    enabled: false
  prometheus:
    prometheusSpec:
      # The OTel gateway pushes metrics here (prometheusremotewrite).
      enableRemoteWriteReceiver: true
      # Browser telemetry relayed by the bff shares one series identity across concurrent sessions; without a
      # tolerance window, out-of-order samples from interleaved client clocks are rejected and dropped.
      tsdb:
        outOfOrderTimeWindow: 30m
      # Exemplars ride the remote-write stream and back Grafana's metrics-to-traces links.
      enableFeatures:
        - exemplar-storage
      retention: 24h
      # Discover ServiceMonitors/PodMonitors everywhere regardless of release labels; service charts own their monitors.
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      serviceMonitorNamespaceSelector: {}
      podMonitorNamespaceSelector: {}
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1Gi
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 2Gi
loki:
  fullnameOverride: loki
  deploymentMode: SingleBinary
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2026-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      # OTLP ingestion stores trace_id/span_id/severity_text as structured metadata.
      allow_structured_metadata: true
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 2Gi
  # Zero out the scalable-mode targets; SingleBinary owns everything.
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  gateway:
    enabled: false
  lokiCanary:
    enabled: false
  test:
    enabled: false
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  monitoring:
    selfMonitoring:
      enabled: false
      grafanaAgent:
        installOperator: false
    serviceMonitor:
      enabled: false
jaeger:
  fullnameOverride: jaeger
  # v2 all-in-one with in-memory storage; traces do not survive a pod restart, accepted for dev.
  # Chart names the all-in-one component "jaeger" too, so resources nest one level deeper: jaeger.jaeger.resources.
  jaeger:
    resources:
      limits:
        memory: 512Mi
  # userconfig's --config REPLACES the embedded all-in-one config wholesale; this is a verbatim copy of
  # jaegertracing/jaeger:2.19.0's cmd/jaeger/internal/all-in-one.yaml, changed only to cap max_traces at 25000
  # (was 100000): the default overruns the 512Mi limit and OOM-kills lost every stored trace. Re-sync on image upgrades.
  userconfig:
    service:
      extensions: [jaeger_storage, jaeger_query, jaeger_mcp, remote_sampling, healthcheckv2, expvar, zpages]
      pipelines:
        traces:
          receivers: [otlp, jaeger, zipkin]
          processors: [batch]
          exporters: [jaeger_storage_exporter]
      telemetry:
        resource:
          service.name: jaeger
        metrics:
          level: detailed
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: "${env:JAEGER_LISTEN_HOST:-localhost}"
                    port: 8888
        logs:
          level: info
    extensions:
      jaeger_query:
        storage:
          traces: some_storage
      jaeger_mcp:
        http:
          endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:16687"
      jaeger_storage:
        backends:
          some_storage:
            memory:
              max_traces: 25000
      remote_sampling:
        file:
          path:
          default_sampling_probability: 1
          reload_interval: 1s
        http:
          endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:5778"
        grpc:
          endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:5779"
      healthcheckv2:
        use_v2: true
        http:
          endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:13133"
        grpc:
      expvar:
        endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:27777"
      zpages:
        endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:27778"
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:4317"
          http:
            endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:4318"
      jaeger:
        protocols:
          grpc:
            endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:14250"
          thrift_http:
            endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:14268"
          thrift_binary:
            endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:6832"
          thrift_compact:
            endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:6831"
      zipkin:
        endpoint: "${env:JAEGER_LISTEN_HOST:-localhost}:9411"
    processors:
      batch:
    exporters:
      jaeger_storage_exporter:
        trace_storage: some_storage
grafana:
  fullnameOverride: grafana
  # Dev runs credential-less end to end; anonymous gets Admin so demos/alerts/Explore work with zero login.
  # Production must disable anonymous auth and set a real password (docs/production-paths.md).
  adminPassword: admin
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_role: Admin
    analytics:
      reporting_enabled: false
      check_for_updates: false
  # Provisioning is the single source of truth; nothing in the UI needs to survive a restart.
  persistence:
    enabled: false
  testFramework:
    enabled: false
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          uid: prometheus
          type: prometheus
          access: proxy
          url: http://kps-prometheus:9090
          isDefault: true
          jsonData:
            # Metrics arrive via remote-write on the OTel SDK's 15s export cadence, not scrape; $__rate_interval
            # (4x) needs this to span enough samples. Keep in lockstep with the PeriodicReader interval in libs/go/otel.
            timeInterval: "15s"
            # Exemplar dots on histogram panels deep-link to Jaeger.
            exemplarTraceIdDestinations:
              - name: trace_id
                datasourceUid: jaeger
        - name: Loki
          uid: loki
          type: loki
          access: proxy
          url: http://loki:3100
          jsonData:
            # Every OTLP log line carries trace_id as structured metadata; surfaced as a one-click Jaeger link.
            derivedFields:
              - name: trace
                matcherType: label
                matcherRegex: trace_id
                url: "${__value.raw}"
                datasourceUid: jaeger
        - name: Jaeger
          uid: jaeger
          type: jaeger
          access: proxy
          url: http://jaeger:16686
          jsonData:
            tracesToLogsV2:
              datasourceUid: loki
              spanStartTimeShift: "-5m"
              spanEndTimeShift: "5m"
              filterByTraceID: true
              tags:
                - key: service.name
                  value: service_name
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: vg
          orgId: 1
          folder: vgkeep
          type: file
          disableDeletion: false
          options:
            path: /var/lib/grafana/dashboards/vg
  dashboardsConfigMaps:
    vg: vg-dashboards
  # namespaced scopes the grafana ServiceAccount to a Role instead of cluster-wide, but the chart's auto Role
  # rules cover dashboards/datasources/plugins sidecars, not alerts; extraRoleRules below grants the alerts sidecar access.
  rbac:
    namespaced: true
    extraRoleRules:
      - apiGroups: [""] # "" indicates the core API group
        resources: ["configmaps"]
        verbs: ["get", "watch", "list"]
  # The alerts sidecar watches ConfigMaps labeled grafana_alert and POSTs Grafana's reload endpoint on change, so
  # edited/retired rules reach a live cluster on helm upgrade with no Grafana restart; resource: configmap matches the RBAC grant above.
  sidecar:
    alerts:
      enabled: true
      resource: configmap
otel-agent:
  fullnameOverride: otel-agent
  mode: daemonset
  image:
    repository: otel/opentelemetry-collector-contrib
  # Adds the k8sattributes processor and its RBAC; stamps k8s.pod.name/k8s.namespace.name onto everything passing through.
  presets:
    kubernetesAttributes:
      enabled: true
  config:
    exporters:
      otlp:
        endpoint: otel-gateway:4317
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [k8sattributes, batch]
          exporters: [otlp]
        metrics:
          receivers: [otlp]
          processors: [k8sattributes, batch]
          exporters: [otlp]
        logs:
          receivers: [otlp]
          processors: [k8sattributes, batch]
          exporters: [otlp]
  ports:
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false
    # Disabled by default upstream; must be enabled explicitly or the serviceMonitor below has no port to scrape.
    metrics:
      enabled: true
  # Not created by default in daemonset mode; enabling it applies internalTrafficPolicy: Local (the daemonset
  # default once the Service exists) and provides the otel-agent DNS name every other chart targets.
  service:
    enabled: true
  serviceMonitor:
    enabled: true
  resources:
    limits:
      memory: 256Mi

otel-gateway:
  fullnameOverride: otel-gateway
  mode: deployment
  replicaCount: 1
  image:
    repository: otel/opentelemetry-collector-contrib
  config:
    processors:
      # memory_limiter must run first in every pipeline.
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
    exporters:
      prometheusremotewrite:
        endpoint: http://kps-prometheus:9090/api/v1/write
        # Flattens service.name/version/instance.id onto metric labels so dashboard queries avoid target_info joins.
        resource_to_telemetry_conversion:
          enabled: true
        # Remote write needs per-series in-order delivery, but 5 parallel consumers (the default) race under bursty
        # load and drop points to "400 out of order sample" errors; one consumer serializes the stream at no real throughput cost here.
        remote_write_queue:
          num_consumers: 1
      otlphttp/loki:
        endpoint: http://loki:3100/otlp
      otlp/jaeger:
        endpoint: jaeger:4317
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/jaeger]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheusremotewrite]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/loki]
  ports:
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false
    # Disabled by default upstream; must be enabled explicitly or the serviceMonitor below has no port to scrape.
    metrics:
      enabled: true
  serviceMonitor:
    enabled: true
  resources:
    limits:
      memory: 512Mi
