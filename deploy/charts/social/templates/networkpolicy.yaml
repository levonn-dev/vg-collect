{{ include "vg-lib.pg.ownerOnly" . }}
# Social's caller: the bff (the whole social surface is
# browser-driven; no service or cron calls in).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: social-from-callers-only
  labels: {{- include "social.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bff
      ports:
        - { port: 8080, protocol: TCP }
