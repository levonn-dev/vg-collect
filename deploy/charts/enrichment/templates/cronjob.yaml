apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Chart.Name }}-refresh
  labels: {{- include "enrichment.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.refresh.schedule | quote }}
  # The service holds its own in-flight guard (409); Forbid keeps k8s
  # from even starting an overlapping trigger.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ .Chart.Name }}-refresh
            app.kubernetes.io/part-of: vgkeep
        spec:
          restartPolicy: Never
          containers:
            - name: trigger
              image: {{ .Values.refresh.image | quote }}
              env:
                - name: INTERNAL_SERVICE_TOKEN
                  valueFrom:
                    secretKeyRef: { name: enrichment-secrets, key: internal-service-token }
              command: ["/bin/sh", "-c"]
              # Exchange-then-trigger, then the nightly catalog refresh
              # (detaches: 202, work continues after this job exits),
              # with community-region promotion riding the same run so
              # a just-promoted community region is visible on the next
              # catalog read. && keeps failures visible; the normalize
              # sweep answers a synchronous count.
              args:
                - >-
                  TOKEN=$(curl -fsS -X POST --max-time 30
                  -H "X-Internal-Token: $INTERNAL_SERVICE_TOKEN"
                  -H "Content-Type: application/json"
                  -d '{"service":"catalog-refresh"}'
                  http://auth:8080/internal/service-token
                  | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
                  && curl -fsS -X POST --max-time 60
                  -H "Authorization: Bearer $TOKEN"
                  http://enrichment:8080/internal/refresh
                  && curl -fsS -X POST --max-time 60
                  -H "Authorization: Bearer $TOKEN"
                  http://enrichment:8080/internal/normalize-community-regions
              resources:
                requests: { cpu: 10m, memory: 16Mi }
                limits: { memory: 32Mi }
