{{- if .Values.mongo.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enrichment-mongo-owner-only
  labels: {{- include "enrichment.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: enrichment-mongo
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: enrichment
      ports:
        - { port: 27017, protocol: TCP }
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vg-platform
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9216
---
{{- end }}
{{- if .Values.valkey.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enrichment-valkey-owner-only
  labels: {{- include "enrichment.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: enrichment-valkey
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: enrichment
      ports:
        - { port: 6379, protocol: TCP }
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vg-platform
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9121
---
{{- end }}
# Enrichment's callers: the bff (search/resolve/product pass-throughs),
# the collection service (product snapshots at entry creation, batch
# prices for values and the dashboard), and the refresh CronJob (it
# exchanges the shared secret for a service JWT at auth, then calls
# this endpoint with a normal bearer; this admission is the outer
# layer).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enrichment-from-callers-only
  labels: {{- include "enrichment.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: enrichment
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bff
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: enrichment-refresh
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: collection
      ports:
        - { port: 8080, protocol: TCP }
