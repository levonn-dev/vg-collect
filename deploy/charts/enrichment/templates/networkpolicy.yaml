{{ include "vg-lib.pg.ownerOnly" . }}
{{ include "vg-lib.valkey.ownerOnly" . }}
# Enrichment's callers: bff (search/resolve/product pass-throughs), collection (product snapshots at entry
# creation, batch prices for values/dashboard), and the refresh CronJob (JWT via auth, then a normal bearer here; this is the outer admission layer).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enrichment-from-callers-only
  labels: {{- include "enrichment.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bff
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Chart.Name }}-refresh
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: collection
      ports:
        - { port: 8080, protocol: TCP }
