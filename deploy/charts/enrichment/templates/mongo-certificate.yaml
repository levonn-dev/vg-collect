{{- if .Values.mongo.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: enrichment-mongo-tls
  labels: {{- include "enrichment.labels" . | nindent 4 }}
spec:
  secretName: enrichment-mongo-tls
  duration: 2160h
  dnsNames:
    - {{ include "enrichment.mongoHost" . }}
    - {{ include "enrichment.mongoHost" . }}.{{ .Release.Namespace }}.svc
    - {{ include "enrichment.mongoHost" . }}.{{ .Release.Namespace }}.svc.cluster.local
    # The metrics sidecar dials over pod-local loopback with full
    # verification; the serving cert must therefore name localhost.
    - localhost
  issuerRef:
    name: vg-ca
    kind: ClusterIssuer
    group: cert-manager.io
{{- end }}
