image:
  repository: vgkeep/enrichment
  tag: dev
  pullPolicy: IfNotPresent

replicas: 1

env:
  jwksUrl: http://auth:8080/.well-known/jwks.json
  jwtIssuer: vgkeep-auth
  jwtAudience: vgkeep
  # External MongoDB URL (creds-less, e.g. mongodb+srv://...), read only when mongo.enabled is false;
  # credentials still ride MONGO_USERNAME (mongo.username) + MONGO_PASSWORD (secret), composed service-side.
  mongoUrl: ""
  valkeyUrl: rediss://enrichment-valkey:6379/0
  searchCacheTtl: 24h
  productCacheTtl: 5m
  igdbRefreshAfter: 720h

# stub serves the embedded fixture catalog (credential-less dev/e2e); real requires secret store keys, which
# Tilt sets only when present in .env. fx is credential-less either way and defaults to real; use fx.mode=stub for deterministic/offline rates.
igdb:
  mode: stub
pricecharting:
  mode: stub
fx:
  mode: real

# CronJob exchanges the shared internal secret for a service JWT at auth (POST /internal/service-token),
# then POSTs the internal refresh endpoint with that bearer; rotation is via the auth chart's previousTokenEnabled.
refresh:
  schedule: "0 6 * * *"
  image: curlimages/curl:8.14.1

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { memory: 128Mi }

mongo:
  enabled: true            # false = bring your own MongoDB (e.g. Atlas): set env.mongoUrl; the in-cluster mongo and its CA volume are not rendered
  image: mongo:8
  database: enrichment
  username: enrichment
  storage: 1Gi
  exporterImage: percona/mongodb_exporter:0.51.0
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }
  exporterResources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { memory: 32Mi }

valkey:
  enabled: true            # the prod-path seam: disable + point valkeyUrl at a managed cache
  image: valkey/valkey:8-alpine
  exporterImage: oliver006/redis_exporter:v1.86.0
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 128Mi }
  exporterResources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { memory: 32Mi }

otel:
  # OTLP gRPC endpoint for traces/metrics/logs; empty string disables export (JSON stdout logs only).
  exporterEndpoint: http://otel-agent.vg-platform.svc.cluster.local:4317

secretStore:
  name: vg-fake
  kind: ClusterSecretStore
  keys:
    mongoPassword: enrichment/mongo-password
    internalServiceToken: auth/internal-service-token
    igdbClientId: enrichment/igdb-client-id
    igdbClientSecret: enrichment/igdb-client-secret
    pricechartingApiKey: enrichment/pricecharting-api-key
