image:
  repository: vgkeep/enrichment
  tag: dev
  pullPolicy: IfNotPresent

replicas: 1

env:
  jwksUrl: http://auth:8080/.well-known/jwks.json
  jwtIssuer: vgkeep-auth
  jwtAudience: vgkeep
  # External MongoDB URL (creds-less, e.g. mongodb+srv://...); read only
  # when mongo.enabled is false. Credentials still ride MONGO_USERNAME
  # (mongo.username) + MONGO_PASSWORD (secret), composed service-side.
  mongoUrl: ""
  valkeyUrl: rediss://enrichment-valkey:6379/0
  searchCacheTtl: 24h
  productCacheTtl: 5m
  igdbRefreshAfter: 720h

# Provider switches. stub serves the embedded fixture catalog
# (credential-less dev/e2e); real requires the corresponding secret
# store keys to exist - Tilt flips these only when the credentials are
# present in .env, mirroring the auth provider flags. The fx switch is
# credential-less either way, so real is the default; set fx.mode=stub
# for deterministic/offline rates instead.
igdb:
  mode: stub
pricecharting:
  mode: stub
fx:
  mode: real

# The daily catalog refresh: a CronJob exchanges the shared internal
# secret for a short-lived service JWT at auth (POST
# /internal/service-token), then POSTs the cluster-internal refresh
# endpoint with that bearer - the service validates JWTs only (the
# NetworkPolicy admits only this CronJob and the known service
# callers, and the gateway never routes there).
# Secret rotation now happens at auth, not here: publish the new value
# under auth's internalServiceToken store key and the old one under
# internalServiceTokenPrevious, flip auth's previousTokenEnabled so it
# accepts both while the two CronJobs still present the old value, and
# once a run has gone green, drop the previous key and flip the flag
# back off.
refresh:
  schedule: "0 6 * * *"
  image: curlimages/curl:8.14.1

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { memory: 128Mi }

mongo:
  enabled: true            # false = bring your own MongoDB (e.g. Atlas): set env.mongoUrl; the in-cluster mongo and its CA volume are not rendered
  image: mongo:8
  database: enrichment
  username: enrichment
  storage: 1Gi
  exporterImage: percona/mongodb_exporter:0.51.0
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

valkey:
  enabled: true            # the prod-path seam: disable + point valkeyUrl at a managed cache
  image: valkey/valkey:8-alpine
  exporterImage: oliver006/redis_exporter:v1.86.0
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 128Mi }

otel:
  # OTLP gRPC endpoint for traces, metrics and logs. Empty string
  # disables export entirely (the service logs JSON to stdout only).
  exporterEndpoint: http://otel-agent.vg-platform.svc.cluster.local:4317

secretStore:
  name: vg-fake
  kind: ClusterSecretStore
  keys:
    mongoPassword: enrichment/mongo-password
    internalServiceToken: auth/internal-service-token
    igdbClientId: enrichment/igdb-client-id
    igdbClientSecret: enrichment/igdb-client-secret
    pricechartingApiKey: enrichment/pricecharting-api-key
