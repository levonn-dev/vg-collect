# go-task taskfile (https://taskfile.dev). `task` with no args lists every
# task. Go tasks fan out over every module in GO_MODULES (dirs with a
# go.mod); frontend and per-service codegen live in included Taskfiles,
# called namespaced (e.g. `task frontend:test`, `task auth:gen`).

version: "3"

vars:
  # Dirs with a go.mod, one per line; drives the fan-out loops below.
  GO_MODULES:
    sh: find . -name go.mod -not -path '*/node_modules/*' -exec dirname {} \; | sort

env:
  # Shared test datastore containers, one per kind, started once by
  # test:datastores and reused; TESTDS_RUN scopes concurrent runs apart.
  PGTEST_URL: postgres://pgtest:pgtest@127.0.0.1:54329/pgtest?sslmode=disable
  VALKEYTEST_URL: redis://127.0.0.1:63790

tasks:

  default:
    desc: List available tasks (run with no args)
    silent: true
    cmds:
      - task --list

  # ------------------------------ bootstrap ------------------------------

  bootstrap:
    desc: Verify required tools are installed, scaffold .env from .env.example, and sync missing keys into an existing .env
    cmds:
      - for tool in go docker kubectl helm tilt golangci-lint node npm; do
          command -v $tool >/dev/null || { echo "MISSING $tool; see README Prerequisites"; exit 1; };
        done
      - test -f .env || cp .env.example .env
      - grep -oE '^[A-Za-z_][A-Za-z0-9_]*=' .env.example | while read -r kv; do
          key=${kv%=};
          grep -q "^${key}=" .env || { grep "^${key}=" .env.example >> .env; echo "added missing key $key to .env"; };
        done
      - echo "bootstrap OK"

  bootstrap:cluster:
    desc: 'One-shot platform install (cert-manager + ESO + APISIX + observability stack, then issuers). Idempotent.'
    cmds:
      - task: helm:deps
      - helm repo add jetstack https://charts.jetstack.io --force-update >/dev/null
      - helm repo add external-secrets https://charts.external-secrets.io --force-update >/dev/null
      - helm repo add apiseven https://charts.apiseven.com --force-update >/dev/null
      - helm repo add prometheus-community https://prometheus-community.github.io/helm-charts --force-update >/dev/null
      - helm repo add grafana https://grafana.github.io/helm-charts --force-update >/dev/null
      - helm repo add jaegertracing https://jaegertracing.github.io/helm-charts --force-update >/dev/null
      - helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts --force-update >/dev/null
      - helm dependency update deploy/charts/platform
      # helm only applies a chart's crds/ on install, not upgrade, so the
      # monitoring CRDs are applied by hand here (idempotent).
      - helm show crds prometheus-community/kube-prometheus-stack --version 87.10.1
          | kubectl apply --server-side --force-conflicts -f -
      - helm upgrade --install vg-platform deploy/charts/platform
          -n vg-platform --create-namespace --wait --timeout 15m
      - helm upgrade --install vg-platform-config deploy/charts/platform-config
          -n vg-platform --wait --timeout 2m
      - kubectl get clusterissuer vg-ca -o name

  bootstrap:cluster:down:
    desc: 'Tear down the platform (both helm releases + the vg-platform namespace). The next bootstrap:cluster mints a NEW dev CA, so TLS secrets already issued in vgkeep keep chaining to the old one; for a full reset run `task nuke && task bootstrap:cluster:down`.'
    cmds:
      # helm uninstall, not a bare namespace delete: the releases own
      # cluster-scoped objects (ClusterIssuers, webhook configs, RBAC) a
      # namespace delete would strand. Reverse install order.
      - helm uninstall vg-platform-config -n vg-platform --ignore-not-found
      - helm uninstall vg-platform -n vg-platform --ignore-not-found
      # cert-manager CRDs (resource-policy: keep) and APISIX's (chart
      # crds/ dir) survive for reuse. ESO CRDs are templates, so removal
      # cascades ExternalSecrets/ClusterSecretStores cluster-wide; the
      # delete blocks until finalized, so a re-run cannot race it.
      - kubectl delete namespace vg-platform --ignore-not-found

  # -------------------------------- lint ---------------------------------
  #
  # golangci-lint v2 also formats (gofmt/goimports): lint covers formatting
  # too, and lint:fix applies it. helm lint is check-only, so it runs in both.

  lint:
    desc: 'Verify everything: golangci-lint (incl. gofmt/goimports) per module + helm lint + frontend eslint + obsgen lint. The CI gate.'
    cmds:
      - for: { var: GO_MODULES, as: MOD }
        cmd: cd {{.MOD}} && golangci-lint run ./...
      - task: lint:helm
      - task: frontend:lint
      - task: lint:obs

  lint:fix:
    desc: 'Auto-fix what is fixable: golangci-lint --fix (formatting + lint) per module + frontend eslint --fix; helm lint runs too (check-only, no autofix).'
    cmds:
      - for: { var: GO_MODULES, as: MOD }
        cmd: cd {{.MOD}} && golangci-lint run --fix ./...
      - task: lint:helm
      - task: frontend:lint:fix

  helm:deps:
    desc: 'Vendor the vg-lib library chart into each service chart (helm dependency build); skipped when the library and the consumers'' Chart.yaml files are unchanged (content checksums)'
    sources:
      - deploy/charts/vg-lib/**/*
      - deploy/charts/auth/Chart.yaml
      - deploy/charts/bff/Chart.yaml
      - deploy/charts/collection/Chart.yaml
      - deploy/charts/enrichment/Chart.yaml
      - deploy/charts/social/Chart.yaml
      - deploy/charts/user/Chart.yaml
    generates:
      - deploy/charts/auth/charts/vg-lib-0.1.0.tgz
      - deploy/charts/bff/charts/vg-lib-0.1.0.tgz
      - deploy/charts/collection/charts/vg-lib-0.1.0.tgz
      - deploy/charts/enrichment/charts/vg-lib-0.1.0.tgz
      - deploy/charts/social/charts/vg-lib-0.1.0.tgz
      - deploy/charts/user/charts/vg-lib-0.1.0.tgz
    method: checksum
    cmds:
      - for: [auth, bff, collection, enrichment, social, user]
        cmd: helm dependency build deploy/charts/{{.ITEM}} >/dev/null

  lint:helm:
    desc: helm lint every chart (registers chart repos + builds the platform subchart deps first)
    cmds:
      - task: helm:deps
      # helm lint of the platform chart needs its subchart deps vendored
      # first, which needs the chart repos registered.
      - test ! -d deploy/charts/platform || (helm repo add jetstack https://charts.jetstack.io --force-update >/dev/null &&
          helm repo add external-secrets https://charts.external-secrets.io --force-update >/dev/null &&
          helm repo add apiseven https://charts.apiseven.com --force-update >/dev/null &&
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts --force-update >/dev/null &&
          helm repo add grafana https://grafana.github.io/helm-charts --force-update >/dev/null &&
          helm repo add jaegertracing https://jaegertracing.github.io/helm-charts --force-update >/dev/null &&
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts --force-update >/dev/null &&
          helm dependency build deploy/charts/platform >/dev/null)
      - test ! -d deploy/charts || for charts in deploy/charts/*/; do helm lint "$charts" || exit 1; done

  lint:obs:
    desc: 'obsgen lint against deploy/observability/: uid uniqueness, panel_ref resolution, runbook anchors, and PromQL metric names, including a TypeScript scan of frontend/src for browser-telemetry registrations. A syntax-only scan (no build needed first); runs as part of `task lint` (the CI gate) and `task check`.'
    cmds:
      - cd tools/obsgen && go run . lint ../../deploy/observability ../..

  # --------------------------- build / codegen ---------------------------

  build:
    desc: Compile every Go module + build the frontend bundle
    cmds:
      - for: { var: GO_MODULES, as: MOD }
        cmd: cd {{.MOD}} && go build ./...
      - task: frontend:build

  gen:
    desc: Regenerate code from the OpenAPI contracts (run after editing any api/*.yaml; CI fails on drift)
    cmds:
      - task: gen:bundle
      - task: gen:domain
      - task: contract:gen
      - task: gen:obs
      - task: user:gen
      - task: auth:gen
      - task: bff:gen
      - task: enrichment:gen
      - task: collection:gen
      - task: social:gen
      - task: frontend:gen
      - task: frontend:extract

  gen:domain:
    desc: Regenerate region/platform tables from api/domain.yaml (Go regionkit + frontend TS) and frontend/src/gen/facets.ts (constraint values mirrored from api/bundled/bff.yaml components/schemas, components/parameters, and inline operation parameters; run after editing api/domain.yaml or after gen:bundle; CI fails on drift)
    cmds:
      - cd tools/domaingen && go run . -yaml ../../api/domain.yaml -go-out ../../libs/go/regionkit/tables_gen.go -ts-out ../../frontend/src/gen/domain.ts -bundle ../../api/bundled/bff.yaml -facets-out ../../frontend/src/gen/facets.ts

  gen:bundle:
    desc: Bundle the authored OpenAPI contracts (api/*.yaml + api/common.yaml) into self-contained files under api/bundled/ (redocly; committed output, run after editing any api/*.yaml; CI fails on drift)
    cmds:
      - for: [auth, bff, collection, enrichment, social, user]
        cmd: npx --prefix . redocly bundle api/{{.ITEM}}.yaml -o api/bundled/{{.ITEM}}.yaml

  gen:obs:
    desc: Regenerate the Grafana alert provisioning file and per-service dashboards from deploy/observability/ (run after editing anything under deploy/observability/; CI fails on drift)
    cmds:
      - cd tools/obsgen && go run . gen ../../deploy/observability ../..

  tidy:
    desc: 'go mod tidy every module (plain tidy; otel/otelhttp aligned fleet-wide)'
    cmds:
      - for: { var: GO_MODULES, as: MOD }
        cmd: cd {{.MOD}} && go mod tidy

  # ------------------------------- migrate --------------------------------

  migrate:
    desc: 'Run db:migrate for every migrate-capable service (auth, collection, enrichment, social, user; bff has no database). Each reads its own connection env (DATABASE_URL).'
    cmds:
      - for: [auth, collection, enrichment, social, user]
        task: '{{.ITEM}}:db:migrate'

  # -------------------------------- test ---------------------------------

  test:
    desc: 'Full test suite for every module (integration tests included; needs Docker) + frontend. -count=1 disables Go test-result caching: tests that read contract YAML from disk would otherwise report stale cached passes after spec edits.'
    vars:
      RUN:
        sh: od -An -N4 -tx4 /dev/urandom | tr -d ' \n'
    env:
      TESTDS_RUN: '{{.RUN}}'
    cmds:
      - task: test:datastores
      # Deferred: clears this run's test databases even when the suite fails.
      - defer: { task: test:datastores:clean, vars: { RUN: '{{.RUN}}' } }
      # -p 2 caps concurrent load on the shared datastores and Docker
      # daemon; the kits' self-test boots still rely on the reaper for cleanup.
      - for: { var: GO_MODULES, as: MOD }
        cmd: cd {{.MOD}} && go test -count=1 -p 2 ./...
      - task: frontend:test

  test:short:
    desc: 'Fast unit tests only (-short; no Docker) for every module + frontend. Quick dev loop; `task check` and CI run the full suite.'
    cmds:
      - for: { var: GO_MODULES, as: MOD }
        cmd: cd {{.MOD}} && go test -short ./...
      - task: frontend:test

  test:cover:
    desc: Coverage gate (80%, generated code and cmd/ wiring excluded) for Go + frontend
    vars:
      RUN:
        sh: od -An -N4 -tx4 /dev/urandom | tr -d ' \n'
    env:
      TESTDS_RUN: '{{.RUN}}'
    cmds:
      - task: test:datastores
      - defer: { task: test:datastores:clean, vars: { RUN: '{{.RUN}}' } }
      - scripts/coverage.sh 80
      - task: frontend:test:cover

  test:datastores:
    desc: 'Start the shared test datastore containers if their ports are not already answering (kits adopt them via the *TEST_URL env vars; `task nuke` removes them)'
    cmds:
      - timeout 2 bash -c '</dev/tcp/127.0.0.1/54329' 2>/dev/null || docker start vgkeep-testpg 2>/dev/null ||
          docker run -d --name vgkeep-testpg -p 127.0.0.1:54329:5432
          -e POSTGRES_DB=pgtest -e POSTGRES_USER=pgtest -e POSTGRES_PASSWORD=pgtest postgres:17-alpine
      # --databases 64 = one logical database per test binary, with headroom.
      - timeout 2 bash -c '</dev/tcp/127.0.0.1/63790' 2>/dev/null || docker start vgkeep-testvalkey 2>/dev/null ||
          docker run -d --name vgkeep-testvalkey -p 127.0.0.1:63790:6379 valkey/valkey:8-alpine valkey-server --databases 64
      # Postgres publishes its port only after init, so port-open means ready.
      - for port in 54329 63790; do
          for i in $(seq 1 180); do
            timeout 2 bash -c "</dev/tcp/127.0.0.1/$port" 2>/dev/null && break;
            test $i -lt 180 || { echo "port $port never became ready"; exit 1; };
            sleep 1;
          done;
        done

  test:datastores:clean:
    desc: 'Drop test databases from the shared containers: only the deferring run''s own (RUN scope) when called from test/test:cover, everything test-created when run directly. Failures here never fail a run (the kits recreate their databases at the next binary start).'
    cmds:
      - docker exec vgkeep-testpg psql -U pgtest -d pgtest -Atc "SELECT datname FROM pg_database WHERE datname LIKE 't\_{{if .RUN}}{{.RUN}}\_{{end}}%'" |
          xargs -r -n1 docker exec vgkeep-testpg dropdb -U pgtest --force
      # Scoped runs flush only the logical databases the valkeytest
      # allocator recorded for them; a direct run wipes the server.
      - >-
        {{if .RUN}}docker exec vgkeep-testvalkey sh -c 'for i in $(valkey-cli SMEMBERS valkeytest_run_{{.RUN}}); do valkey-cli -n $i FLUSHDB; done; valkey-cli DEL valkeytest_run_{{.RUN}}'{{else}}docker exec vgkeep-testvalkey valkey-cli FLUSHALL{{end}}

  test:datastores:nuke:
    desc: 'Remove the shared test datastore containers'
    cmds:
      - docker stop vgkeep-testpg
      - docker rm vgkeep-testpg
      - docker stop vgkeep-testvalkey
      - docker rm vgkeep-testvalkey

  # ---------------------------- check / clean ----------------------------

  check:
    desc: 'Pre-commit gate: lint (incl. formatting + obsgen lint) + build + full test suite (needs Docker for the integration tests). Non-mutating. (CI additionally enforces the 80% coverage gate via test:cover and codegen drift via gen.)'
    cmds:
      - task: lint
      - task: build
      - task: test

  clean:
    desc: Remove build/test artifacts (Go build & test caches, frontend dist & coverage)
    cmds:
      - go clean -cache -testcache
      - rm -rf frontend/dist frontend/coverage

  # -------------------------------- run ----------------------------------
  #
  # `task bootstrap:cluster` must run once, before the first `task run`.

  run:
    desc: Start the full dev stack under Tilt (foreground; Ctrl-C to stop)
    cmds:
      - tilt up

  down:
    desc: Stop the Tilt-managed dev stack (the vgkeep namespace, datastore PVCs, and issued TLS secrets survive)
    cmds:
      - tilt down

  nuke:
    desc: 'Full reset: tilt down + delete the vgkeep namespace (drops datastore PVCs + issued TLS secrets)'
    cmds:
      - task: down
      # tilt down never deletes namespaces; this clears vgkeep's PVCs and
      # TLS secrets, preventing a reinstall from chaining to a replaced CA.
      - kubectl delete namespace vgkeep --ignore-not-found

  e2e:
    desc: Parallel Playwright browser suite against the running stack
    cmds:
      - task: grant-fixture-admin
      - task: frontend:e2e

  grant-fixture-admin:
    desc: 'Grant the admin role to the dev admin fixture (dev stack only; fixture-scoped, takes no arguments)'
    cmds:
      # A dev login first: the grant inserts by email, so the fixture's
      # user row must exist (the login upserts it). Idempotent end to end.
      - curl -sf -o /dev/null "http://localhost:8090/api/auth/login?provider=dev&user=admin"
      - >-
        kubectl -n vgkeep exec statefulset/user-pg -- psql -U user -d user -c
        "INSERT INTO user_roles (user_id, role)
         SELECT id, 'admin' FROM users WHERE email = 'admin@example.com'
         ON CONFLICT DO NOTHING;"

includes:
  contract:
    taskfile: libs/go/contract/Taskfile.yml
    dir: libs/go/contract
    optional: true
  user:
    taskfile: services/user/Taskfile.yml
    dir: services/user
    optional: true
  auth:
    taskfile: services/auth/Taskfile.yml
    dir: services/auth
    optional: true
  bff:
    taskfile: services/bff/Taskfile.yml
    dir: services/bff
    optional: true
  enrichment:
    taskfile: services/enrichment/Taskfile.yml
    dir: services/enrichment
    optional: true
  collection:
    taskfile: services/collection/Taskfile.yml
    dir: services/collection
    optional: true
  social:
    taskfile: services/social/Taskfile.yml
    dir: services/social
    optional: true
  frontend:
    taskfile: frontend/Taskfile.yml
    dir: frontend
    optional: true
