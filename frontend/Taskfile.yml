version: "3"

tasks:

  default:
    desc: List available tasks (run with no args)
    silent: true
    cmds:
      - task --list

  deps:
    desc: Install node_modules when the lockfile changes
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules/.package-lock.json
    cmds:
     - npm ci

  dev:
    desc: Vite dev server on :5173 (proxies /api to the gateway on :8090)
    deps:
     - deps
    cmds:
      - npm run dev

  gen:
    desc: Regenerate API types from the bff OpenAPI contract
    deps:
      - deps
    cmds:
     - npm run gen

  extract:
    desc: Extract translatable strings into src/locales/*.po (root gen runs this; CI fails on drift)
    deps:
      - deps
    cmds:
      - npm run extract

  lint:
    desc: eslint (type-aware) over the SPA sources
    deps:
      - deps
    cmds:
      - npm run lint

  lint:fix:
    desc: eslint --fix (autofix) over the SPA sources
    deps:
      - deps
    cmds:
      - npm run lint -- --fix

  test:
    desc: vitest unit tests (jsdom)
    deps:
      - deps
    cmds:
      - npm run test

  test:cover:
    desc: vitest with 80 percent coverage thresholds
    deps:
      - deps
    cmds:
      - npm run test:cover

  build:
    desc: Production Vite build into dist/ (embedded by the bff image)
    deps:
      - deps
    cmds:
      - npm run build

  e2e:
    desc: Playwright browser suite against the running stack (gateway on localhost 8090)
    deps:
      - deps
    cmds:
      # The gateway rate-limits /api/* and /api/auth/* per client IP per
      # minute (bff chart values.yaml); a full run clears them with
      # headroom. Exactly one 429 is expected, from PATCH /api/me's
      # handle-cooldown test; any other 429 is a real signal, not noise.
      - npx playwright test
