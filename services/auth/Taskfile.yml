version: "3"

tasks:

  default:
    desc: List available tasks (run with no args)
    silent: true
    cmds:
      - task --list

  gen:
    desc: Regenerate server stubs from api/auth.yaml
    cmds:
      - go tool oapi-codegen -config ../../api/oapi.server.yaml ../../api/auth.yaml

  db:migrate:
    desc: Run migrations against DATABASE_URL
    cmds:
      - go run ./cmd/auth migrate
