version: "3"

tasks:

  default:
    desc: List available tasks (run with no args)
    silent: true
    cmds:
      - task --list

  gen:
    desc: Regenerate server stubs from api/bff.yaml and typed clients for the auth and user services
    cmds:
      - go tool oapi-codegen -config oapi.server.yaml ../../api/bff.yaml
      - go tool oapi-codegen -config oapi.authclient.yaml ../../api/auth.yaml
      - go tool oapi-codegen -config oapi.userclient.yaml ../../api/user.yaml
