openapi: 3.0.3
info:
  title: specval test spec
  version: "1.0.0"
servers:
  - url: https://api.example.com
paths:
  /items:
    post:
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  maxLength: 10
                status:
                  type: string
                  enum:
                    - active
                    - inactive
                  default: active
                developers:
                  type: array
                  maxItems: 2
                  items:
                    type: string
      responses:
        "201":
          description: Created
    get:
      operationId: listItems
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - active
              - inactive
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: OK
  /items/{itemId}:
    get:
      operationId: getItem
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            enum:
              - foo
              - bar
        - name: X-Priority
          in: header
          schema:
            type: integer
            minimum: 1
            maximum: 5
      responses:
        "200":
          description: OK
  /secure:
    get:
      operationId: secureOp
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
