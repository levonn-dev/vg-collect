openapi: 3.0.3
info:
  title: vg-collect enrichment service
  version: 0.1.0
  description: >
    Cluster-internal catalog and pricing service. All third-party data
    (IGDB metadata, PriceCharting prices) is quarantined behind this
    API; no other service talks to those providers. Every operation
    requires a Bearer access JWT validated against the auth service's
    JWKS; /admin/* operations additionally require the admin role.
    The daily price-refresh trigger used by the in-cluster CronJob is
    deliberately outside this contract (POST /internal/refresh): the
    CronJob has no JWT source, so that endpoint authenticates a static
    internal-caller token (X-Internal-Token header) instead, with the
    NetworkPolicy as the outer layer.
security:
  - bearerAuth: []
paths:
  /search:
    get:
      operationId: searchCatalog
      summary: Discovery search (game metadata via IGDB, hardware via PriceCharting)
      description: >
        Results come from a 24h per-query Valkey cache in front of the
        provider, never from the local catalog first (it is incomplete
        by construction). When the provider is down and the cache is
        cold, the local catalog answers a name match and the response
        is flagged degraded.
        type pc_listing searches ALL of PriceCharting (games, hardware,
        every category) and carries the provider's loose/cib/new prices
        per listing; it exists for picking exact variant listings as
        price sources.
      parameters:
        - name: type
          in: query
          required: true
          schema: { type: string, enum: [game, hardware, pc_listing] }
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Search results (possibly degraded)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResults" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /products/resolve:
    post:
      operationId: resolveProduct
      summary: Find-or-create the canonical product for a search selection
      description: >
        Idempotent: an existing product with the same identity is
        returned as-is. Game identity is (igdb game, platform,
        PriceCharting listing) - see ResolveRequest for the no-pick
        auto-match, the match_hint reweighting, and the manual-match
        pick. Creating a game product pulls the full IGDB payload into
        igdb_raw (reusing an already-cached payload without a provider
        call) and projects it onto the product. Creating a hardware
        product fetches the PriceCharting product and borrows IGDB
        platform metadata where a console mapping exists.
        Errors: 404 code unknown_game (IGDB id not found) or
        unknown_pc_product; 502 code upstream_unavailable when the
        needed provider cannot be reached.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolveRequest" }
      responses:
        "200":
          description: The canonical product (found or created)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Provider does not know the requested id (code unknown_game or unknown_pc_product)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /products/{productId}:
    get:
      operationId: getProduct
      summary: Fetch a product (read-through with per-type staleness)
      description: >
        Valkey (5m) in front of Mongo; an IGDB projection older than 30
        days is refetched inline best-effort (stale data is served when
        the provider is down). Prices refresh on the daily cadence
        only, never per-read.
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Not found (code product_not_found)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /products/prices:batch:
    post:
      operationId: batchPrices
      summary: Current prices for a set of products (dashboard composition)
      description: >
        Reads straight from the catalog (the daily refresh keeps it
        current). Unknown product ids are absent from the response map;
        known-but-unmatched products appear with unmatched true and no
        price fields.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PricesBatchRequest" }
      responses:
        "200":
          description: Prices keyed by product id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricesBatchResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /products/price-history:batch:
    post:
      operationId: batchPriceHistory
      summary: Price snapshot series for a set of products (value-over-time composition)
      description: >
        Each requested product's snapshots inside the window, oldest
        first. Snapshots accumulate from the daily refresh walk plus
        one initial point when a product is created or its mapping is
        corrected. Unknown ids and products with no points in the
        window are absent from the response map.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PriceHistoryRequest" }
      responses:
        "200":
          description: Snapshot series keyed by product id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceHistoryResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /recommendations:score:
    post:
      operationId: scoreRecommendations
      summary: Score unowned games against a library summary (user-agnostic)
      description: >
        The caller supplies the library summary; this service stores no
        user data. Candidates come from owned games' similar_games
        edges (owner weights: dropped 0.5, rating >= 8 doubles to 2.0,
        otherwise 1.0) plus a genre-overlap bonus, with a genre-profile
        fallback when edges are sparse. Owned ids are excluded. Unknown
        candidate metadata is batch-fetched into igdb_raw (respecting
        the provider rate limiter). degraded is true when provider
        fetches failed and candidates were skipped.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScoreRequest" }
      responses:
        "200":
          description: Ranked recommendations with display metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScoreResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /fx/latest:
    get:
      operationId: getFxLatest
      summary: Latest USD-based exchange rates (cached daily snapshot)
      description: >
        Rates are target-units-per-USD from the ECB reference set via
        frankfurter.dev (embedded fixtures in stub mode). Snapshots
        refresh at most hourly; an upstream failure serves the last
        good snapshot, so only a cold cache answers 502. Rates power
        display-side conversion only; nothing stored depends on them.
      responses:
        "200":
          description: Rate snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FXRates" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /platforms:
    get:
      operationId: listPlatforms
      summary: The canonical platform catalog with alias knowledge
      description: >
        The IGDB platform catalog (igdb id + name) joined with the alias
        table - PriceCharting console spellings plus curated
        abbreviations (SNES, PSX, N64, ...) - sorted by name. Reference
        data for the custom-entry platform picker and the collection
        normalize-platforms lever: consumers filter and match against
        name + aliases and never hard-code aliases themselves. Cached
        24h (the search-cache idiom); the catalog changes only when the
        platform sweep lands new rows. A cold catalog with the provider
        down is the only 502.
      responses:
        "200":
          description: The platform catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformCatalog" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /admin/refresh:
    post:
      operationId: triggerRefresh
      summary: Trigger an immediate price refresh walk (role admin)
      description: >
        Starts the same walk the daily CronJob triggers and returns 202
        immediately (the walk outlives the HTTP write timeout at polite
        provider rates); the runner logs its summary. 409 code
        refresh_in_progress when a walk is already running.
      responses:
        "202":
          description: Walk started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefreshAccepted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: A walk is already running (code refresh_in_progress)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /admin/products:
    post:
      operationId: createCommunityProduct
      summary: Mint a community product from an approved submission (role admin)
      description: >
        Creates an anchor-less product: no IGDB, no PriceCharting,
        origin community. Community products live outside the provider
        identity indexes - their curated name is their identity, and
        the review panel's embedded search is the dedup check
        (deliberately no uniqueness machinery). They never join the
        nightly re-match walk or the unmatched worklist, and they
        surface to users through the community lane in search. The
        single edition field follows the entry idiom (one
        "Edition or variant" note); variant stays empty - the
        region/edition/variant split exists only for provider hardware
        identity, which community products are outside of.
        platform_name and first_release_date store as the community
        facts block, retained after promotion as gap-fill.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommunityProductCreate" }
      responses:
        "201":
          description: The minted community product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/products/{productId}/pricecharting:
    put:
      operationId: setProductMapping
      summary: Correct a product's PriceCharting mapping and mark it verified (role admin)
      description: >
        Shared-catalog truth is moderated: the new mapping is validated
        against the provider, current prices are fetched, a snapshot is
        appended, and the mapping is stored verified with confidence
        1.0. A null pc_product_id clears the mapping (the product
        becomes unmatched) and sets match_hold, so the nightly re-match
        walk never undoes a deliberate clear; setting any mapping lifts
        match_hold. Identity indexes make a mapping change an identity
        move: when another product of the same identity (for games,
        the same game and platform; for hardware, the same
        region/edition/variant) already carries the target listing, or
        a clear would collide with an existing unmatched product of
        that identity, the answer is 409 code identity_taken, whose
        detail names the holding product (id and name) when the holder
        can be resolved. Clearing an already-unmatched product collides
        with nothing and simply parks it: match_hold is set,
        idempotently, which is the admin lever for silencing permanent
        worklist residue. Errors:
        404 code
        product_not_found or unknown_pc_product; 409 code
        identity_taken; 502 code upstream_unavailable. 409 code
        product_not_provider for community products (their one path to
        a PriceCharting anchor is promote).
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MappingRequest" }
      responses:
        "200":
          description: The product with its corrected mapping
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such product, or the provider does not know the mapping id
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Another product already carries that identity (code identity_taken), or the product is community-origin (code product_not_provider)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /admin/products/{productId}/promote:
    post:
      operationId: promoteProduct
      summary: Promote a community product to provider identity in place (role admin)
      description: >
        Attaches the provider anchors and flips origin to provider
        atomically; the product id stays stable, so every adopter's
        entry upgrades through live reads with no repointing. The
        re-entry into the identity index adjudicates twins: when a
        provider product already holds the target identity the answer
        is 409 code identity_taken with the holder named in the
        detail, and the community product keeps working unpromoted
        (the true-merge case is deliberately not automated). The
        community facts block is retained as gap-fill. After the flip
        the product is a first-class provider citizen: the nightly
        walk may auto-match a missing game listing, the unmatched
        worklist includes it, and the mapping fix applies. Errors:
        404 code product_not_found, unknown_game or
        unknown_pc_product; 409 code product_not_community (already
        provider) or identity_taken; 502 code upstream_unavailable.
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromoteRequest" }
      responses:
        "200":
          description: The promoted product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such product, or the provider does not know the requested id
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Not community-origin (code product_not_community) or a provider twin holds the identity (code identity_taken)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /admin/products/promote-candidates:
    get:
      operationId: listPromoteCandidates
      summary: Community products with plausible provider matches (role admin)
      description: >
        The promote worklist, fed by the nightly flag-never-act sweep
        (the refresh trigger also refreshes it): community products
        whose name matched a provider item at or above the never-guess
        threshold, strongest candidate first with _id as the tiebreak.
        Dismissed pairs never reappear; a different provider id for
        the same product still nags. product_id narrows to one
        product - the lookup panel's per-product view. Promotion is
        always a human verdict; nothing here attaches anything.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: product_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: One candidates page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PromoteCandidatesPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/products/{productId}/promote-candidates/dismiss:
    post:
      operationId: dismissPromoteCandidate
      summary: Dismiss one promote candidate permanently (role admin)
      description: >
        Records the (provider, provider_id) pair as dismissed and
        drops the matching candidate; the sweep never re-flags a
        dismissed pair. A different candidate for the same product
        still nags.
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DismissCandidateRequest" }
      responses:
        "204":
          description: Dismissed
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such product (code product_not_found)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /admin/products/{productId}:
    delete:
      operationId: deleteProduct
      summary: Delete an unmatched product and its snapshots (role admin)
      description: >
        The residue mop: permanently removes a product that no listing
        anchors, plus its price snapshots. Only unmatched products
        qualify - a matched product answers 409 code product_matched
        (clear the mapping first). This service cannot see entries;
        the bff verifies no entries reference the product before
        calling. A later resolve can re-mint the family's unmatched
        member - delete is cleanup, not prevention.
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted (snapshots included)
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such product (code product_not_found)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: The product carries a mapping (code product_matched)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /admin/products/unmatched:
    get:
      operationId: listUnmatchedProducts
      summary: List unmatched products, admin-held included (role admin)
      description: >
        The admin worklist: every product with no PriceCharting
        mapping, all types, INCLUDING products held by an admin clear
        (each held item carries match_hold true; a deliberate clear is
        exactly what an admin revisits). Ordered oldest updated_at
        first with _id as the tiebreak so offset pages are
        deterministic. limit defaults to 200 (max 500), offset slices
        the sequence, and total_count reports the full filtered count.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: One worklist page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnmatchedProductsPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/products/community:
    get:
      operationId: listCommunityProducts
      summary: List community products, un-promoted only (role admin)
      description: >
        Every admin-minted community product (origin community): the
        population promote can flip to a provider identity, and delete
        can remove once no entry references it. Ordered oldest
        updated_at first with _id as the tiebreak so offset pages are
        deterministic. limit defaults to 200 (max 500), offset slices
        the sequence, and total_count reports the full filtered count.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: One community listing page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityProductsPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    BadRequest:
      description: Invalid parameters or body
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Missing/invalid token
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Insufficient role
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UpstreamError:
      description: A provider call failed (code upstream_unavailable)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    PlatformRef:
      type: object
      required: [igdb_platform_id, name]
      properties:
        igdb_platform_id: { type: integer, format: int64 }
        name: { type: string }
        logo_url:
          type: string
          description: IGDB platform logo; the display fallback for products without cover art.
    CatalogPlatform:
      description: One platform-catalog row with its known aliases.
      type: object
      required: [igdb_id, name, aliases]
      properties:
        igdb_id: { type: integer, format: int64 }
        name: { type: string }
        aliases:
          description: Alternate spellings and abbreviations (compare case-insensitively).
          type: array
          items: { type: string }
    PlatformCatalog:
      type: object
      required: [platforms]
      properties:
        platforms:
          type: array
          items: { $ref: "#/components/schemas/CatalogPlatform" }
    SearchResult:
      description: >
        Flat result with a type discriminator. Game results carry the
        igdb_* fields; hardware results carry the pc_* fields plus the
        PriceCharting category (Systems, Controllers, Accessories).
        pc_listing results carry the pc_* fields, the PriceCharting
        category (empty when the provider lists none), and the standard
        per-listing loose/cib/new prices so variant prints are tellable
        apart.
      type: object
      required: [type, name]
      properties:
        type: { type: string, enum: [game, hardware, pc_listing] }
        name: { type: string }
        igdb_game_id: { type: integer, format: int64 }
        platforms:
          type: array
          items: { $ref: "#/components/schemas/PlatformRef" }
        first_release_date: { type: string, format: date }
        cover_url: { type: string }
        pc_product_id: { type: integer, format: int64 }
        console_name: { type: string }
        category: { type: string }
        loose_cents: { type: integer, format: int64 }
        cib_cents: { type: integer, format: int64 }
        new_cents: { type: integer, format: int64 }
        origin:
          type: string
          enum: [community]
          description: >
            Marks an interleaved community result (admin-minted,
            anchor-less); absent on provider results. Community results
            carry product_id + item_type + platform_name for the pick
            and community.cover_url as cover_url. They are scored against
            the query by name similarity and merged into results by
            descending score (a provider result precedes a community
            result of equal score), capped at 10, for game and hardware
            searches only (never pc_listing). The provider cache stores
            provider results only - community items attach fresh on every
            search.
        product_id: { type: string, format: uuid }
        item_type: { type: string, enum: [game, console, accessory] }
        platform_name: { type: string }
    SearchResults:
      type: object
      required: [degraded, results]
      properties:
        degraded:
          type: boolean
          description: True when the provider was unreachable and the local catalog answered instead.
        results:
          type: array
          items: { $ref: "#/components/schemas/SearchResult" }
    FXRates:
      type: object
      required: [base, date, rates]
      properties:
        base:
          type: string
          description: Always USD.
        date:
          type: string
          description: Upstream snapshot date (YYYY-MM-DD), not the fetch time.
        rates:
          type: object
          description: >
            Target-units-per-USD by ISO 4217 code. USD itself is
            omitted (it is the base; conversion short-circuits).
          additionalProperties: { type: number, format: double }
    IgdbMeta:
      description: Projection of the raw IGDB payload held in igdb_raw; refreshed on its own cadence.
      type: object
      required: [game_id, name, genres, themes, franchises, similar_games, companies, fetched_at]
      properties:
        game_id: { type: integer, format: int64 }
        name: { type: string }
        cover_url: { type: string }
        genres:
          type: array
          items: { type: string }
        themes:
          type: array
          items: { type: string }
        franchises:
          type: array
          items: { type: string }
        similar_games:
          type: array
          items: { type: integer, format: int64 }
        companies:
          type: array
          items: { $ref: "#/components/schemas/CompanyCredit" }
        first_release_date:
          type: string
          format: date
          description: >
            Earliest date for the product's platform; the game-level
            first release when IGDB lists no dated rows for the
            platform.
        release_dates:
          description: >
            Per-region release dates for the product's platform, the
            earliest concrete date per region. Region values are
            canonical IGDB names (europe, north_america, australia,
            new_zealand, japan, china, asia, worldwide, korea, brazil).
            JP twin platforms fold into their sibling (SNES/Super Famicom,
            NES/Famicom).
          type: array
          items: { $ref: "#/components/schemas/ReleaseDate" }
        fetched_at: { type: string, format: date-time }
    CompanyCredit:
      type: object
      required: [name, developer, publisher]
      properties:
        name: { type: string }
        developer: { type: boolean }
        publisher: { type: boolean }
    ReleaseDate:
      type: object
      required: [region, date]
      properties:
        region: { type: string }
        date: { type: string, format: date }
    PricechartingMeta:
      description: >
        The PriceCharting mapping and current prices; refreshed daily.
        Absent from a product when no candidate cleared the match
        confidence threshold (no guessing) and the mapping has not been
        corrected by an admin.
      type: object
      required: [pc_product_id, pc_name, console_name, match_confidence, verified, as_of]
      properties:
        pc_product_id: { type: integer, format: int64 }
        pc_name: { type: string }
        console_name: { type: string }
        match_confidence: { type: number, format: double }
        verified: { type: boolean }
        loose_cents: { type: integer, format: int64 }
        cib_cents: { type: integer, format: int64 }
        new_cents: { type: integer, format: int64 }
        as_of: { type: string, format: date-time }
    Product:
      type: object
      required: [id, type, name, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [game, console, accessory, pc_listing] }
        name: { type: string }
        platform: { $ref: "#/components/schemas/PlatformRef" }
        region: { type: string }
        edition: { type: string }
        variant: { type: string }
        igdb: { $ref: "#/components/schemas/IgdbMeta" }
        pricecharting: { $ref: "#/components/schemas/PricechartingMeta" }
        match_hold:
          type: boolean
          description: >
            Present true when an admin clear holds this product out of
            the nightly re-match walk.
        origin:
          type: string
          enum: [community]
          description: >
            Emitted only for admin-minted community products (absent
            means provider-identified). Community products live
            outside the provider identity indexes; their curated name
            is their identity.
        community: { $ref: "#/components/schemas/CommunityMeta" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CommunityMeta:
      description: >
        Facts curated at community mint time; retained after promotion
        as gap-fill (provider blocks win per-field where present).
      type: object
      properties:
        platform_name: { type: string }
        first_release_date: { type: string, format: date }
        cover_url:
          type: string
          description: >
            User-supplied cover image URL (https, never fetched
            server-side; the client renders it with a broken-image
            fallback). Served as the product cover when no provider
            cover is present; retained after promotion as gap-fill.
    CommunityProductCreate:
      type: object
      required: [type, name]
      properties:
        type: { type: string, enum: [game, console, accessory] }
        name: { type: string, minLength: 1, maxLength: 200 }
        platform_name: { type: string, maxLength: 100 }
        region: { type: string, maxLength: 32 }
        edition:
          type: string
          maxLength: 128
          description: The entry idiom's single "Edition or variant" note.
        first_release_date: { type: string, format: date }
        cover_url:
          type: string
          maxLength: 512
          description: Optional https cover image URL (validated by shape only, never fetched).
    PromoteRequest:
      description: >
        Provider identity for an in-place promotion. type game
        products require igdb_game_id + platform_igdb_id and accept
        an optional pc_product_id (the listing can also arrive later
        via the nightly walk or the mapping fix, once provider);
        console and accessory products require pc_product_id. The
        identity the product re-enters the index with completes with
        the doc's stored region/edition/variant.
      type: object
      properties:
        igdb_game_id: { type: integer, format: int64 }
        platform_igdb_id: { type: integer, format: int64 }
        pc_product_id: { type: integer, format: int64 }
    PromoteCandidate:
      type: object
      required: [provider, provider_id, name, score, found_at]
      properties:
        provider: { type: string, enum: [igdb, pricecharting] }
        provider_id: { type: integer, format: int64 }
        name: { type: string }
        score: { type: number, format: double }
        found_at: { type: string, format: date-time }
    PromoteCandidatesPage:
      type: object
      required: [products, total_count]
      properties:
        products:
          type: array
          items: { $ref: "#/components/schemas/PromoteCandidateProduct" }
        total_count:
          type: integer
          format: int64
          description: Full count of flagged community products.
    PromoteCandidateProduct:
      type: object
      required: [product, candidates]
      properties:
        product: { $ref: "#/components/schemas/Product" }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/PromoteCandidate" }
    DismissCandidateRequest:
      type: object
      required: [provider, provider_id]
      properties:
        provider: { type: string, enum: [igdb, pricecharting] }
        provider_id: { type: integer, format: int64 }
    ResolveRequest:
      description: >
        type game requires igdb_game_id + platform_igdb_id (the
        platform must be one the game released on). Game identity is
        listing-keyed - (game, platform, PriceCharting listing) - so
        region/edition/variant on a game resolve are ignored
        (entry-level facts, like pc_listing). Without pc_product_id
        the resolve auto-matches by the plain game name through the
        shared listing-search cache and lands on the winning listing's
        product; below the confidence threshold, or with the provider
        down, it lands on the game+platform's single unmatched product
        instead - never guessed. Optional match_hint (game only,
        ignored elsewhere) reweights the scoring toward variant text
        without changing the search query; a hint nothing matches
        makes the resolve conservative (unmatched).
        With pc_product_id (a manual match: the exact listing the user
        chose) auto-match is skipped and the resolve finds or mints
        the product carrying that listing (match_confidence 1.0,
        verified false); unknown id answers 404 unknown_pc_product,
        provider failure 502 upstream_unavailable. Resolves never
        touch an existing product's mapping; corrections stay on the
        admin mapping endpoint.
        console/accessory require pc_product_id;
        region/edition/variant distinguish physical variants and are
        part of hardware identity. type pc_listing requires
        pc_product_id and mints a price-anchor product for that exact
        listing; region/edition/variant are ignored (the listing IS
        the exact variant).
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [game, console, accessory, pc_listing] }
        igdb_game_id: { type: integer, format: int64 }
        platform_igdb_id: { type: integer, format: int64 }
        pc_product_id: { type: integer, format: int64 }
        match_hint: { type: string, maxLength: 128 }
        region: { type: string, maxLength: 32 }
        edition: { type: string, maxLength: 128 }
        variant: { type: string, maxLength: 128 }
    PricesBatchRequest:
      type: object
      required: [product_ids]
      properties:
        product_ids:
          type: array
          maxItems: 500
          items: { type: string, format: uuid }
    ProductPrices:
      type: object
      required: [unmatched]
      properties:
        unmatched: { type: boolean }
        loose_cents: { type: integer, format: int64 }
        cib_cents: { type: integer, format: int64 }
        new_cents: { type: integer, format: int64 }
        as_of: { type: string, format: date-time }
    PricesBatchResponse:
      type: object
      required: [prices]
      properties:
        prices:
          type: object
          additionalProperties: { $ref: "#/components/schemas/ProductPrices" }
    PriceHistoryRequest:
      type: object
      required: [product_ids]
      properties:
        product_ids:
          type: array
          maxItems: 500
          items: { type: string, format: uuid }
        days:
          type: integer
          minimum: 1
          maximum: 365
          default: 90
          description: Window size ending now.
    PricePoint:
      type: object
      required: [captured_at]
      properties:
        captured_at: { type: string, format: date-time }
        loose_cents: { type: integer, format: int64 }
        cib_cents: { type: integer, format: int64 }
        new_cents: { type: integer, format: int64 }
    PriceHistoryResponse:
      type: object
      required: [series]
      properties:
        series:
          type: object
          additionalProperties:
            type: array
            items: { $ref: "#/components/schemas/PricePoint" }
    LibraryEntry:
      type: object
      required: [igdb_game_id]
      properties:
        igdb_game_id: { type: integer, format: int64 }
        rating: { type: integer, minimum: 1, maximum: 10 }
        status:
          type: string
          description: The caller's own status vocabulary; scoring only distinguishes "dropped".
    ScoreRequest:
      type: object
      required: [library]
      properties:
        library:
          type: array
          maxItems: 2500
          items: { $ref: "#/components/schemas/LibraryEntry" }
        limit: { type: integer, minimum: 1, maximum: 50, default: 20 }
    Recommendation:
      type: object
      required: [igdb_game_id, name, genres, score]
      properties:
        igdb_game_id: { type: integer, format: int64 }
        name: { type: string }
        cover_url: { type: string }
        genres:
          type: array
          items: { type: string }
        first_release_date: { type: string, format: date }
        score: { type: number, format: double }
    ScoreResponse:
      type: object
      required: [degraded, recommendations]
      properties:
        degraded:
          type: boolean
          description: True when candidate metadata fetches failed and some candidates were skipped.
        recommendations:
          type: array
          items: { $ref: "#/components/schemas/Recommendation" }
    RefreshAccepted:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [started] }
    UnmatchedProductsPage:
      type: object
      required: [products, total_count]
      properties:
        products:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        total_count:
          type: integer
          format: int64
          description: Full count of unmatched products, beyond this page.
    CommunityProductsPage:
      type: object
      required: [products, total_count]
      properties:
        products:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        total_count:
          type: integer
          format: int64
          description: Full count of community products, beyond this page.
    MappingRequest:
      type: object
      required: [pc_product_id]
      properties:
        pc_product_id:
          type: integer
          format: int64
          nullable: true
          description: Null clears the mapping (the product becomes unmatched and held).
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
