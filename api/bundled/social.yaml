openapi: 3.0.3
info:
  title: vgkeep social service
  version: 0.1.0
  description: |
    Follows, likes, comments, and the activity feed. Every endpoint requires an authenticated end-user bearer (the bff relays the caller's own token); authorization is per-handler. Shelf ids are saved-view ids seen through the social layer.
security:
  - bearerAuth: []
paths:
  /follows/{userId}:
    put:
      operationId: follow
      summary: Follow a user (idempotent)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Following (already or newly)
        '400':
          $ref: '#/components/responses/BadRequest'
          description: Self-follow (code self_follow)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: Followee unknown or private (code profile_not_found)
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/UpstreamError'
        default:
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: unfollow
      summary: Unfollow a user (idempotent)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Not following (already or newly)
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/InternalError'
  /profiles/{userId}/summary:
    get:
      operationId: getProfileSocialSummary
      summary: Follower/following counts plus whether the caller follows this user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSocialSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/InternalError'
  /likes/{shelfId}:
    put:
      operationId: likeShelf
      summary: Like a shelf (idempotent; validates the shelf via collection)
      parameters:
        - name: shelfId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Liked (already or newly)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: Like cap reached - unliking does not reset it (code cap_exceeded)
        '502':
          $ref: '#/components/responses/UpstreamError'
        default:
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: unlikeShelf
      summary: Remove a like (idempotent)
      parameters:
        - name: shelfId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Not liked (already or newly)
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/InternalError'
  /shelves/summary:
    get:
      operationId: getShelvesSocialSummary
      summary: Batch like/comment counts + caller state for shelves
      parameters:
        - name: ids
          in: query
          required: true
          schema:
            type: array
            maxItems: 100
            items:
              type: string
              format: uuid
      responses:
        '200':
          description: Summaries (ids without social rows still answer, zeroed)
          content:
            application/json:
              schema:
                type: object
                required:
                  - summaries
                properties:
                  summaries:
                    type: array
                    items:
                      $ref: '#/components/schemas/ShelfSocialSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/InternalError'
  /shelves/{shelfId}/comments:
    get:
      operationId: listShelfComments
      summary: Live comments, newest first, keyset-paged
      parameters:
        - name: shelfId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/cursor'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                type: object
                required:
                  - comments
                properties:
                  comments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comment'
                  next_cursor:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createShelfComment
      summary: Comment on a shelf (validates the shelf via collection)
      parameters:
        - name: shelfId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - body
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        '201':
          description: The comment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: Invalid body (code invalid_body)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: Comment cap reached - tombstones count (code cap_exceeded)
        '502':
          $ref: '#/components/responses/UpstreamError'
        default:
          $ref: '#/components/responses/InternalError'
  /comments/{commentId}:
    delete:
      operationId: deleteComment
      summary: Delete a comment (author tombstones body-NULL; shelf owner tombstones body-retained)
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Tombstoned
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: Unknown or already tombstoned (code comment_not_found)
        default:
          $ref: '#/components/responses/InternalError'
  /comments/by-ids:
    get:
      operationId: getCommentsByIds
      summary: Batch live comments (feed excerpt hydration)
      parameters:
        - name: ids
          in: query
          required: true
          schema:
            type: array
            maxItems: 100
            items:
              type: string
              format: uuid
      responses:
        '200':
          description: Live comments among the ids
          content:
            application/json:
              schema:
                type: object
                required:
                  - comments
                properties:
                  comments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/InternalError'
  /feed:
    get:
      operationId: getFeed
      summary: Raw activity events for the caller, keyset-paged
      parameters:
        - $ref: '#/components/parameters/tab'
        - $ref: '#/components/parameters/cursor'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: One raw page (the bff hydrates, gates, and fills)
          content:
            application/json:
              schema:
                type: object
                required:
                  - events
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/ActivityEvent'
                  next_cursor:
                    type: string
                    description: Cursor of the last RAW row; absent when exhausted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/InternalError'
  /events/shelf-published:
    post:
      operationId: recordShelfPublished
      summary: Record a publish (bff-orchestrated; one live row per shelf, hourly refresh throttle)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - shelf_id
              properties:
                shelf_id:
                  type: string
                  format: uuid
      responses:
        '204':
          description: Recorded (created
          refreshed: null
          or throttled): null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/UpstreamError'
        default:
          $ref: '#/components/responses/InternalError'
  /explore/top-shelves:
    get:
      operationId: getTopShelves
      summary: Shelf ids by live like count, all-time (leaderboard, no deep paging)
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
      responses:
        '200':
          description: Ids, most-liked first
          content:
            application/json:
              schema:
                type: object
                required:
                  - shelf_ids
                properties:
                  shelf_ids:
                    type: array
                    items:
                      type: string
                      format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/InternalError'
  /user-data:
    delete:
      operationId: purgeUserData
      summary: Account-deletion leg - purge the caller's social graph (idempotent)
      description: |
        Hard-deletes follows (both directions), likes by the caller and on the caller's shelves, activity where the caller is actor or target, and comments on the caller's own shelves. Comments the caller authored on other shelves are anonymized in place (author and body NULLed, tombstoned). deleted_by references to the caller are NULLed. Irreversible.
      responses:
        '204':
          description: Purged
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Missing/invalid token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Unexpected server-side failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UpstreamError:
      description: A downstream dependency failed (code upstream_error)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: Malformed cursor (code invalid_param)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Caller is neither author nor shelf owner (code forbidden)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Shelf unknown or private (code shelf_not_found)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Follow cap reached - unfollowing does not reset it (code cap_exceeded)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ProfileSocialSummary:
      type: object
      required:
        - follower_count
        - following_count
        - viewer_follows
      properties:
        follower_count:
          type: integer
        following_count:
          type: integer
        viewer_follows:
          type: boolean
    ShelfSocialSummary:
      type: object
      required:
        - shelf_id
        - like_count
        - comment_count
        - viewer_likes
      properties:
        shelf_id:
          type: string
          format: uuid
        like_count:
          type: integer
        comment_count:
          type: integer
          description: Live comments only.
        viewer_likes:
          type: boolean
    Comment:
      description: A live comment; tombstones never serialize.
      type: object
      required:
        - id
        - shelf_id
        - author_id
        - body
        - created_at
      properties:
        id:
          type: string
          format: uuid
        shelf_id:
          type: string
          format: uuid
        author_id:
          type: string
          format: uuid
        body:
          type: string
        created_at:
          type: string
          format: date-time
    ActivityEvent:
      type: object
      required:
        - id
        - actor_id
        - verb
        - target_user_id
        - created_at
      properties:
        id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        verb:
          $ref: '#/components/schemas/ActivityVerb'
        object_shelf_id:
          type: string
          format: uuid
        object_comment_id:
          type: string
          format: uuid
        target_user_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    Problem:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          $ref: '#/components/schemas/ProblemCode'
    ProblemCode:
      description: |
        The full house code vocabulary across every service (Problem is shared, and the bff relays upstream codes verbatim).
      type: string
      enum:
        - cap_exceeded
        - comment_not_found
        - conflicting_order
        - email_unverified
        - enrichment_unavailable
        - entry_not_custom
        - entry_not_found
        - forbidden
        - handle_cooldown
        - handle_taken
        - identity_already_linked
        - identity_not_found
        - identity_taken
        - internal
        - invalid_body
        - invalid_callback
        - invalid_internal_token
        - invalid_param
        - invalid_product_change
        - invalid_refresh
        - invalid_state
        - invalid_token
        - last_identity
        - link_email_unverified
        - link_failed
        - missing_token
        - not_found
        - not_in_backlog
        - not_ready
        - origin_forbidden
        - product_matched
        - product_not_community
        - product_not_found
        - product_not_provider
        - product_referenced
        - profile_not_found
        - provider_error
        - refresh_in_progress
        - refresh_reused
        - rematch_in_progress
        - self_follow
        - shelf_not_found
        - submission_not_found
        - submission_pending
        - submission_rate_limited
        - submission_resolved
        - tag_cap_exceeded
        - tag_exists
        - tag_not_found
        - too_many_pending_submissions
        - unauthenticated
        - unknown_fixture
        - unknown_game
        - unknown_pc_product
        - unknown_pricing_product
        - unknown_product
        - unknown_provider
        - upstream_error
        - upstream_unavailable
        - user_not_found
        - user_service_error
        - user_unavailable
        - view_exists
        - view_not_found
    ActivityVerb:
      type: string
      enum:
        - followed_user
        - liked_shelf
        - commented_shelf
        - published_shelf
  parameters:
    cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    tab:
      name: tab
      in: query
      required: true
      schema:
        type: string
        enum:
          - following
          - you
