          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          default: USD
        purchased_at:
          type: string
          format: date
        purchased_from:
          type: string
          maxLength: 200
        pricing_mode:
          default: auto
          allOf:
            - $ref: '#/components/schemas/PricingMode'
        pricing_product_id:
          type: string
          format: uuid
