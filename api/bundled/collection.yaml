openapi: 3.0.3
info:
  title: vgkeep collection service
  version: 0.1.0
  description: |
    Cluster-internal collection domain: granular physical entries against the enrichment catalog, user-scoped tags, saved views, a fractional-index backlog ordering, and a dashboard composing SQL aggregates with batched enrichment prices. Every operation requires a Bearer access JWT validated against the auth service's JWKS and is scoped to the token's subject - except the admin reads and verdicts (role admin) and the /internal levers (role admin or a service token; not subject-scoped). Catalog facts (item type, display name, platform, release date) are snapshotted onto an entry at creation from the enrichment product; current prices are composed at read time and never stored.
security:
  - bearerAuth: []
paths:
  /entries:
    get:
      operationId: listEntries
      summary: List the caller's entries (filter x sort x group matrix)
      description: |
        Filters combine AND across dimensions and OR within one, except tag_id which requires ALL listed tags. pinned entries always sort first (within each group when grouped), except under sort=backlog_rank, the drag-order read, which is pure rank order. Nullable sort dimensions place nulls last in both directions; ties break on created_at (newest first) then id. sort=value composes current prices from enrichment before ordering; sort=backlog_rank is meaningful with status=backlog. group_by partitions the sorted list: groups order by label ascending with the catch-all group (Unknown/Unassigned/ Untagged) last, and group_by=tag repeats a multi-tagged entry in each of its tag groups. Responses are paginated: limit (default 200, max 500) and offset slice the sorted flat sequence and total_count reports the full filtered count; when grouped, the groups partition the requested page, so a group may continue on the next page. pricing_available=false flags that enrichment could not be reached and every value_cents is null.
      parameters:
        - $ref: '#/components/parameters/entriesItemType'
        - $ref: '#/components/parameters/statusFilter'
        - $ref: '#/components/parameters/entriesPackaging'
        - $ref: '#/components/parameters/entriesRegion'
        - $ref: '#/components/parameters/entriesDeveloper'
        - $ref: '#/components/parameters/entriesPublisher'
        - $ref: '#/components/parameters/entriesItemCondition'
        - $ref: '#/components/parameters/platformId'
        - $ref: '#/components/parameters/entriesTagId'
        - $ref: '#/components/parameters/entriesSort'
        - $ref: '#/components/parameters/order'
        - $ref: '#/components/parameters/groupBy'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: The filtered entries, flat or grouped (exactly one of entries/groups is present)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createEntry
      summary: Add an entry (catalog-backed, or custom for off-catalog items)
      description: |
        With a product_id, fetches the product from enrichment to snapshot item_type, display_name, platform, first_release_date, and igdb_game_id (games) onto the row; the client never supplies catalog facts for those. WITHOUT a product_id the entry is CUSTOM (an item the providers do not list): the client supplies display_name and item_type, optionally a free-text platform_name and first_release_date; pricing_mode defaults to disabled and auto is invalid (no own product) - pick a catalog product as the price source via pricing_mode proxy + pricing_product_id, or carry an owner-entered value via pricing_mode custom + custom_value_cents. A backlog entry receives a backlog_rank at the end of the backlog. Errors: 404 code unknown_product (product_id) or unknown_pricing_product (pricing_product_id) or tag_not_found; 502 code enrichment_unavailable when the catalog cannot be reached (product-backed creation's one hard dependency; a custom create needs enrichment only to validate a proxy reference). value_cents in the response is composed best-effort like every entry read.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryCreate'
      responses:
        '201':
          description: The created entry
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: A referenced product or tag does not exist (code unknown_product, unknown_pricing_product, or tag_not_found)
        '502':
          $ref: '#/components/responses/UpstreamError'
        default:
          $ref: '#/components/responses/InternalError'
  /entries/bulk-update:
    post:
      operationId: bulkUpdateEntries
      summary: Apply tag/status/storage-location changes across a batch of the caller's entries (transactional)
      description: |
        One transaction, all-or-nothing: tag removal and tag addition both apply ownership-scoped (a foreign or unknown tag id in add_tag_ids/remove_tag_ids simply matches nothing, same posture as tag attachment elsewhere), and whichever scalar fields are present apply in the same transaction. A status change to backlog manages backlog_rank like the single-entry update: newly-entering entries append at the end (oldest-created first among the batch), entries already in backlog keep their position, and a status change away from backlog clears it. If any targeted entry would end up holding more than 50 tags, the WHOLE transaction rolls back (400 code tag_cap_exceeded) - a skipped-entry partial apply is never allowed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkUpdateRequest'
      responses:
        '200':
          description: The count of the caller's own entries among entry_ids (present even when every requested change already held)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkUpdateResult'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: Bounds violated, no action specified, or the per-entry tag cap exceeded (code invalid_body or tag_cap_exceeded)
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/InternalError'
  /entries/{entryId}:
    get:
      operationId: getEntry
      summary: Fetch one entry with its composed current value
      parameters:
        - name: entryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: Not found (code entry_not_found; foreign entries answer identically)
        default:
          $ref: '#/components/responses/InternalError'
    put:
      operationId: updateEntry
      summary: Replace an entry's mutable state (the edit form submits everything)
      description: |
        Full replacement of the mutable fields; an absent optional field is cleared. media_type and the entry's custom-ness are immutable. product_id accepts one narrow change - re-matching an auto-priced entry off an unmatched game product onto a product of the same game and platform (see EntryUpdate); anything else answers 400 code invalid_product_change. On CUSTOM entries the user-owned display fields are part of the mutable state: display_name is required and platform_name/first_release_date replace like any optional field; on product-backed entries those fields are rejected (400) - the catalog snapshot is immutable. Status transitions manage backlog_rank: entering backlog appends at the end, leaving clears, staying keeps the position. A changed pricing_product_id is validated against enrichment; auto stays invalid for custom entries. Pin toggles ride this operation.
      parameters:
        - name: entryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryUpdate'
      responses:
        '200':
          description: The updated entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: No such entry, or a referenced pricing product or tag does not exist
        '502':
          $ref: '#/components/responses/UpstreamError'
        default:
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteEntry
      summary: Delete an entry (tag links cascade)
      parameters:
        - name: entryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/InternalError'
  /entries/{entryId}/reorder:
    post:
      operationId: reorderEntry
      summary: Move a backlog entry between two neighbors (single-row fractional-index write)
      description: |
        after_id is the entry that precedes the drop slot, before_id the one that follows; null marks a list edge (both null is invalid). The neighbors' ranks must straddle or the reorder answers 409 code conflicting_order (a stale drag against a list that moved); the entry and both neighbors must be the caller's backlog entries or it answers 409 code not_in_backlog. Ranks are server-generated; clients never send one.
      parameters:
        - name: entryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderRequest'
      responses:
        '200':
          description: The entry at its new position
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: The entry or a neighbor is not in the backlog, or the neighbors do not straddle (code not_in_backlog or conflicting_order)
        default:
          $ref: '#/components/responses/InternalError'
  /entries/{entryId}/region-mismatch-ack:
    post:
      operationId: ackEntryRegionMismatch
      summary: Dismiss the region-mismatch banner for the entry's current choice
      description: |
        Stamps region_mismatch_ack_at on the caller's entry for its current (region, product) choice, so the banner does not reappear until either changes (both clear the stamp). Idempotent: 204 on every call while the choice stands.
      parameters:
        - name: entryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Acknowledged
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: Not found (code entry_not_found; foreign entries answer identically)
        default:
          $ref: '#/components/responses/InternalError'
  /entries/{entryId}/submission:
    post:
      operationId: createSubmission
      summary: Submit a custom entry as a catalog candidate
      description: |
        Files the entry into the admin review queue. Custom entries only (400 code entry_not_custom otherwise); one pending submission per entry (409 code submission_pending). The queue holds a live reference: entry edits flow into what the admin reviews until the verdict. Abuse caps, per user: at most 10 pending (429 code too_many_pending_submissions) and at most 20 created in any rolling 24h window (429 code submission_rate_limited) - cancelled submissions still count toward the window, so cancel/recreate does not reset it.
      parameters:
        - name: entryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: The pending submission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: A submission is already pending for the entry (code submission_pending)
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/InternalError'
    get:
      operationId: getSubmission
      summary: The entry's latest submission, any status
      description: |
        The entry page's read: pending shows the wait, rejected shows the reason, cancelled reads as none for resubmit purposes. 404 code entry_not_found for a foreign or missing entry; submission_not_found when the entry never had one.
      parameters:
        - name: entryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The latest submission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: Not found (code entry_not_found or submission_not_found)
        default:
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: cancelSubmission
      summary: Cancel the entry's pending submission
      description: |
        Flips the pending submission to cancelled - a status change, not a delete: the row persists and still counts toward the rolling creation cap. 404 code submission_not_found when nothing is pending.
      parameters:
        - name: entryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Cancelled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: Nothing pending (code submission_not_found)
        default:
          $ref: '#/components/responses/InternalError'
  /entries/{entryId}/submission/ack:
    post:
      operationId: ackSubmissionResolution
      summary: Acknowledge an approved submission (dismiss the banner)
      description: |
        Stamps resolution_ack_at on the caller's latest approved submission for the entry, so the approval banner does not reappear on the next open. Idempotent: 204 on the first stamp and on every repeat. 404 code entry_not_found for a foreign or missing entry; submission_not_found when the entry has no approved submission.
      parameters:
        - name: entryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Acknowledged (or already acknowledged)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: Not found (code entry_not_found or submission_not_found)
        default:
          $ref: '#/components/responses/InternalError'
  /tags:
    get:
      operationId: listTags
      summary: List the caller's tags with usage counts
      responses:
        '200':
          description: Tags ordered by name
          content:
            application/json:
              schema:
                type: object
                required:
                  - tags
                properties:
                  tags:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createTag
      summary: Create a tag (names are unique per user, case-insensitively)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagCreate'
      responses:
        '201':
          description: The created tag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: Tag cap reached - at most 200 distinct tags per user (code cap_exceeded)
        default:
          $ref: '#/components/responses/InternalError'
  /tags/{tagId}:
    put:
      operationId: renameTag
      summary: Rename a tag
      parameters:
        - name: tagId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagCreate'
      responses:
        '200':
          description: The renamed tag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: Not found (code tag_not_found)
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteTag
      summary: Delete a tag (entry links cascade; entries survive)
      parameters:
        - name: tagId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: Not found (code tag_not_found)
        default:
          $ref: '#/components/responses/InternalError'
  /views:
    get:
      operationId: listViews
      summary: List the caller's saved views
      responses:
        '200':
          description: Views ordered by name
          content:
            application/json:
              schema:
                type: object
                required:
                  - views
                properties:
                  views:
                    type: array
                    items:
                      $ref: '#/components/schemas/SavedView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createView
      summary: Save a view (an opaque frontend params document; names unique per user)
      description: |
        params is the frontend's serialized view state (filters, sort, group_by, view mode). The server validates only that it is a JSON object of at most 8192 marshaled bytes; its vocabulary belongs to the frontend.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViewCreate'
      responses:
        '201':
          description: The saved view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
          description: Name already taken (code view_exists)
        default:
          $ref: '#/components/responses/InternalError'
  /views/{viewId}:
    put:
      operationId: updateView
      summary: Replace a saved view's name, params, and visibility
      description: |
        Full replacement: name, params, and visibility are all overwritten from the body. An absent visibility resets to private (ViewCreate's default), not left unchanged - this is how a listed shelf is unpublished.
      parameters:
        - name: viewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViewCreate'
      responses:
        '200':
          description: The updated view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: Not found (code view_not_found)
        '409':
          $ref: '#/components/responses/Conflict'
          description: Name already taken (code view_exists)
        default:
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteView
      summary: Delete a saved view
      parameters:
        - name: viewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: Not found (code view_not_found)
        default:
          $ref: '#/components/responses/InternalError'
  /shared/shelves:
    get:
      operationId: listSharedShelves
      summary: Listed shelf summaries, newest publish first (any authenticated caller)
      description: |
        owner_ids absent or empty pages every listed shelf across every owner (Explore-recent's read); present, it scopes the page to just those owners (the profile page's read), same guard and pagination semantics either way.
      parameters:
        - name: owner_ids
          in: query
          required: false
          description: |
            Omit to page across all listed shelves; when present, at most 5000 owner ids to scope the page to.
          schema:
            type: array
            maxItems: 5000
            items:
              type: string
              format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: One page of summaries plus the total
          content:
            application/json:
              schema:
                type: object
                required:
                  - total_count
                  - shelves
                properties:
                  total_count:
                    type: integer
                  shelves:
                    type: array
                    items:
                      $ref: '#/components/schemas/SharedShelfSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/InternalError'
  /shared/shelves/by-slug:
    get:
      operationId: getSharedShelfBySlug
      summary: Resolve (owner, slug) to a shelf; folds case and underscores
      parameters:
        - name: owner_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: slug
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The shelf (non-private)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedShelf'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: Unknown or private (indistinguishable; code shelf_not_found)
        default:
          $ref: '#/components/responses/InternalError'
  /shared/shelves/by-ids:
    get:
      operationId: getSharedShelvesByIds
      summary: Batch shelf summaries for hydration (non-private only)
      parameters:
        - name: ids
          in: query
          required: true
          schema:
            type: array
            maxItems: 100
            items:
              type: string
              format: uuid
      responses:
        '200':
          description: Summaries for the ids that resolve non-private
          content:
            application/json:
              schema:
                type: object
                required:
                  - shelves
                properties:
                  shelves:
                    type: array
                    items:
                      $ref: '#/components/schemas/SharedShelfSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/InternalError'
  /shared/shelves/{shelfId}:
    get:
      operationId: getSharedShelf
      summary: Shelf meta by id (non-private; any authenticated caller)
      parameters:
        - name: shelfId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The shelf
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedShelf'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: Unknown or private (indistinguishable; code shelf_not_found)
        default:
          $ref: '#/components/responses/InternalError'
  /shared/shelves/{shelfId}/entries:
    get:
      operationId: listSharedShelfEntries
      summary: Execute a shelf's stored params and return the whitelisted projection
      description: |
        Filters, sort, and grouping come from the stored params verbatim; the caller controls pagination only. Money and personal fields never appear (SharedEntry is a strict whitelist); a stored sort of "value" degrades to the stable base order because value composition never runs here.
      parameters:
        - name: shelfId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: One page of the shelf's entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedEntryList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: Unknown or private (indistinguishable; code shelf_not_found)
        default:
          $ref: '#/components/responses/InternalError'
  /dashboard:
    get:
      operationId: getDashboard
      summary: Collection dashboard (SQL aggregates + one batched enrichment price call)
      description: |
        Counts and spend come from SQL; total value composes each entry's effective pricing product (auto uses the entry's own product, proxy the override, custom its stored custom_value_cents, disabled is excluded) with the packaging-appropriate price field. The entries-list filter dimensions narrow every aggregate exactly as they narrow the list (AND across dimensions, OR within one, tag_id requiring ALL listed tags). Only the unfiltered dashboard is cached (DASHBOARD_CACHE_TTL, default 5m, invalidated by the caller's own entry mutations); filtered requests are computed live. When enrichment is unreachable the dashboard still answers with pricing.available=false (and the degraded result is not cached).
      parameters:
        - $ref: '#/components/parameters/entriesItemType'
        - $ref: '#/components/parameters/statusFilter'
        - $ref: '#/components/parameters/entriesPackaging'
        - $ref: '#/components/parameters/entriesRegion'
        - $ref: '#/components/parameters/entriesDeveloper'
        - $ref: '#/components/parameters/entriesPublisher'
        - $ref: '#/components/parameters/entriesItemCondition'
        - $ref: '#/components/parameters/platformId'
        - $ref: '#/components/parameters/entriesTagId'
      responses:
        '200':
          description: The dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/InternalError'
  /dashboard/value-history:
    get:
      operationId: getValueHistory
      summary: Collection value over time (composed from enrichment price snapshots)
      description: |
        One point per day over the last ninety days - each day in the union of snapshot days across the caller's effective pricing products. An entry contributes its packaging-appropriate price from its effective product's latest snapshot on or before the day; entries whose product has no snapshot yet contribute nothing that day. The series values the CURRENT collection at historical prices; it does not reconstruct past collection composition. Cached and invalidated exactly like the dashboard. When enrichment is unreachable the endpoint answers available=false with no points, and that answer is not cached.
      responses:
        '200':
          description: The value series, oldest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValueHistory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/InternalError'
  /library/summary:
    get:
      operationId: getLibrarySummary
      summary: Deduplicated game-library summary (recommendation scoring input)
      description: |
        Games with an igdb_game_id snapshot, deduplicated across copies: highest rating wins and status reports dropped only when every copy is dropped. Shaped exactly like the enrichment scoring contract's library array so a caller pipes it through without reshaping.
      responses:
        '200':
          description: The library summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibrarySummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/InternalError'
  /user-data:
    delete:
      operationId: purgeUserData
      summary: Delete every collection row belonging to the caller (entries, tags, saved views); idempotent
      responses:
        '204':
          description: Purged (also when there was nothing to purge)
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/InternalError'
  /admin/products/{productId}/references:
    get:
      operationId: countProductReferences
      summary: Count entries referencing a product, across all users (role admin)
      description: |
        The admin delete's safety read: a shared catalog product is deletable only when no entry would dangle, and only this service can see entries. Counts every user's entries for the product; serves only the count.
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The reference count
          content:
            application/json:
              schema:
                type: object
                required:
                  - entry_count
                properties:
                  entry_count:
                    type: integer
                    format: int64
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/InternalError'
  /admin/submissions:
    get:
      operationId: listSubmissions
      summary: The pending catalog-submission queue, across all users (role admin)
      description: |
        Pending only, oldest first (created_at with id as the tiebreak). Each row carries the submission plus the LIVE proposal joined from the entry - user edits flow through until the verdict. Submitters appear as opaque user ids. limit defaults to 200 (max 500); total_count reports the full pending count.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: One queue page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSubmissionsPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/InternalError'
  /admin/submissions/{submissionId}/verdict:
    post:
      operationId: submitVerdict
      summary: Resolve one pending submission (role admin)
      description: |
        action reject requires reason (the submitter sees it). action approve_existing requires product_id: the target is validated against enrichment and the submitter's entry adopts it (the product-backed creation snapshot, community facts filling what provider blocks do not supply), preserving every user-owned field. action approve_new requires product (the curated fields; the single edition field follows the entry idiom): enrichment mints a community product with the admin's own bearer, the minted id is recorded on the still-pending row, then adoption runs - a retry after a mid-way failure sees the recorded id and never mints twice. A row that is no longer pending answers 409 code submission_resolved. Errors: 404 code submission_not_found, unknown_product, or entry_not_found (the entry vanishes mid-race; cascade delete also removes the submission); 502 code enrichment_unavailable (retryable; the row stays pending).
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerdictRequest'
      responses:
        '200':
          description: The resolved submission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: No such submission, the adopt target does not exist, or the entry vanished mid-race (code submission_not_found, unknown_product, or entry_not_found)
        '409':
          $ref: '#/components/responses/Conflict'
          description: Another admin already resolved it (code submission_resolved)
        '502':
          $ref: '#/components/responses/UpstreamError'
        default:
          $ref: '#/components/responses/InternalError'
  /internal/resnapshot:
    post:
      operationId: internalResnapshot
      tags:
        - internal
      summary: Resnapshot - recompute every game-backed entry's product-derived snapshot fields
      description: |
        Maintenance operation; the gateway never routes it. Recomputes the region-picked release date, the localized presentation trio (name, transliteration, cover url), and the credit arrays (developers, publishers) for every game-backed entry from its product's current data. Guard: admin user or service token (tightened from any valid JWT). Idempotent and re-runnable; a row is written only when a recomputed field differs from what is stored.
      responses:
        '200':
          description: Sweep summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResnapshotResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/InternalError'
  /internal/normalize-platforms:
    post:
      operationId: internalNormalizePlatforms
      tags:
        - internal
      summary: Canonicalize free-text custom-entry platforms
      description: |
        Maintenance operation; the gateway never routes it. Matches every entry carrying a platform_name but no platform_igdb_id (case-insensitive, trimmed, exact-or-alias - never fuzzy) against the enrichment platform catalog and stamps the canonical igdb id and name. Guard: admin role or service token (the nightly job runs it; the mass write stays reviewable through its counts and logs). Idempotent and re-runnable; stamped rows leave the selection set.
      responses:
        '200':
          description: Sweep summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NormalizeResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/InternalError'
  /internal/normalize-regions:
    post:
      operationId: internalNormalizeRegions
      tags:
        - internal
      summary: Promote free-text entry regions into the known set
      description: |
        Maintenance operation; the gateway never routes it. Folds every entry region outside the known set (lowercase, trim) against the known values and the reviewed synonyms table - exact or synonym, never fuzzy. Promoted igdb-backed entries re-pick their release-date and localized display snapshots for the promoted region in the same write; enrichment outage skips the row for the next run. Guard: admin role or service token (the nightly job runs it ahead of the entry rematch, so a promoted region's pricing class corrects the same night). Idempotent and re-runnable; promoted rows leave the selection set.
      responses:
        '200':
          description: Sweep summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NormalizeResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/InternalError'
  /internal/rematch-entries:
    post:
      operationId: internalRematchEntries
      tags:
        - internal
      summary: Entry rematch - repoint auto entries onto region-correct listings
      description: |
        Maintenance operation; the gateway never routes it. Re-resolves auto-priced, auto-provenance game-backed entries grouped by (game, platform, region): unmatched or region-incompatible members are re-resolved with the entry region and the entries repointed to the returned member, snapshot fields re-derived. Guard: admin user or service token. Answers 202 and detaches (a day-one backfill outlives the HTTP write timeout at the provider's polite request rate); the counts land in the completion log and the rematch.* metrics, not the response. Idempotent and re-runnable; each repoint is logged (entry, from, to, region).
      responses:
        '202':
          description: Rematch started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RematchAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
          description: An entry rematch is already running (code rematch_in_progress)
        default:
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Invalid parameters or body
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing/invalid token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Unexpected server-side failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Insufficient role
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UpstreamError:
      description: The enrichment service could not be reached (code enrichment_unavailable)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found (code entry_not_found)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Name already taken (code tag_exists)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: A submission cap is exceeded (code too_many_pending_submissions or submission_rate_limited)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    EntryPlatform:
      description: |
        The entry's platform: a creation-time snapshot of the product's platform (both fields) on product-backed entries, or a user-supplied platform on custom entries - both fields when picked from the catalog or normalized by the admin lever, name-only for escape-hatch free text. Absent when neither exists.
      type: object
      required:
        - name
      properties:
        igdb_platform_id:
          type: integer
          format: int64
          description: Absent on name-only custom entries.
        name:
          type: string
    Entry:
      description: |
        One physical copy. On product-backed entries the catalog fields (item_type, display_name, platform, first_release_date, igdb_game_id) are immutable creation-time snapshots from the enrichment product and product_id remains the live join key for prices. A CUSTOM entry has no product_id: its display fields are user-owned and editable, platform carries the picked or normalized identity - name-only for escape-hatch free text - when supplied, and igdb_game_id is always absent. value_cents is composed at read time from the effective pricing product and the packaging-matched price field; (or, with pricing_mode custom, taken directly from custom_value_cents, packaging-independent); it is null when pricing_mode is disabled, the product is unmatched, no price exists for the packaging, or enrichment is temporarily unreachable.
      type: object
      required:
        - id
        - item_type
        - media_type
        - display_name
        - region
        - packaging
        - has_box
        - has_manual
        - currency
        - pricing_mode
        - status
        - pinned
        - source
        - tags
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
          description: Absent on custom entries.
        item_type:
          $ref: '#/components/schemas/ItemType'
        media_type:
          $ref: '#/components/schemas/MediaType'
        display_name:
          type: string
        platform:
          $ref: '#/components/schemas/EntryPlatform'
        first_release_date:
          type: string
          format: date
        cover_url:
          type: string
          description: |
            Cover art URL. For product-backed entries it is snapshotted from the product at creation (and refreshed on adoption). Custom entries may set their own (https, shape-validated). Absent on hardware and products without art (render a placeholder).
        localized_name:
          type: string
          description: Region-picked native-script title (server-derived from the entry's region; absent when the region has none).
        localized_name_translit:
          type: string
          description: Latin transliteration of localized_name's title (server-derived).
        localized_cover_url:
          type: string
          description: Region-picked box art URL (server-derived).
        developers:
          type: array
          items:
            type: string
          description: 'Developer company names snapshotted for the entry: IGDB credits where the product carries them, community curated lists as gap-fill, or the user''s own facts on a custom entry. Absent when no credits are known.'
        publishers:
          type: array
          items:
            type: string
          description: Publisher company names; same sourcing as developers.
        igdb_game_id:
          type: integer
          format: int64
          description: |
            The recommendation identity: snapshotted from the entry's own product, or from the proxy target on custom game entries (owning a reproduction of X means playing X).
        region:
          type: string
        edition:
          type: string
          description: |
            Per-copy variant note ("first print (glitched rev)", "black edition"): the idiom for variants of cataloged items is an entry on the base product with the variant recorded here.
        packaging:
          $ref: '#/components/schemas/Packaging'
        has_box:
          type: boolean
        has_manual:
          type: boolean
        box_condition:
          $ref: '#/components/schemas/ItemCondition'
        manual_condition:
          $ref: '#/components/schemas/ItemCondition'
        item_condition:
          $ref: '#/components/schemas/ItemCondition'
        price_paid_cents:
          type: integer
          format: int64
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        purchased_at:
          type: string
          format: date
        purchased_from:
          type: string
        pricing_mode:
          $ref: '#/components/schemas/PricingMode'
        pricing_product_id:
          type: string
          format: uuid
        custom_value_cents:
          type: integer
          format: int64
          description: |
            The user-set market value (USD cents). With pricing_mode custom it IS the entry's value; under any other mode it persists as "last custom price" memory.
        custom_value_set_at:
          type: string
          format: date-time
          description: |
            Server-managed: stamped when custom_value_cents is first set or changes value, untouched otherwise. Read-only.
        custom_value_entered_cents:
          type: integer
          format: int64
          description: |
            The custom price exactly as the user typed it, in custom_value_entered_currency minor units (major units x 100, including zero-decimal currencies). Display metadata only: no aggregation reads it; custom_value_cents remains the USD value used everywhere.
        custom_value_entered_currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: Currency of custom_value_entered_cents.
        status:
          $ref: '#/components/schemas/EntryStatus'
        rating:
          type: integer
          minimum: 1
          maximum: 10
        notes:
          type: string
        storage_location:
          type: string
        pinned:
          type: boolean
        backlog_rank:
          type: string
          description: Present exactly while status is backlog; server-generated.
        source:
          type: string
          enum:
            - manual
            - steam
            - psn
            - epic
        external_ref:
          type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagRef'
        value_cents:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        region_mismatch_ack_at:
          type: string
          format: date-time
          description: |
            Null until the owner dismisses the region-mismatch banner; cleared whenever region or product changes.
    Submission:
      description: |
        One catalog-submission lifecycle row for an entry. Rows persist as history (rejected and cancelled included; the rolling creation cap counts every attempt); deleting the entry removes them with it. product_id is the verdict's resolved product - recorded before adoption so an approve_new retry never mints twice.
      type: object
      required:
        - id
        - entry_id
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        entry_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/SubmissionStatus'
        reject_reason:
          type: string
        product_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        reviewed_at:
          type: string
          format: date-time
        resolution_ack_at:
          type: string
          format: date-time
          description: |
            When the submitter acknowledged an approved verdict (closed the approval banner). Absent until acknowledged.
    AdminSubmission:
      description: |
        One queue row: the submission plus the live proposal from the entry join (display_name, item_type, platform_name, region, edition, first_release_date pre-fill the curation form; entries carry no variant - the single edition field is the idiom).
      type: object
      required:
        - id
        - entry_id
        - user_id
        - status
        - display_name
        - item_type
        - region
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        entry_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/SubmissionStatus'
        display_name:
          type: string
        item_type:
          $ref: '#/components/schemas/ItemType'
        platform_name:
          type: string
        region:
          type: string
        edition:
          type: string
        first_release_date:
          type: string
          format: date
        developers:
          type: array
          items:
            type: string
          description: The entry's developer credit facts, live from the proposal join; prefill the curation form.
        publishers:
          type: array
          items:
            type: string
          description: The entry's publisher credit facts, live from the proposal join; prefill the curation form.
        cover_url:
          type: string
          description: The entry's cover URL, live from the proposal join; prefills the curation cover field.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AdminSubmissionsPage:
      type: object
      required:
        - submissions
        - total_count
      properties:
        submissions:
          type: array
          items:
            $ref: '#/components/schemas/AdminSubmission'
        total_count:
          type: integer
          format: int64
          description: Full pending count, beyond this page.
    CommunityProductSpec:
      description: |
        The curated fields for approve_new; mirrors the enrichment mint request (single edition field, no variant).
      type: object
      required:
        - type
        - name
      properties:
        type:
          $ref: '#/components/schemas/ItemType'
        name:
          type: string
          minLength: 1
          maxLength: 200
        platform_name:
          type: string
          maxLength: 100
        region:
          type: string
          maxLength: 32
          description: |
            Curated entry-vocabulary region fact; stored under the community facts block (community.region), not the product's top-level region field.
        edition:
          type: string
          maxLength: 128
          description: The entry idiom's single "Edition or variant" note.
        first_release_date:
          type: string
          format: date
        developers:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 120
          description: Curated developer company names, one per element.
        publishers:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 120
          description: Curated publisher company names, one per element.
        cover_url:
          type: string
          maxLength: 512
          pattern: ^https://
          description: Optional https cover image URL (validated by shape only, never fetched).
    VerdictRequest:
      description: |
        One admin verdict. approve_new requires product; approve_existing requires product_id; reject requires reason.
      type: object
      required:
        - action
      properties:
        action:
          type: string
          enum:
            - approve_new
            - approve_existing
            - reject
        product:
          $ref: '#/components/schemas/CommunityProductSpec'
        product_id:
          type: string
          format: uuid
        reason:
          type: string
          maxLength: 1000
    EntryCreate:
      description: |
        Product-backed: product_id comes from a prior enrichment resolve and the catalog fields are snapshotted server-side (display_name/item_type/platform_name/first_release_date must NOT be sent). Custom (no product_id): display_name and item_type are required, platform_name and first_release_date optional; pricing_mode defaults to disabled and must not be auto. media_type accepts only physical (the column already allows digital: the API widens when platform sync arrives). source is server-set manual. pricing_product_id is required when pricing_mode is proxy; box_condition requires has_box and manual_condition requires has_manual. custom_value_cents is required when pricing_mode is custom.
      type: object
      required:
        - region
        - packaging
      properties:
        product_id:
          type: string
          format: uuid
          description: Omit for a custom (off-catalog) entry.
        display_name:
          type: string
          maxLength: 200
          description: Custom entries only (required there).
        item_type:
          description: Custom entries only (required there).
          allOf:
            - $ref: '#/components/schemas/ItemType'
        platform_name:
          type: string
          maxLength: 100
          description: Custom entries only.
        platform_igdb_id:
          type: integer
          format: int64
          description: Custom entries only; the canonical platform id from the picker (surfaces the entry in the platform filter).
        cover_url:
          type: string
          maxLength: 512
          pattern: ^https://
          description: Custom entries only; an https cover image URL (validated by shape, never fetched).
        first_release_date:
          type: string
          format: date
          description: Custom entries only.
        developers:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 120
          description: 'Custom entries only: developer company names, one per element. Ignored on product-backed creation, where the snapshot derives credits from the product.'
        publishers:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 120
          description: Custom entries only; publisher company names, one per element.
        media_type:
          type: string
          enum:
            - physical
          default: physical
        region:
          type: string
          maxLength: 32
          description: 'Entry region. Known values ntsc_u, ntsc_j, pal, region_free, korea, brazil and china are first-class: labeled in the UI, filterable, normalize-lever promotion targets, with release-date chains, availability rows, and localized display snapshots per region (ntsc_u and region_free render the canonical presentation by design). korea, brazil and china have no PriceCharting axis, so they price from base listings as their deliberate proxy. Any other non-empty string is stored verbatim as a display fact and prices like ntsc_u until the value graduates to the known set.'
        edition:
          type: string
          maxLength: 200
          description: Per-copy variant note; the idiom for variants of cataloged items.
        packaging:
          $ref: '#/components/schemas/Packaging'
        has_box:
          type: boolean
          default: false
