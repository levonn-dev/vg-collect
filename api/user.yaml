openapi: 3.0.3
info:
  title: vg-collect user service
  version: 0.1.0
security:
  - bearerAuth: []
paths:
  /internal/users/upsert:
    post:
      operationId: upsertUser
      summary: Create-or-update a user at login time (auth service only; role `service`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertUserRequest"
      responses:
        "200":
          description: Upserted user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /users/{userId}:
    get:
      operationId: getUser
      summary: Fetch a user (self, or role `service`/`admin`)
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    patch:
      operationId: updateUser
      summary: Self-service profile update (display name, avatar URL)
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Validation failure (code invalid_body; detail names the field)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: deleteUser
      summary: Delete a user account (self only); idempotent
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted (or already gone)
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Unauthorized:
      description: Missing/invalid token
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Insufficient role
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    User:
      type: object
      required: [id, email, display_name, roles, preferred_currency, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string }
        avatar_url: { type: string }
        roles:
          type: array
          items: { type: string, enum: [user, admin] }
        preferred_currency:
          type: string
          description: >
            The display currency the SPA converts market values into.
            Defaulted from locale_hint at account creation, USD when
            no hint maps.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UpsertUserRequest:
      type: object
      required: [email, display_name]
      properties:
        email: { type: string }
        display_name: { type: string }
        avatar_url: { type: string }
        locale_hint:
          type: string
          maxLength: 64
          description: >
            BCP 47 language tag from the login request's
            Accept-Language header. Applied only when this upsert
            creates the account: it seeds preferred_currency and never
            touches an existing user.
    UpdateUserRequest:
      type: object
      description: Absent fields keep their value; an empty avatar_url clears it.
      properties:
        display_name: { type: string }
        avatar_url: { type: string }
        preferred_currency:
          type: string
          pattern: "^[A-Z]{3}$"
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
