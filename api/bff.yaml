          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: One page of the shelf's entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedEntryList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: Unknown or private (deliberately indistinguishable; code shelf_not_found)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/shelves/{shelfId}/comments:
    get:
      operationId: listShelfComments
      summary: A shelf's live comments, newest first, keyset-paged (composed with batched author cards)
      description: >
        Applies the effective-visibility rule, then composes social's
        page with a batched author ProfileCard per comment (mirrors
        the feed's actor hydration). A card-fetch failure fails open:
        the page still serves, just without any author. Anything
        other than social's 200 (its own 400 on a malformed cursor
        included) still relays verbatim, unchanged from before.
      parameters:
        - name: shelfId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommentList" }
        "400":
          description: Malformed cursor (code invalid_param)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: Unknown or private (deliberately indistinguishable; code shelf_not_found)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
    post:
      operationId: createShelfComment
      summary: Comment on a shelf (proxied)
      description: Applies the effective-visibility rule before relaying the social service verbatim.
      parameters:
        - name: shelfId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCommentRequest" }
      responses:
        "201":
          description: The comment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400":
          description: Invalid body (code invalid_body)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: Unknown or private (deliberately indistinguishable; code shelf_not_found)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          description: Comment cap reached - tombstones count (code cap_exceeded)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/comments/{commentId}:
    delete:
      operationId: deleteComment
      summary: Delete a comment; author tombstones body-NULL, shelf owner tombstones body-retained (proxied)
      description: >
        Relayed verbatim; the bff does not resolve the shelf for this
        call (social already knows the comment row's shelf and owner
        and authorizes by row).
      parameters:
        - name: commentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Tombstoned
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Caller is neither author nor shelf owner (code forbidden)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: Unknown or already tombstoned (code comment_not_found)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/social/follows/{userId}:
    put:
      operationId: follow
      summary: Follow a user (idempotent) (proxied)
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Following (already or newly)
        "400":
          description: Self-follow (code self_follow)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: Unknown or private (deliberately indistinguishable; code profile_not_found)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          description: Follow cap reached (code cap_exceeded)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
    delete:
      operationId: unfollow
      summary: Unfollow a user (idempotent) (proxied)
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Not following (already or newly)
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/social/likes/{shelfId}:
    put:
      operationId: like
      summary: Like a shelf (idempotent) (proxied)
      parameters:
        - name: shelfId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Liked (already or newly)
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: Unknown or private (deliberately indistinguishable; code shelf_not_found)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          description: Like cap reached (code cap_exceeded)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
    delete:
      operationId: unlike
      summary: Remove a like (idempotent) (proxied)
      parameters:
        - name: shelfId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Not liked (already or newly)
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/search/users:
    get:
      operationId: searchUsers
      summary: Substring search over listed profiles' handles (proxied)
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "200":
          description: Up to 20 listed matches
          content:
            application/json:
              schema:
                type: object
                required: [profiles]
                properties:
                  profiles:
                    type: array
                    items: { $ref: "#/components/schemas/ProfileCard" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/feed:
    get:
      operationId: getFeed
      summary: The caller's two-tab activity feed (fill loop, hydrated and gated)
      description: >
        Runs a fill loop against the social service: fetch a raw page,
        hydrate it (actor cards, shelf cards, comment excerpts), gate
        it by the tab's visibility rule, and repeat until limit
        survivors accumulate or the raw stream exhausts, capped at
        feedFillRounds rounds (a rare shortfall yields a slightly
        short page). Actions are signed, objects are gated: actor
        cards attach at any visibility; on tab=following a row
        naming a shelf survives only when the shelf is listed and its
        owner is listed, and a followed_user row survives only when
        the followee is listed; tab=you shows every row (the objects
        are the caller's own shelves). next_cursor is the raw cursor
        of the last consumed row; absent when the raw stream is
        exhausted with nothing left to resume from.
      parameters:
        - name: tab
          in: query
          required: true
          schema: { type: string, enum: [following, you] }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One filled page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedPage" }
        "400":
          description: Invalid tab or malformed cursor (code invalid_param)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/explore:
    get:
      operationId: getExplore
      summary: Browse shared shelves - newest-published or top-liked, listed-only
      description: >
        recent pages collection's listed shelves directly (no owner
        filter), gates each page's owner for listed-ness at the bff,
        and fills short pages by re-paging collection, up to a fixed
        round cap; next_offset carries the raw collection-space
        resume position and is present only while more rows remain -
        top is the fixed all-time like-count leaderboard (leaderboard
        order preserved, no deep paging, no next_offset), dropping
        anything that is not effectively listed by the time it is
        read. limit and offset apply to recent only; top always
        answers its own fixed-size leaderboard.
      parameters:
        - name: sort
          in: query
          required: true
          schema: { type: string, enum: [recent, top] }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: One page of shelf cards
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExplorePage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "502": { $ref: "#/components/responses/UpstreamError" }
components:
  responses:
    Unauthenticated:
      description: No valid session (cookie missing, malformed, expired, revoked, or denylisted)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    OriginForbidden:
      description: Mutating request from a foreign origin (code origin_forbidden)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UpstreamError:
      description: A downstream service failed (code upstream_error)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    FXRates:
      type: object
      required: [base, date, rates]
      properties:
        base:
          type: string
          description: Always USD.
        date:
          type: string
          description: Upstream snapshot date (YYYY-MM-DD).
        rates:
          type: object
          description: Target-units-per-USD by ISO 4217 code; USD omitted.
          additionalProperties: { type: number, format: double }
    Providers:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          description: "Subset of: google, twitch, dev"
          items: { type: string }
    Me:
      description: >
        Browser-facing projection of the user service's User. Timestamps
        are intentionally omitted; add fields only when the SPA has a
        concrete use for them.
      type: object
      required: [id, email, handle, roles, preferred_currency, profile_visibility, landing_page]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        handle: { type: string }
        avatar_url: { type: string }
        roles:
          type: array
          items: { type: string }
        preferred_currency:
          type: string
          description: Display currency for market values; USD until set.
        profile_visibility:
          type: string
          enum: [private, unlisted, listed]
        landing_page:
          type: string
          enum: [collection, feed, explore]
          description: Where the app opens after sign-in.
    UpdateMeRequest:
      type: object
      description: Absent fields keep their value; an empty avatar_url clears it.
      properties:
        handle: { type: string }
        avatar_url: { type: string }
        preferred_currency: { type: string, pattern: "^[A-Z]{3}$" }
        profile_visibility:
          type: string
          enum: [private, unlisted, listed]
        landing_page:
          type: string
          enum: [collection, feed, explore]
    Identity:
      type: object
      required: [id, provider, created_at]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        email:
          type: string
          description: Informational; the email this login last asserted.
        created_at: { type: string, format: date-time }
    Identities:
      type: object
      required: [identities]
      properties:
        identities:
          type: array
          items: { $ref: "#/components/schemas/Identity" }
    # The catalog schemas below mirror the enrichment service contract
    # verbatim: these routes relay the upstream body without reshaping,
    # so the browser types must describe exactly what enrichment emits.
    PlatformRef:
      type: object
      required: [igdb_platform_id, name]
      properties:
        igdb_platform_id: { type: integer, format: int64 }
        name: { type: string }
        logo_url:
          type: string
          description: IGDB platform logo; the display fallback for products without cover art.
    CatalogPlatform:
      description: One platform-catalog row with its known aliases.
      type: object
      required: [igdb_id, name, aliases]
      properties:
        igdb_id: { type: integer, format: int64 }
        name: { type: string }
        aliases:
          description: Alternate spellings and abbreviations (compare case-insensitively).
          type: array
          items: { type: string }
    PlatformCatalog:
      type: object
      required: [platforms]
      properties:
        platforms:
          type: array
          items: { $ref: "#/components/schemas/CatalogPlatform" }
    SearchResult:
      description: >
        Flat result with a type discriminator. Game results carry the
        igdb_* fields; hardware results carry the pc_* fields plus the
        PriceCharting category (Systems, Controllers, Accessories).
        pc_listing results carry the pc_* fields, the PriceCharting
        category (empty when the provider lists none), and the standard
        per-listing loose/cib/new prices so variant prints are tellable
        apart.
      type: object
      required: [type, name]
      properties:
        type: { type: string, enum: [game, hardware, pc_listing] }
        name: { type: string }
        igdb_game_id: { type: integer, format: int64 }
        platforms:
          type: array
          items: { $ref: "#/components/schemas/PlatformRef" }
        first_release_date: { type: string, format: date }
        cover_url: { type: string }
        pc_product_id: { type: integer, format: int64 }
        console_name: { type: string }
        category: { type: string }
        loose_cents: { type: integer, format: int64 }
        cib_cents: { type: integer, format: int64 }
        new_cents: { type: integer, format: int64 }
        origin:
          type: string
          enum: [community]
          description: >
            Marks an interleaved community result (admin-minted,
            anchor-less); absent on provider results. Community results
            carry product_id + item_type + platform_name for the pick
            and community.cover_url as cover_url. They are scored against
            the query by name similarity and merged into results by
            descending score (a provider result precedes a community
            result of equal score), capped at 10, for game and hardware
            searches only (never pc_listing). The provider cache stores
            provider results only - community items attach fresh on every
            search.
        product_id: { type: string, format: uuid }
        item_type: { type: string, enum: [game, console, accessory] }
        platform_name: { type: string }
    SearchResults:
      type: object
      required: [degraded, results]
      properties:
        degraded:
          type: boolean
          description: True when the provider was unreachable and the local catalog answered instead.
        results:
          type: array
          items: { $ref: "#/components/schemas/SearchResult" }
    IgdbMeta:
      description: Projection of the raw IGDB payload held in igdb_raw; refreshed on its own cadence.
      type: object
      required: [game_id, name, genres, themes, franchises, similar_games, companies, fetched_at]
      properties:
        game_id: { type: integer, format: int64 }
        name: { type: string }
        cover_url: { type: string }
        genres:
          type: array
          items: { type: string }
        themes:
          type: array
          items: { type: string }
        franchises:
          type: array
          items: { type: string }
        similar_games:
          type: array
          items: { type: integer, format: int64 }
        companies:
          type: array
          items: { $ref: "#/components/schemas/CompanyCredit" }
        first_release_date:
          type: string
          format: date
          description: >
            Earliest date for the product's platform; the game-level
            first release when IGDB lists no dated rows for the
            platform.
        release_dates:
          description: >
            Per-region release dates for the product's platform, the
            earliest concrete date per region. Region values are
            canonical IGDB names (europe, north_america, australia,
            new_zealand, japan, china, asia, worldwide, korea, brazil).
            JP twin platforms fold into their sibling (SNES/Super Famicom,
            NES/Famicom).
          type: array
          items: { $ref: "#/components/schemas/ReleaseDate" }
        fetched_at: { type: string, format: date-time }
    CompanyCredit:
      type: object
      required: [name, developer, publisher]
      properties:
        name: { type: string }
        developer: { type: boolean }
        publisher: { type: boolean }
    ReleaseDate:
      type: object
      required: [region, date]
      properties:
        region: { type: string }
        date: { type: string, format: date }
    PricechartingMeta:
      description: >
        The PriceCharting mapping and current prices; refreshed daily.
        Absent from a product when no candidate cleared the match
        confidence threshold (no guessing) and the mapping has not been
        corrected by an admin.
      type: object
      required: [pc_product_id, pc_name, console_name, match_confidence, verified, as_of]
      properties:
        pc_product_id: { type: integer, format: int64 }
        pc_name: { type: string }
        console_name: { type: string }
        match_confidence: { type: number, format: double }
        verified: { type: boolean }
        loose_cents: { type: integer, format: int64 }
        cib_cents: { type: integer, format: int64 }
        new_cents: { type: integer, format: int64 }
        as_of: { type: string, format: date-time }
    Product:
      type: object
      required: [id, type, name, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [game, console, accessory, pc_listing] }
        name: { type: string }
        platform: { $ref: "#/components/schemas/PlatformRef" }
        region: { type: string }
        edition: { type: string }
        variant: { type: string }
        igdb: { $ref: "#/components/schemas/IgdbMeta" }
        pricecharting: { $ref: "#/components/schemas/PricechartingMeta" }
        match_hold:
          type: boolean
          description: >
            Present true when an admin clear holds this product out of
            the nightly re-match walk.
        origin:
          type: string
          enum: [community]
          description: >
            Emitted only for admin-minted community products (absent
            means provider-identified). Community products live
            outside the provider identity indexes; their curated name
            is their identity.
        community: { $ref: "#/components/schemas/CommunityMeta" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CommunityMeta:
      description: >
        Facts curated at community mint time; retained after promotion
        as gap-fill (provider blocks win per-field where present).
      type: object
      properties:
        platform_name: { type: string }
        first_release_date: { type: string, format: date }
        cover_url:
          type: string
          description: >
            User-supplied cover image URL (https, never fetched
            server-side; the client renders it with a broken-image
            fallback). Served as the product cover when no provider
            cover is present; retained after promotion as gap-fill.
    CommunityProductCreate:
      type: object
      required: [type, name]
      properties:
        type: { type: string, enum: [game, console, accessory] }
        name: { type: string, minLength: 1, maxLength: 200 }
        platform_name: { type: string, maxLength: 100 }
        region: { type: string, maxLength: 32 }
        edition:
          type: string
          maxLength: 128
          description: The entry idiom's single "Edition or variant" note.
        first_release_date: { type: string, format: date }
        cover_url:
          type: string
          maxLength: 512
          description: Optional https cover image URL (validated by shape only, never fetched).
    PromoteRequest:
      description: >
        Provider identity for an in-place promotion. type game
        products require igdb_game_id + platform_igdb_id and accept
        an optional pc_product_id (the listing can also arrive later
        via the nightly walk or the mapping fix, once provider);
        console and accessory products require pc_product_id. The
        identity the product re-enters the index with completes with
        the doc's stored region/edition/variant.
      type: object
      properties:
        igdb_game_id: { type: integer, format: int64 }
        platform_igdb_id: { type: integer, format: int64 }
        pc_product_id: { type: integer, format: int64 }
    PromoteCandidate:
      type: object
      required: [provider, provider_id, name, score, found_at]
      properties:
        provider: { type: string, enum: [igdb, pricecharting] }
        provider_id: { type: integer, format: int64 }
        name: { type: string }
        score: { type: number, format: double }
        found_at: { type: string, format: date-time }
    PromoteCandidatesPage:
      type: object
      required: [products, total_count]
      properties:
        products:
          type: array
          items: { $ref: "#/components/schemas/PromoteCandidateProduct" }
        total_count:
          type: integer
          format: int64
          description: Full count of flagged community products.
    PromoteCandidateProduct:
      type: object
      required: [product, candidates]
      properties:
        product: { $ref: "#/components/schemas/Product" }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/PromoteCandidate" }
    DismissCandidateRequest:
      type: object
      required: [provider, provider_id]
      properties:
        provider: { type: string, enum: [igdb, pricecharting] }
        provider_id: { type: integer, format: int64 }
    ResolveRequest:
      description: >
        type game requires igdb_game_id + platform_igdb_id (the
        platform must be one the game released on). Game identity is
        listing-keyed - (game, platform, PriceCharting listing) - so
        region/edition/variant on a game resolve are ignored
        (entry-level facts, like pc_listing). Without pc_product_id
        the resolve auto-matches by the plain game name through the
        shared listing-search cache and lands on the winning listing's
        product; below the confidence threshold, or with the provider
        down, it lands on the game+platform's single unmatched product
        instead - never guessed. Optional match_hint (game only,
        ignored elsewhere) reweights the scoring toward variant text
        without changing the search query; a hint nothing matches
        makes the resolve conservative (unmatched).
        With pc_product_id (a manual match: the exact listing the user
        chose) auto-match is skipped and the resolve finds or mints
        the product carrying that listing (match_confidence 1.0,
        verified false); unknown id answers 404 unknown_pc_product,
        provider failure 502 upstream_unavailable. Resolves never
        touch an existing product's mapping; corrections stay on the
        admin mapping endpoint.
        console/accessory require pc_product_id;
        region/edition/variant distinguish physical variants and are
        part of hardware identity. type pc_listing requires
        pc_product_id and mints a price-anchor product for that exact
        listing; region/edition/variant are ignored (the listing IS
        the exact variant).
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [game, console, accessory, pc_listing] }
        igdb_game_id: { type: integer, format: int64 }
        platform_igdb_id: { type: integer, format: int64 }
        pc_product_id: { type: integer, format: int64 }
        match_hint: { type: string, maxLength: 128 }
        region: { type: string, maxLength: 32 }
        edition: { type: string, maxLength: 128 }
        variant: { type: string, maxLength: 128 }
    Recommendation:
      type: object
      required: [igdb_game_id, name, genres, score]
      properties:
        igdb_game_id: { type: integer, format: int64 }
        name: { type: string }
        cover_url: { type: string }
        genres:
          type: array
          items: { type: string }
        first_release_date: { type: string, format: date }
        score: { type: number, format: double }
    ScoreResponse:
      type: object
      required: [degraded, recommendations]
      properties:
        degraded:
          type: boolean
          description: True when candidate metadata fetches failed and some candidates were skipped.
        recommendations:
          type: array
          items: { $ref: "#/components/schemas/Recommendation" }
    UnmatchedProductsPage:
      type: object
      required: [products, total_count]
      properties:
        products:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        total_count:
          type: integer
          format: int64
          description: Full count of unmatched products, beyond this page.
    CommunityProductsPage:
      type: object
      required: [products, total_count]
      properties:
        products:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        total_count:
          type: integer
          format: int64
          description: Full count of community products, beyond this page.
    MappingRequest:
      type: object
      required: [pc_product_id]
      properties:
        pc_product_id:
          type: integer
          format: int64
          nullable: true
          description: Null clears the mapping (the product becomes unmatched and held).
    RefreshAccepted:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [started] }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
    # The collection schemas below mirror the collection service
    # contract verbatim: these routes relay the upstream body without
    # reshaping, so the browser types must describe exactly what the
    # collection service emits.
    EntryPlatform:
      description: >
        The entry's platform: a creation-time snapshot of the product's
        platform (both fields) on product-backed entries, or a
        user-supplied platform on custom entries - both fields when
        picked from the catalog or normalized by the admin lever,
        name-only for escape-hatch free text. Absent when neither
        exists.
      type: object
      required: [name]
      properties:
        igdb_platform_id:
          type: integer
          format: int64
          description: Absent on name-only custom entries.
        name: { type: string }
    Entry:
      description: >
        One physical copy. On product-backed entries the catalog
        fields (item_type, display_name, platform, first_release_date,
        igdb_game_id) are immutable creation-time snapshots from the
        enrichment product and product_id remains the live join key
        for prices. A CUSTOM entry has no product_id: its display
        fields are user-owned and editable, platform carries the
        picked or normalized identity - name-only for escape-hatch
        free text - when supplied, and igdb_game_id is always absent.
        value_cents is composed at read time from the
        effective pricing product and the packaging-matched price
        field; (or, with pricing_mode custom, taken directly from
        custom_value_cents, packaging-independent); it is null when
        pricing_mode is disabled, the product is unmatched, no price
        exists for the packaging, or enrichment is temporarily
        unreachable.
      type: object
      required: [id, item_type, media_type, display_name, region,
                 packaging, has_box, has_manual, currency, pricing_mode, status,
                 pinned, source, tags, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        product_id:
          type: string
          format: uuid
          description: Absent on custom entries.
        item_type: { type: string, enum: [game, console, accessory] }
        media_type: { type: string, enum: [physical, digital] }
        display_name: { type: string }
        platform: { $ref: "#/components/schemas/EntryPlatform" }
        first_release_date: { type: string, format: date }
        cover_url:
          type: string
          description: >
            Cover art URL. For product-backed entries it is snapshotted
            from the product at creation (and refreshed on adoption).
            Custom entries may set their own (https, shape-validated).
            Absent on hardware and products without art (render a
            placeholder).
        igdb_game_id:
          type: integer
          format: int64
          description: >
            The recommendation identity: snapshotted from the entry's
            own product, or from the proxy target on custom game
            entries (owning a reproduction of X means playing X).
        region: { type: string, enum: [ntsc_u, ntsc_j, pal, region_free] }
        edition:
          type: string
          description: >
            Per-copy variant note ("first print (glitched rev)",
            "black edition"): the idiom for variants of cataloged
            items is an entry on the base product with the variant
            recorded here.
        packaging: { type: string, enum: [sealed, cib, loose] }
        has_box: { type: boolean }
        has_manual: { type: boolean }
        box_condition: { type: string, enum: [mint, near_mint, very_good, good, acceptable, poor] }
        manual_condition: { type: string, enum: [mint, near_mint, very_good, good, acceptable, poor] }
        item_condition: { type: string, enum: [mint, near_mint, very_good, good, acceptable, poor] }
        price_paid_cents: { type: integer, format: int64 }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        purchased_at: { type: string, format: date }
        purchased_from: { type: string }
        pricing_mode: { type: string, enum: [auto, proxy, custom, disabled] }
        pricing_product_id: { type: string, format: uuid }
        custom_value_cents:
          type: integer
          format: int64
          description: >
            The user-set market value (USD cents). With
            pricing_mode custom it IS the entry's value; under any
            other mode it persists as "last custom price" memory.
        custom_value_set_at:
          type: string
          format: date-time
          description: >
            Server-managed: stamped when custom_value_cents is first
            set or changes value, untouched otherwise. Read-only.
        custom_value_entered_cents:
          type: integer
          format: int64
          description: >
            The custom price exactly as the user typed it, in
            custom_value_entered_currency minor units (major units x
            100, including zero-decimal currencies). Display metadata
            only: no aggregation reads it; custom_value_cents remains
            the USD value used everywhere.
        custom_value_entered_currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: Currency of custom_value_entered_cents.
        status: { type: string, enum: [backlog, playing, beaten, completed, dropped, shelved] }
        rating: { type: integer, minimum: 1, maximum: 10 }
        notes: { type: string }
        storage_location: { type: string }
        pinned: { type: boolean }
        backlog_rank:
          type: string
          description: Present exactly while status is backlog; server-generated.
        source: { type: string, enum: [manual, steam, psn, epic] }
        external_ref: { type: string }
        tags:
          type: array
          items: { $ref: "#/components/schemas/TagRef" }
        value_cents: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Submission:
      description: >
        One catalog-submission lifecycle row for an entry. Rows
        persist as history (rejected and cancelled included; the
        rolling creation cap counts every attempt); deleting the entry
        removes them with it. product_id is the verdict's resolved
        product - recorded before adoption so an approve_new retry
        never mints twice.
      type: object
      required: [id, entry_id, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        entry_id: { type: string, format: uuid }
        status: { type: string, enum: [pending, approved, rejected, cancelled] }
        reject_reason: { type: string }
        product_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        reviewed_at: { type: string, format: date-time }
        resolution_ack_at:
          type: string
          format: date-time
          description: >
            When the submitter acknowledged an approved verdict (closed
            the approval banner). Absent until acknowledged.
    AdminSubmission:
      description: >
        One queue row: the submission plus the live proposal from the
        entry join (display_name, item_type, platform_name, region,
        edition, first_release_date pre-fill the curation form;
        entries carry no variant - the single edition field is the
        idiom).
      type: object
      required: [id, entry_id, user_id, status, display_name, item_type, region, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        entry_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        status: { type: string, enum: [pending, approved, rejected, cancelled] }
        display_name: { type: string }
        item_type: { type: string, enum: [game, console, accessory] }
        platform_name: { type: string }
        region: { type: string, enum: [ntsc_u, ntsc_j, pal, region_free] }
        edition: { type: string }
        first_release_date: { type: string, format: date }
        cover_url:
          type: string
          description: The entry's cover URL, live from the proposal join; prefills the curation cover field.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AdminSubmissionsPage:
      type: object
      required: [submissions, total_count]
      properties:
        submissions:
          type: array
          items: { $ref: "#/components/schemas/AdminSubmission" }
        total_count:
          type: integer
          format: int64
          description: Full pending count, beyond this page.
    CommunityProductSpec:
      description: >
        The curated fields for approve_new; mirrors the enrichment
        mint request (single edition field, no variant).
      type: object
      required: [type, name]
      properties:
        type: { type: string, enum: [game, console, accessory] }
        name: { type: string, minLength: 1, maxLength: 200 }
        platform_name: { type: string, maxLength: 100 }
        region: { type: string, maxLength: 32 }
        edition: { type: string, maxLength: 128 }
        first_release_date: { type: string, format: date }
        cover_url:
          type: string
          maxLength: 512
          description: Optional https cover image URL for the minted community product.
    VerdictRequest:
      description: >
        One admin verdict. approve_new requires product;
        approve_existing requires product_id; reject requires reason.
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [approve_new, approve_existing, reject] }
        product: { $ref: "#/components/schemas/CommunityProductSpec" }
        product_id: { type: string, format: uuid }
        reason: { type: string, maxLength: 1000 }
    EntryCreate:
      description: >
        Product-backed: product_id comes from a prior enrichment
        resolve and the catalog fields are snapshotted server-side
        (display_name/item_type/platform_name/first_release_date must
        NOT be sent). Custom (no product_id): display_name and
        item_type are required, platform_name and first_release_date
        optional; pricing_mode defaults to disabled and must not be
        auto. media_type accepts only physical (the column already
        allows digital: the API widens when platform sync arrives).
        source is server-set manual. pricing_product_id is required
        when pricing_mode is proxy; box_condition requires has_box and
        manual_condition requires has_manual. custom_value_cents is
        required when pricing_mode is custom.
      type: object
      required: [region, packaging]
      properties:
        product_id:
          type: string
          format: uuid
          description: Omit for a custom (off-catalog) entry.
        display_name:
          type: string
          maxLength: 200
          description: Custom entries only (required there).
        item_type:
          type: string
          enum: [game, console, accessory]
          description: Custom entries only (required there).
        platform_name:
          type: string
          maxLength: 100
          description: Custom entries only.
        platform_igdb_id:
          type: integer
          format: int64
          description: Custom entries only; the canonical platform id from the picker (surfaces the entry in the platform filter).
        cover_url:
          type: string
          maxLength: 512
          description: Custom entries only; an https cover image URL (validated by shape, never fetched).
        first_release_date:
          type: string
          format: date
          description: Custom entries only.
        media_type: { type: string, enum: [physical], default: physical }
        region: { type: string, enum: [ntsc_u, ntsc_j, pal, region_free] }
        edition:
          type: string
          maxLength: 200
          description: Per-copy variant note; the idiom for variants of cataloged items.
        packaging: { type: string, enum: [sealed, cib, loose] }
        has_box: { type: boolean, default: false }
        has_manual: { type: boolean, default: false }
        box_condition: { type: string, enum: [mint, near_mint, very_good, good, acceptable, poor] }
        manual_condition: { type: string, enum: [mint, near_mint, very_good, good, acceptable, poor] }
        item_condition: { type: string, enum: [mint, near_mint, very_good, good, acceptable, poor] }
        price_paid_cents: { type: integer, format: int64, minimum: 0 }
        currency: { type: string, pattern: "^[A-Z]{3}$", default: USD }
        purchased_at: { type: string, format: date }
        purchased_from: { type: string, maxLength: 200 }
        pricing_mode: { type: string, enum: [auto, proxy, custom, disabled], default: auto }
        pricing_product_id: { type: string, format: uuid }
        custom_value_cents: { type: integer, format: int64, minimum: 0, maximum: 1000000000 }
        custom_value_entered_cents: { type: integer, format: int64, minimum: 0, maximum: 1000000000 }
        custom_value_entered_currency: { type: string, pattern: "^[A-Z]{3}$" }
        status:
          type: string
          enum: [backlog, playing, beaten, completed, dropped, shelved]
          default: backlog
        rating: { type: integer, minimum: 1, maximum: 10 }
        notes: { type: string, maxLength: 10000 }
        storage_location: { type: string, maxLength: 200 }
        pinned: { type: boolean, default: false }
        tag_ids:
          type: array
          maxItems: 50
          items: { type: string, format: uuid }
    EntryUpdate:
      description: >
        Full replacement of the mutable state; an absent optional field
        is cleared (the edit form holds the whole entry). media_type
        and custom-ness are immutable. product_id accepts one narrow
        change - re-matching an auto-priced entry off an unmatched
        game product onto a product of the same game and platform
        (see the field description); anything else answers 400 code
        invalid_product_change. On custom entries
        display_name is required and platform_name/first_release_date
        replace like any optional field; on product-backed entries all
        three are rejected. tag_ids replaces the tag set; absent means
        no tags. custom_value_cents is required when pricing_mode is
        custom.
      type: object
      required: [region, packaging, pricing_mode, status, pinned]
      properties:
        display_name:
          type: string
          maxLength: 200
          description: Custom entries only (required there).
        platform_name:
          type: string
          maxLength: 100
          description: Custom entries only.
        platform_igdb_id:
          type: integer
          format: int64
          description: Custom entries only; the canonical platform id from the picker.
        cover_url:
          type: string
          maxLength: 512
          description: Custom entries only; an https cover image URL (validated by shape, never fetched).
        first_release_date:
          type: string
          format: date
          description: Custom entries only.
        product_id:
          type: string
          format: uuid
          description: >
            Narrow re-match. Accepted only when the entry is
            product-backed with pricing_mode auto, its current product
            is a game with no price mapping, and the new product is a
            game of the same family (same igdb game and platform);
            the same id as the entry already has is a no-op. Anything
            else answers 400 code invalid_product_change; enrichment
            unreachable answers 502 code enrichment_unavailable and
            leaves the entry unchanged. Snapshotted display fields
            stay as they are.
        region: { type: string, enum: [ntsc_u, ntsc_j, pal, region_free] }
        edition:
          type: string
          maxLength: 200
          description: Per-copy variant note; the idiom for variants of cataloged items.
        packaging: { type: string, enum: [sealed, cib, loose] }
        has_box: { type: boolean, default: false }
        has_manual: { type: boolean, default: false }
        box_condition: { type: string, enum: [mint, near_mint, very_good, good, acceptable, poor] }
        manual_condition: { type: string, enum: [mint, near_mint, very_good, good, acceptable, poor] }
        item_condition: { type: string, enum: [mint, near_mint, very_good, good, acceptable, poor] }
        price_paid_cents: { type: integer, format: int64, minimum: 0 }
        currency: { type: string, pattern: "^[A-Z]{3}$", default: USD }
        purchased_at: { type: string, format: date }
        purchased_from: { type: string, maxLength: 200 }
        pricing_mode: { type: string, enum: [auto, proxy, custom, disabled] }
        pricing_product_id: { type: string, format: uuid }
        custom_value_cents: { type: integer, format: int64, minimum: 0, maximum: 1000000000 }
        custom_value_entered_cents: { type: integer, format: int64, minimum: 0, maximum: 1000000000 }
        custom_value_entered_currency: { type: string, pattern: "^[A-Z]{3}$" }
        status: { type: string, enum: [backlog, playing, beaten, completed, dropped, shelved] }
        rating: { type: integer, minimum: 1, maximum: 10 }
        notes: { type: string, maxLength: 10000 }
        storage_location: { type: string, maxLength: 200 }
        pinned: { type: boolean }
        tag_ids:
          type: array
          maxItems: 50
          items: { type: string, format: uuid }
    EntryList:
      description: >
        One page of the sorted, filtered sequence. Exactly one of
        entries/groups is present (groups when group_by was requested,
        partitioning this page only).
      type: object
      required: [pricing_available, total_count]
      properties:
        pricing_available:
          type: boolean
          description: False when enrichment was unreachable; every value_cents is null.
        total_count:
          type: integer
          description: Size of the full filtered set, before pagination.
        entries:
          type: array
          items: { $ref: "#/components/schemas/Entry" }
        groups:
          type: array
          items: { $ref: "#/components/schemas/EntryGroup" }
    EntryGroup:
      type: object
      required: [key, label, entries]
      properties:
        key: { type: string }
        label: { type: string }
        entries:
          type: array
          items: { $ref: "#/components/schemas/Entry" }
    BulkUpdateRequest:
      description: >
        Delta applied across the caller's own entries among entry_ids
        (foreign or unknown ids are silently not counted, same
        ownership-filtering posture as tag attachment). At least one
        of add_tag_ids / remove_tag_ids / status / storage_location
        must be present, else 400. storage_location's clearing rule is
        the OPPOSITE of the full-replacement update's: here an ABSENT
        storage_location leaves the field untouched, and an explicit
        empty string clears it.
      type: object
      required: [entry_ids]
      properties:
        entry_ids:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string, format: uuid }
        add_tag_ids:
          type: array
          maxItems: 50
          items: { type: string, format: uuid }
        remove_tag_ids:
          type: array
          maxItems: 50
          items: { type: string, format: uuid }
        status: { type: string, enum: [backlog, playing, beaten, completed, dropped, shelved] }
        storage_location:
          type: string
          maxLength: 200
          description: Empty string clears the field; an absent field leaves it untouched (see the operation description).
    BulkUpdateResult:
      type: object
      required: [updated_count]
      properties:
        updated_count:
          type: integer
          description: Count of the caller's own entries among entry_ids, whether or not any targeted field actually changed.
    ReorderRequest:
      description: Neighbor entry ids around the drop slot; null marks a list edge. Both null is invalid.
      type: object
      properties:
        after_id: { type: string, format: uuid, nullable: true }
        before_id: { type: string, format: uuid, nullable: true }
    TagRef:
      description: A tag as embedded on an entry (no usage count).
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    Tag:
      type: object
      required: [id, name, entry_count]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        entry_count: { type: integer }
    TagCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
    SavedView:
      type: object
      required: [id, name, slug, visibility, params, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug:
          type: string
          description: URL slug derived from the name (underscore transform); unique per user on its folded key.
        visibility:
          type: string
          enum: [private, unlisted, listed]
        published_at:
          type: string
          format: date-time
          description: Stamped on each transition into listed.
        params:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ViewCreate:
      type: object
      required: [name, params]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        params:
          type: object
          additionalProperties: true
          description: Opaque frontend view state; at most 8192 marshaled bytes.
        visibility:
          type: string
          enum: [private, unlisted, listed]
          default: private
    PlatformCount:
      type: object
      required: [name, count]
      properties:
        name: { type: string }
        count: { type: integer }
    CurrencySpend:
      type: object
      required: [currency, total_cents]
      properties:
        currency: { type: string }
        total_cents: { type: integer, format: int64 }
    DashboardPricing:
      type: object
      required: [available, priced_entries, unpriced_entries, excluded_entries]
      properties:
        available:
          type: boolean
          description: False when enrichment was unreachable; total_value_cents is then absent.
        total_value_cents: { type: integer, format: int64 }
        priced_entries: { type: integer }
        unpriced_entries:
          type: integer
          description: Entries whose effective product is unmatched or lacks a price for their packaging.
        excluded_entries:
          type: integer
          description: Entries with pricing_mode disabled.
    Dashboard:
      type: object
      required: [total_entries, by_status, by_item_type, by_platform, spend, pricing]
      properties:
        total_entries: { type: integer }
        by_status:
          type: object
          additionalProperties: { type: integer }
        by_item_type:
          type: object
          additionalProperties: { type: integer }
        by_platform:
          type: array
          items: { $ref: "#/components/schemas/PlatformCount" }
        spend:
          type: array
          description: Sum of price_paid_cents per currency, over entries that record a price.
          items: { $ref: "#/components/schemas/CurrencySpend" }
        pricing: { $ref: "#/components/schemas/DashboardPricing" }
    ValuePoint:
      type: object
      required: [date, value_cents]
      properties:
        date: { type: string, format: date }
        value_cents: { type: integer, format: int64 }
    ValueHistory:
      type: object
      required: [available, points]
      properties:
        available:
          type: boolean
          description: False when enrichment was unreachable; points is then empty.
        points:
          type: array
          items: { $ref: "#/components/schemas/ValuePoint" }
    # The social/shared schemas below compose the public profile and
    # shelf pages across the user, collection, and social services.
    # ProfileCard mirrors the user service contract verbatim;
    # ShelfSocialSummary/ProfileSocialSummary/Comment mirror the social
    # service contract verbatim; SharedEntry/SharedEntryGroup mirror
    # the collection service's shared-shelf contract verbatim (reusing
    # EntryPlatform/TagRef above - the same fields, the same rules).
    ProfileCard:
      description: The cross-user projection of a user. Never email, never roles.
      type: object
      required: [user_id, handle, profile_visibility]
      properties:
        user_id: { type: string, format: uuid }
        handle: { type: string }
        avatar_url: { type: string }
        profile_visibility:
          type: string
          enum: [private, unlisted, listed]
    ShelfSocialSummary:
      type: object
      required: [shelf_id, like_count, comment_count, viewer_likes]
      properties:
        shelf_id: { type: string, format: uuid }
        like_count: { type: integer }
        comment_count: { type: integer, description: Live comments only. }
        viewer_likes: { type: boolean }
    ProfileSocialSummary:
      type: object
      required: [follower_count, following_count, viewer_follows]
      properties:
        follower_count: { type: integer }
        following_count: { type: integer }
        viewer_follows: { type: boolean }
    ShelfCard:
      description: >
        A shelf card as shown in a profile's shelf list, an activity
        feed excerpt, or an Explore grid. owner is embedded so a card
        renders without a second round trip; like_count/comment_count/
        viewer_likes are present exactly when the page's social
        composition succeeded (all three absent together when the
        page fell back to social_available: false).
      type: object
      required: [id, name, slug, owner, entry_count, cover_urls]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        owner: { $ref: "#/components/schemas/ProfileCard" }
        published_at: { type: string, format: date-time }
        entry_count: { type: integer }
        cover_urls:
          type: array
          items: { type: string }
        like_count: { type: integer }
        comment_count: { type: integer }
        viewer_likes: { type: boolean }
    ShelfMeta:
      description: >
        A shelf's own identity and stored view state, without the
        owner card or social counts (those are ShelfPage's sibling
        fields).
      type: object
      required: [id, name, slug, params]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        params:
          type: object
          additionalProperties: true
        published_at: { type: string, format: date-time }
    ShelfPage:
      description: >
        A single shared shelf's page composition: the shelf meta, its
        (non-private, by construction) owner card, and social counts
        when the social service answered. social is absent exactly
        when social_available is false (the social service degrades
        open; the page still renders).
      type: object
      required: [shelf, owner, social_available]
      properties:
        shelf: { $ref: "#/components/schemas/ShelfMeta" }
        owner: { $ref: "#/components/schemas/ProfileCard" }
        social_available: { type: boolean }
        social: { $ref: "#/components/schemas/ShelfSocialSummary" }
    ProfilePage:
      description: >
        A profile's page composition: the profile card, social counts
        when the social service answered, and up to 50 of the owner's
        listed shelves (owners see exactly what visitors see). social
        is absent exactly when social_available is false (the social
        service degrades open; the page still renders).
      type: object
      required: [profile, social_available, shelves, total_count]
      properties:
        profile: { $ref: "#/components/schemas/ProfileCard" }
        social_available: { type: boolean }
        social: { $ref: "#/components/schemas/ProfileSocialSummary" }
        shelves:
          type: array
          items: { $ref: "#/components/schemas/ShelfCard" }
        total_count:
          type: integer
          description: The owner's full listed-shelf count, beyond this page.
    Comment:
      description: >
        A live comment; tombstones never serialize. author_id is null
        for a purge-anonymized comment (the row survives with its
        body; only the account link is severed) and a uuid otherwise -
        the key is always present, only the value varies. author is
        the bff's batched ProfileCard hydration of author_id (the same
        composition FeedItem.actor uses): present on a GET list page
        when the author resolves, absent for an anonymized comment
        (there is no id left to hydrate) or when the hydration batch
        itself fails open; never populated on the POST response (a
        verbatim create relay).
      type: object
      required: [id, shelf_id, author_id, body, created_at]
      properties:
        id: { type: string, format: uuid }
        shelf_id: { type: string, format: uuid }
        author_id: { type: string, format: uuid, nullable: true }
        body: { type: string }
        created_at: { type: string, format: date-time }
        author: { $ref: "#/components/schemas/ProfileCard" }
    CommentList:
      type: object
      required: [comments]
      properties:
        comments:
          type: array
          items: { $ref: "#/components/schemas/Comment" }
        next_cursor: { type: string }
    CreateCommentRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }
    FeedItem:
      description: >
        One activity-feed row after the fill loop hydrates and gates
        it. actor always attaches (actions are signed, any
        visibility); shelf is present only for the three shelf verbs
        (liked_shelf, commented_shelf, published_shelf) whose object
        cleared the tab's gating rule; followed_user is present only
        for a surviving followed_user row and carries the followee's
        card; comment_excerpt is present only for a surviving
        commented_shelf row.
      type: object
      required: [id, verb, created_at, actor]
      properties:
        id: { type: string, format: uuid }
        verb:
          type: string
          enum: [followed_user, liked_shelf, commented_shelf, published_shelf]
        created_at: { type: string, format: date-time }
        actor: { $ref: "#/components/schemas/ProfileCard" }
        shelf: { $ref: "#/components/schemas/ShelfCard" }
        followed_user: { $ref: "#/components/schemas/ProfileCard" }
        comment_excerpt: { type: string }
    FeedPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FeedItem" }
        next_cursor: { type: string }
    ExplorePage:
      description: >
        total_count is never sent: top is a fixed leaderboard with no
        deeper page to count, and recent supersedes it with
        next_offset (kept in the shape, never populated, for forward
        compatibility only).
      type: object
      required: [shelves]
      properties:
        total_count: { type: integer }
        next_offset:
          type: integer
          minimum: 0
          description: >
            Present when more listed shelves remain to page through -
            recent sort only. The raw collection-space offset to
            resume from; absent once the listed-shelf stream is
            exhausted.
        shelves:
          type: array
          items: { $ref: "#/components/schemas/ShelfCard" }
    SharedEntry:
      description: >
        The cross-user entry projection - a strict whitelist. No money
        fields (price paid, values, currency, purchase provenance,
        pricing mode) and no personal fields (status, rating, notes,
        location, backlog rank, external refs) may ever be added here
        without a deliberate privacy decision.
      type: object
      required: [id, item_type, media_type, display_name, region, packaging, has_box, has_manual, pinned, tags, created_at]
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        item_type: { type: string, enum: [game, console, accessory] }
        media_type: { type: string, enum: [physical, digital] }
        display_name: { type: string }
        platform: { $ref: "#/components/schemas/EntryPlatform" }
        first_release_date: { type: string, format: date }
        cover_url: { type: string }
        igdb_game_id: { type: integer, format: int64 }
        region: { type: string, enum: [ntsc_u, ntsc_j, pal, region_free] }
        edition: { type: string }
        packaging: { type: string, enum: [sealed, cib, loose] }
        has_box: { type: boolean }
        has_manual: { type: boolean }
        box_condition: { type: string, enum: [mint, near_mint, very_good, good, acceptable, poor] }
        manual_condition: { type: string, enum: [mint, near_mint, very_good, good, acceptable, poor] }
        item_condition: { type: string, enum: [mint, near_mint, very_good, good, acceptable, poor] }
        pinned: { type: boolean }
        tags:
          type: array
          items: { $ref: "#/components/schemas/TagRef" }
        created_at: { type: string, format: date-time }
    SharedEntryGroup:
      type: object
      required: [key, label, entries]
      properties:
        key: { type: string }
        label: { type: string }
        entries:
          type: array
          items: { $ref: "#/components/schemas/SharedEntry" }
    SharedEntryList:
      description: Exactly one of entries/groups is present (groups when the stored params group).
      type: object
      required: [total_count]
      properties:
        total_count: { type: integer }
        entries:
          type: array
          items: { $ref: "#/components/schemas/SharedEntry" }
        groups:
          type: array
          items: { $ref: "#/components/schemas/SharedEntryGroup" }
