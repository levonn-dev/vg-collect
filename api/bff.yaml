  /api/profiles/{handle}:
    get:
      operationId: getProfilePage
      summary: "A user's public profile: card, listed shelves, and social counts"
      description: >
        Composes the profile card with up to 50 of the owner's listed
        shelves and the social follower/like counts. Owners see exactly
        what visitors see (an honest preview of their own public page).
        social is absent exactly when social_available is false (the
        social service degrades open; the page still renders).
      parameters:
        - name: handle
          in: path
          required: true
          schema: { type: string }
      responses:
        default: { $ref: "#/components/responses/InternalError" }
        "200":
          description: Profile page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfilePage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          $ref: "#/components/responses/NotFound"
          description: Unknown or private (deliberately indistinguishable; code profile_not_found)
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/profiles/{handle}/shelves/{slug}:
    get:
      operationId: getProfileShelfPage
      summary: A shared shelf resolved by owner handle and slug
      description: >
        Resolves the handle to its owner, then the slug to a shelf
        under that owner, applying the two-sided effective-visibility
        rule (the stricter of profile visibility and shelf visibility:
        both must be non-private). Every miss on this route - unknown
        handle, private owner, unknown slug, private shelf - answers
        the same 404 so a probing request cannot tell them apart. The
        composed payload carries the shelf UUID for all subsequent
        calls (entries, comments, likes).
      parameters:
        - name: handle
          in: path
          required: true
          schema: { type: string }
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        default: { $ref: "#/components/responses/InternalError" }
        "200":
          description: Shelf page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShelfPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          $ref: "#/components/responses/NotFound"
          description: Unknown or private (deliberately indistinguishable; code shelf_not_found)
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/shelves/{shelfId}:
    get:
      operationId: getShelfPage
      summary: "A shared shelf's page: meta, owner card, and social counts"
      description: >
        Applies the two-sided effective-visibility rule (the stricter
        of profile visibility and shelf visibility: both must be
        non-private); unknown, private-shelf, and private-owner all
        answer the same 404. social is absent exactly when
        social_available is false.
      parameters:
        - name: shelfId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        default: { $ref: "#/components/responses/InternalError" }
        "200":
          description: Shelf page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShelfPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          $ref: "#/components/responses/NotFound"
          description: Unknown or private (deliberately indistinguishable; code shelf_not_found)
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/shelves/{shelfId}/entries:
    get:
      operationId: listShelfEntries
      summary: A shelf's entries, whitelist-projected (proxied)
      description: >
        Applies the effective-visibility rule before relaying
        collection's whitelisted projection verbatim (money and
        personal fields never appear).
      parameters:
        - name: shelfId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - $ref: './common.yaml#/components/parameters/offset'
      responses:
        default: { $ref: "#/components/responses/InternalError" }
        "200":
          description: One page of the shelf's entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedEntryList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          $ref: "#/components/responses/NotFound"
          description: Unknown or private (deliberately indistinguishable; code shelf_not_found)
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/shelves/{shelfId}/comments:
    get:
      operationId: listShelfComments
      summary: A shelf's live comments, newest first, keyset-paged (composed with batched author cards)
      description: >
        Applies the effective-visibility rule, then composes social's
        page with a batched author ProfileCard per comment (mirrors
        the feed's actor hydration). A card-fetch failure fails open:
        the page still serves, just without any author. Anything
        other than social's 200 (its own 400 on a malformed cursor
        included) still relays verbatim, unchanged from before.
      parameters:
        - name: shelfId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: './common.yaml#/components/parameters/cursor'
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        default: { $ref: "#/components/responses/InternalError" }
        "200":
          description: One page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommentList" }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: Malformed cursor (code invalid_param)
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          $ref: "#/components/responses/NotFound"
          description: Unknown or private (deliberately indistinguishable; code shelf_not_found)
        "502": { $ref: "#/components/responses/UpstreamError" }
    post:
      operationId: createShelfComment
      summary: Comment on a shelf (proxied)
      description: Applies the effective-visibility rule before relaying the social service verbatim.
      parameters:
        - name: shelfId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCommentRequest" }
      responses:
        default: { $ref: "#/components/responses/InternalError" }
        "201":
          description: The comment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: Invalid body (code invalid_body)
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          $ref: "#/components/responses/NotFound"
          description: Unknown or private (deliberately indistinguishable; code shelf_not_found)
        "429":
          $ref: "#/components/responses/TooManyRequests"
          description: Comment cap reached - tombstones count (code cap_exceeded)
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/comments/{commentId}:
    delete:
      operationId: deleteComment
      summary: Delete a comment; author tombstones body-NULL, shelf owner tombstones body-retained (proxied)
      description: >
        Relayed verbatim; the bff does not resolve the shelf for this
        call (social already knows the comment row's shelf and owner
        and authorizes by row).
      parameters:
        - name: commentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        default: { $ref: "#/components/responses/InternalError" }
        "204":
          description: Tombstoned
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          $ref: "#/components/responses/Forbidden"
          description: Caller is neither author nor shelf owner (code forbidden)
        "404":
          $ref: "#/components/responses/NotFound"
          description: Unknown or already tombstoned (code comment_not_found)
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/social/follows/{userId}:
    put:
      operationId: follow
      summary: Follow a user (idempotent) (proxied)
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        default: { $ref: "#/components/responses/InternalError" }
        "204":
          description: Following (already or newly)
        "400":
          $ref: "#/components/responses/BadRequest"
          description: Self-follow (code self_follow)
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          $ref: "#/components/responses/NotFound"
          description: Unknown or private (deliberately indistinguishable; code profile_not_found)
        "429":
          $ref: "#/components/responses/TooManyRequests"
          description: Follow cap reached (code cap_exceeded)
        "502": { $ref: "#/components/responses/UpstreamError" }
    delete:
      operationId: unfollow
      summary: Unfollow a user (idempotent) (proxied)
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        default: { $ref: "#/components/responses/InternalError" }
        "204":
          description: Not following (already or newly)
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/social/likes/{shelfId}:
    put:
      operationId: likeShelf
      summary: Like a shelf (idempotent) (proxied)
      parameters:
        - name: shelfId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        default: { $ref: "#/components/responses/InternalError" }
        "204":
          description: Liked (already or newly)
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          $ref: "#/components/responses/NotFound"
          description: Unknown or private (deliberately indistinguishable; code shelf_not_found)
        "429":
          $ref: "#/components/responses/TooManyRequests"
          description: Like cap reached (code cap_exceeded)
        "502": { $ref: "#/components/responses/UpstreamError" }
    delete:
      operationId: unlikeShelf
      summary: Remove a like (idempotent) (proxied)
      parameters:
        - name: shelfId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        default: { $ref: "#/components/responses/InternalError" }
        "204":
          description: Not liked (already or newly)
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/search/users:
    get:
      operationId: searchUsers
      summary: Substring search over listed profiles' handles (proxied)
      parameters:
        - $ref: './common.yaml#/components/parameters/userSearchQ'
      responses:
        default: { $ref: "#/components/responses/InternalError" }
        "200":
          description: Up to 20 listed matches
          content:
            application/json:
              schema:
                type: object
                required: [profiles]
                properties:
                  profiles:
                    type: array
                    items: { $ref: "#/components/schemas/ProfileCard" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/shared/profiles/by-ids:
    get:
      operationId: getSharedProfilesByIds
      summary: Batch profile cards for hydration (relayed from the user service; visibility-independent - actions are signed)
      description: >
        Mirrors the user service's batch resolve verbatim: cards come
        back for the ids that exist regardless of visibility (page
        access is gated separately, per page). Backs the admin
        submissions queue's submitter-handle hydration.
      parameters:
        - name: ids
          in: query
          required: true
          schema:
            type: array
            maxItems: 100
            items: { type: string, format: uuid }
      responses:
        default: { $ref: "#/components/responses/InternalError" }
        "200":
          description: Cards for the ids that exist
          content:
            application/json:
              schema:
                type: object
                required: [profiles]
                properties:
                  profiles:
                    type: array
                    items: { $ref: "#/components/schemas/ProfileCard" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/feed:
    get:
      operationId: getFeed
      summary: The caller's two-tab activity feed (fill loop, hydrated and gated)
      description: >
        Runs a fill loop against the social service: fetch a raw page,
        hydrate it (actor cards, shelf cards, comment excerpts), gate
        it by the tab's visibility rule, and repeat until limit
        survivors accumulate or the raw stream exhausts, capped at
        feedFillRounds rounds (a rare shortfall yields a slightly
        short page). Actions are signed, objects are gated: actor
        cards attach at any visibility; on tab=following a row
        naming a shelf survives only when the shelf is listed and its
        owner is listed, and a followed_user row survives only when
        the followee is listed; tab=you shows every row (the objects
        are the caller's own shelves). next_cursor is the raw cursor
        of the last consumed row; absent when the raw stream is
        exhausted with nothing left to resume from.
      parameters:
        - $ref: './common.yaml#/components/parameters/tab'
        - $ref: './common.yaml#/components/parameters/cursor'
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        default: { $ref: "#/components/responses/InternalError" }
        "200":
          description: One filled page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedPage" }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: Invalid tab or malformed cursor (code invalid_param)
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/explore:
    get:
      operationId: getExplore
      summary: Browse shared shelves - newest-published or top-liked, listed-only
      description: >
        recent pages collection's listed shelves directly (no owner
        filter), gates each page's owner for listed-ness at the bff,
        and fills short pages by re-paging collection, up to a fixed
        round cap; next_offset carries the raw collection-space
        resume position and is present only while more rows remain -
        top is the fixed all-time like-count leaderboard (leaderboard
        order preserved, no deep paging, no next_offset), dropping
        anything that is not effectively listed by the time it is
        read. limit and offset apply to recent only; top always
        answers its own fixed-size leaderboard.
      parameters:
        - name: sort
          in: query
          required: true
          schema: { type: string, enum: [recent, top] }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - $ref: './common.yaml#/components/parameters/offset'
      responses:
        default: { $ref: "#/components/responses/InternalError" }
        "200":
          description: One page of shelf cards
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExplorePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "502": { $ref: "#/components/responses/UpstreamError" }
components:
  responses:
    Unauthenticated:
      description: No valid session (cookie missing, malformed, expired, revoked, or denylisted)
      content:
        application/problem+json:
          schema: { $ref: './common.yaml#/components/schemas/Problem' }
    InternalError:
      description: Unexpected server-side failure
      content:
        application/problem+json:
          schema: { $ref: './common.yaml#/components/schemas/Problem' }
    OriginForbidden:
      description: Mutating request from a foreign origin (code origin_forbidden)
      content:
        application/problem+json:
          schema: { $ref: './common.yaml#/components/schemas/Problem' }
    UpstreamError:
      description: A downstream service failed (code upstream_error)
      content:
        application/problem+json:
          schema: { $ref: './common.yaml#/components/schemas/Problem' }
    BadRequest:
      description: Invalid body
      content:
        application/problem+json:
          schema: { $ref: './common.yaml#/components/schemas/Problem' }
    Forbidden:
      description: Caller lacks the admin role (code forbidden)
      content:
        application/problem+json:
          schema: { $ref: './common.yaml#/components/schemas/Problem' }
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema: { $ref: './common.yaml#/components/schemas/Problem' }
    Conflict:
      description: Name already taken
      content:
        application/problem+json:
          schema: { $ref: './common.yaml#/components/schemas/Problem' }
    TooManyRequests:
      description: Handle changed too recently (code handle_cooldown; relayed from the user service)
      content:
        application/problem+json:
          schema: { $ref: './common.yaml#/components/schemas/Problem' }
    ServiceUnavailable:
      description: Session refresh blocked on a dependency; retry (code user_unavailable)
      content:
        application/problem+json:
          schema: { $ref: './common.yaml#/components/schemas/Problem' }
  schemas:
    FXRates:
      $ref: './common.yaml#/components/schemas/FXRates'
    Providers:
      $ref: './common.yaml#/components/schemas/Providers'
    Me:
      description: >
        Browser-facing projection of the user service's User. Timestamps
        are intentionally omitted; add fields only when the SPA has a
        concrete use for them.
      type: object
      required: [id, email, handle, roles, preferred_currency, profile_visibility, landing_page]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        handle: { $ref: './common.yaml#/components/schemas/Handle' }
        avatar_url: { type: string }
        roles:
          type: array
          items: { $ref: './common.yaml#/components/schemas/Role' }
        preferred_currency:
          description: Display currency for market values; USD until set.
          allOf:
            - $ref: './common.yaml#/components/schemas/CurrencyCode'
        profile_visibility: { $ref: './common.yaml#/components/schemas/Visibility' }
        landing_page:
          description: Where the app opens after sign-in.
          allOf:
            - $ref: './common.yaml#/components/schemas/LandingPage'
    UpdateMeRequest:
      type: object
      description: Absent fields keep their value; an empty avatar_url clears it.
      properties:
        handle: { $ref: './common.yaml#/components/schemas/Handle' }
        avatar_url: { type: string, maxLength: 2048 }
        preferred_currency: { $ref: './common.yaml#/components/schemas/CurrencyCode' }
        profile_visibility: { $ref: './common.yaml#/components/schemas/Visibility' }
        landing_page: { $ref: './common.yaml#/components/schemas/LandingPage' }
    Identity:
      $ref: './common.yaml#/components/schemas/Identity'
    Identities:
      $ref: './common.yaml#/components/schemas/Identities'
    # Catalog schemas below mirror the enrichment contract verbatim:
    # these routes relay the upstream body unreshaped.
    PlatformRef:
      $ref: './common.yaml#/components/schemas/PlatformRef'
    CatalogPlatform:
      $ref: './common.yaml#/components/schemas/CatalogPlatform'
    PlatformCatalog:
      $ref: './common.yaml#/components/schemas/PlatformCatalog'
    SearchResult:
      $ref: './common.yaml#/components/schemas/SearchResult'
    SearchResults:
      $ref: './common.yaml#/components/schemas/SearchResults'
    IgdbMeta:
      $ref: './common.yaml#/components/schemas/IgdbMeta'
    CompanyCredit:
      $ref: './common.yaml#/components/schemas/CompanyCredit'
    ReleaseDate:
      $ref: './common.yaml#/components/schemas/ReleaseDate'
    Localization:
      $ref: './common.yaml#/components/schemas/Localization'
    PricechartingMeta:
      $ref: './common.yaml#/components/schemas/PricechartingMeta'
    Product:
      $ref: './common.yaml#/components/schemas/Product'
    CommunityMeta:
      $ref: './common.yaml#/components/schemas/CommunityMeta'
    PromoteRequest:
      $ref: './common.yaml#/components/schemas/PromoteRequest'
    PromoteCandidate:
      $ref: './common.yaml#/components/schemas/PromoteCandidate'
    PromoteCandidatesPage:
      $ref: './common.yaml#/components/schemas/PromoteCandidatesPage'
    PromoteCandidateProduct:
      $ref: './common.yaml#/components/schemas/PromoteCandidateProduct'
    DismissCandidateRequest:
      $ref: './common.yaml#/components/schemas/DismissCandidateRequest'
    ResolveRequest:
      $ref: './common.yaml#/components/schemas/ResolveRequest'
    Recommendation:
      $ref: './common.yaml#/components/schemas/Recommendation'
    ScoreResponse:
      $ref: './common.yaml#/components/schemas/ScoreResponse'
    UnmatchedProductsPage:
      $ref: './common.yaml#/components/schemas/UnmatchedProductsPage'
    CommunityProductsPage:
      $ref: './common.yaml#/components/schemas/CommunityProductsPage'
    MappingRequest:
      $ref: './common.yaml#/components/schemas/MappingRequest'
    RefreshAccepted:
      $ref: './common.yaml#/components/schemas/RefreshAccepted'
    RematchAccepted:
      $ref: './common.yaml#/components/schemas/RematchAccepted'
    ResnapshotResult:
      $ref: './common.yaml#/components/schemas/ResnapshotResult'
    NormalizeResult:
      $ref: './common.yaml#/components/schemas/NormalizeResult'
    Problem:
      $ref: './common.yaml#/components/schemas/Problem'
    # Collection schemas below mirror the collection service contract
    # verbatim: these routes relay the upstream body unreshaped.
    EntryPlatform:
      $ref: './common.yaml#/components/schemas/EntryPlatform'
    Entry:
      $ref: './common.yaml#/components/schemas/Entry'
    Submission:
      $ref: './common.yaml#/components/schemas/Submission'
    AdminSubmission:
      $ref: './common.yaml#/components/schemas/AdminSubmission'
    AdminSubmissionsPage:
      $ref: './common.yaml#/components/schemas/AdminSubmissionsPage'
    CommunityProductSpec:
      $ref: './common.yaml#/components/schemas/CommunityProductSpec'
    VerdictRequest:
      $ref: './common.yaml#/components/schemas/VerdictRequest'
    EntryCreate:
      $ref: './common.yaml#/components/schemas/EntryCreate'
    EntryUpdate:
      $ref: './common.yaml#/components/schemas/EntryUpdate'
    EntryList:
      $ref: './common.yaml#/components/schemas/EntryList'
    EntryGroup:
      $ref: './common.yaml#/components/schemas/EntryGroup'
    BulkUpdateRequest:
      $ref: './common.yaml#/components/schemas/BulkUpdateRequest'
    BulkUpdateResult:
      $ref: './common.yaml#/components/schemas/BulkUpdateResult'
    ReorderRequest:
      $ref: './common.yaml#/components/schemas/ReorderRequest'
    TagRef:
      $ref: './common.yaml#/components/schemas/TagRef'
    Tag:
      $ref: './common.yaml#/components/schemas/Tag'
    TagCreate:
      $ref: './common.yaml#/components/schemas/TagCreate'
    SavedView:
      $ref: './common.yaml#/components/schemas/SavedView'
    ViewCreate:
      $ref: './common.yaml#/components/schemas/ViewCreate'
    PlatformCount:
      $ref: './common.yaml#/components/schemas/PlatformCount'
    CurrencySpend:
      $ref: './common.yaml#/components/schemas/CurrencySpend'
    DashboardPricing:
      $ref: './common.yaml#/components/schemas/DashboardPricing'
    Dashboard:
      $ref: './common.yaml#/components/schemas/Dashboard'
    ValuePoint:
      $ref: './common.yaml#/components/schemas/ValuePoint'
    ValueHistory:
      $ref: './common.yaml#/components/schemas/ValueHistory'
    # Each schema below mirrors another service's contract verbatim:
    # ProfileCard (user), ShelfSocialSummary/ProfileSocialSummary/Comment
    # (social), SharedEntry/SharedEntryGroup (collection, reusing
    # EntryPlatform/TagRef above).
    ProfileCard:
      $ref: './common.yaml#/components/schemas/ProfileCard'
    ShelfSocialSummary:
      $ref: './common.yaml#/components/schemas/ShelfSocialSummary'
    ProfileSocialSummary:
      $ref: './common.yaml#/components/schemas/ProfileSocialSummary'
    ShelfCard:
      description: >
        A shelf card as shown in a profile's shelf list, an activity
        feed excerpt, or an Explore grid. owner is embedded so a card
        renders without a second round trip; like_count/comment_count/
        viewer_likes are present exactly when the page's social
        composition succeeded (all three absent together when the
        page fell back to social_available: false).
      type: object
      required: [id, name, slug, owner, entry_count, cover_urls]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        owner: { $ref: "#/components/schemas/ProfileCard" }
        published_at: { type: string, format: date-time }
        entry_count: { type: integer }
        cover_urls:
          type: array
          items: { type: string }
        like_count: { type: integer }
        comment_count: { type: integer }
        viewer_likes: { type: boolean }
    ShelfMeta:
      description: >
        A shelf's own identity and stored view state, without the
        owner card or social counts (those are ShelfPage's sibling
        fields).
      type: object
      required: [id, name, slug, params]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        params:
          type: object
          additionalProperties: true
        published_at: { type: string, format: date-time }
    ShelfPage:
      description: >
        A single shared shelf's page composition: the shelf meta, its
        (non-private, by construction) owner card, and social counts
        when the social service answered. social is absent exactly
        when social_available is false (the social service degrades
        open; the page still renders).
      type: object
      required: [shelf, owner, social_available]
      properties:
        shelf: { $ref: "#/components/schemas/ShelfMeta" }
        owner: { $ref: "#/components/schemas/ProfileCard" }
        social_available: { type: boolean }
        social: { $ref: "#/components/schemas/ShelfSocialSummary" }
    ProfilePage:
      description: >
        A profile's page composition: the profile card, social counts
        when the social service answered, and up to 50 of the owner's
        listed shelves (owners see exactly what visitors see). social
        is absent exactly when social_available is false (the social
        service degrades open; the page still renders).
      type: object
      required: [profile, social_available, shelves, total_count]
      properties:
        profile: { $ref: "#/components/schemas/ProfileCard" }
        social_available: { type: boolean }
        social: { $ref: "#/components/schemas/ProfileSocialSummary" }
        shelves:
          type: array
          items: { $ref: "#/components/schemas/ShelfCard" }
        total_count:
          type: integer
          description: The owner's full listed-shelf count, beyond this page.
    Comment:
      description: >
        A live comment; tombstones never serialize (purge tombstones
        the row and clears the body; an anonymized comment never
        serializes again). author is the bff's batched ProfileCard
        hydration of author_id (the same composition FeedItem.actor
        uses): present on a GET list page when the author resolves,
        absent when the hydration batch fails open; never populated on
        the POST response (a verbatim create relay).
      type: object
      required: [id, shelf_id, author_id, body, created_at]
      properties:
        id: { type: string, format: uuid }
        shelf_id: { type: string, format: uuid }
        author_id: { type: string, format: uuid }
        body: { type: string }
        created_at: { type: string, format: date-time }
        author: { $ref: "#/components/schemas/ProfileCard" }
    CommentList:
      type: object
      required: [comments]
      properties:
        comments:
          type: array
          items: { $ref: "#/components/schemas/Comment" }
        next_cursor: { type: string }
    CreateCommentRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }
    FeedItem:
      description: >
        One activity-feed row after the fill loop hydrates and gates
        it. actor always attaches (actions are signed, any
        visibility); shelf is present only for the three shelf verbs
        (liked_shelf, commented_shelf, published_shelf) whose object
        cleared the tab's gating rule; followed_user is present only
        for a surviving followed_user row and carries the followee's
        card; comment_excerpt is present only for a surviving
        commented_shelf row.
      type: object
      required: [id, verb, created_at, actor]
      properties:
        id: { type: string, format: uuid }
        verb: { $ref: './common.yaml#/components/schemas/ActivityVerb' }
        created_at: { type: string, format: date-time }
        actor: { $ref: "#/components/schemas/ProfileCard" }
        shelf: { $ref: "#/components/schemas/ShelfCard" }
        followed_user: { $ref: "#/components/schemas/ProfileCard" }
        comment_excerpt: { type: string }
    FeedPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FeedItem" }
        next_cursor: { type: string }
    ExplorePage:
      type: object
      required: [shelves]
      properties:
        next_offset:
          type: integer
          minimum: 0
          description: >
            Present when more listed shelves remain to page through -
            recent sort only. The raw collection-space offset to
            resume from; absent once the listed-shelf stream is
            exhausted.
        shelves:
          type: array
          items: { $ref: "#/components/schemas/ShelfCard" }
    SharedEntry:
      $ref: './common.yaml#/components/schemas/SharedEntry'
    SharedEntryGroup:
      $ref: './common.yaml#/components/schemas/SharedEntryGroup'
    SharedEntryList:
      $ref: './common.yaml#/components/schemas/SharedEntryList'
