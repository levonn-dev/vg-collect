openapi: 3.0.3
info:
  title: vgkeep bff
  version: 0.1.0
  description: >
    The browser-facing API. Authentication is a sealed HttpOnly cookie,
    never a header: the SPA calls these endpoints same-origin. Errors are
    application/problem+json with stable machine-readable codes. The
    login and callback endpoints are navigations (they redirect), not
    XHR targets.
paths:
  /api/auth/providers:
    get:
      operationId: listProviders
      summary: Login provider names currently enabled (drives the login page buttons)
      responses:
        "200":
          description: "Subset of: google, twitch, dev; display order"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Providers" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/auth/login:
    get:
      operationId: login
      summary: Begin a login; redirects the browser to the provider (or straight back for dev)
      parameters:
        - name: provider
          in: query
          required: true
          schema: { type: string }
          description: "google, twitch, or dev (when the dev provider is enabled)"
        - name: user
          in: query
          required: false
          schema: { type: string }
          description: "Dev provider only: fixture handle (alice, bob, admin)"
      responses:
        "302":
          description: >
            Location is the provider authorize URL; for the dev provider,
            / with the session cookie set; on failure, /login?error=<code>.
          headers:
            Location: { schema: { type: string } }
  /api/auth/callback:
    get:
      operationId: callback
      summary: The provider redirect URI; completes login and seals the session cookie
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: state
          in: query
          required: false
          schema: { type: string }
      responses:
        "302":
          description: / with Set-Cookie on success, /login?error=<code> otherwise
          headers:
            Location: { schema: { type: string } }
  /api/auth/logout:
    post:
      operationId: logout
      summary: Revoke the session (jti denylist + refresh chain) and clear the cookie; idempotent
      responses:
        "204":
          description: Logged out (also when no session existed)
        "403": { $ref: "#/components/responses/OriginForbidden" }
  /api/me:
    get:
      operationId: getMe
      summary: The signed-in user's profile (composed from the user service; briefly cached)
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503":
          description: Session refresh blocked on a dependency; retry (code user_unavailable)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    patch:
      operationId: updateMe
      summary: Edit the signed-in user's profile (handle, avatar URL)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMeRequest" }
      responses:
        "200":
          description: Updated profile (the /api/me cache is refreshed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400":
          description: Validation failure (code invalid_body; detail names the field)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/OriginForbidden" }
        "404":
          description: The signed-in account no longer exists (relayed from the user service)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Another account owns that handle's folded key (code handle_taken; relayed from the user service)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          description: Handle changed too recently (code handle_cooldown; relayed from the user service)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
    delete:
      operationId: deleteMe
      summary: Delete the account everywhere (collection, linked logins, profile) and end the session
      description: >
        Orchestrated in self-healing order: collection purge, then auth
        identities + refresh revocation, then the user row, then session
        teardown. A mid-sequence failure answers 502 with the session
        intact so the request can be retried; an abandoned partial
        deletion re-attaches to the surviving account on next login.
      responses:
        "204":
          description: Account deleted; the session cookie is cleared
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/OriginForbidden" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/me/identities:
    get:
      operationId: getMyIdentities
      summary: Provider logins linked to the signed-in account
      responses:
        "200":
          description: Linked identities, oldest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Identities" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/me/identities/{identityId}:
    delete:
      operationId: deleteMyIdentity
      summary: Unlink a provider login from the signed-in account
      parameters:
        - name: identityId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Unlinked
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/OriginForbidden" }
        "404":
          description: No such linked login (code identity_not_found)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Refusing to remove the last login (code last_identity)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/auth/link:
    get:
      operationId: linkLogin
      summary: Begin linking another login to the signed-in account; redirects like login
      description: >
        A browser navigation, session-guarded (unlike /api/auth/login).
        Real providers redirect to the provider authorize URL and come
        back through /api/auth/callback; the dev provider links in one
        hop. Outcomes land on /account as query params: ?linked=<p> or
        ?link_error=<conflict|email_unverified|link_failed>.
      parameters:
        - name: provider
          in: query
          required: true
          schema: { type: string }
          description: "google, twitch, or dev (when the dev provider is enabled)"
        - name: user
          in: query
          required: false
          schema: { type: string }
          description: "Dev provider only: fixture handle (alice, bob, admin)"
      responses:
        "302":
          description: Provider authorize URL, or /account with the outcome params
          headers:
            Location: { schema: { type: string } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /api/otlp/v1/traces:
    post:
      operationId: proxyTraces
      summary: Relay browser OTLP trace batches to the in-cluster collector
      description: >-
        Accepts an OTLP/HTTP ExportTraceServiceRequest (protobuf or JSON
        encoding) from the SPA and forwards it verbatim to the
        collector agent. The collector's status and body pass through
        unchanged. Requires the session cookie like every other /api
        route; never cached.
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema:
              type: string
              format: binary
          application/json:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Collector export response, relayed verbatim
          content:
            application/x-protobuf:
              schema:
                type: string
                format: binary
        "400":
          description: Body unreadable or over the size cap
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/otlp/v1/metrics:
    post:
      operationId: proxyMetrics
      summary: Relay browser OTLP metric batches to the in-cluster collector
      description: >-
        Accepts an OTLP/HTTP ExportMetricsServiceRequest (protobuf or JSON
        encoding) from the SPA and forwards it verbatim to the
        collector agent. The collector's status and body pass through
        unchanged. Requires the session cookie like every other /api
        route; never cached.
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema:
              type: string
              format: binary
          application/json:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Collector export response, relayed verbatim
          content:
            application/x-protobuf:
              schema:
                type: string
                format: binary
        "400":
          description: Body unreadable or over the size cap
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/search:
    get:
      operationId: searchCatalog
      summary: Catalog discovery search (proxied to the enrichment service, uncached)
      parameters:
        - name: type
          in: query
          required: true
          schema: { type: string, enum: [game, hardware, pc_listing] }
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Search results (possibly degraded)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResults" }
        "400":
          description: Invalid parameters
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/products/resolve:
    post:
      operationId: resolveProduct
      summary: Find-or-create the canonical product for a selection (proxied, uncached)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolveRequest" }
      responses:
        "200":
          description: The canonical product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400":
          description: Invalid body
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: The provider does not know the requested id
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/products/{productId}:
    get:
      operationId: getProduct
      summary: Fetch a catalog product (proxied, uncached)
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/entries:
    get:
      operationId: listEntries
      summary: List collection entries (proxied to the collection service, uncached)
      parameters:
        - name: item_type
          in: query
          required: false
          schema:
            type: array
            items: { type: string, enum: [game, console, accessory] }
        - name: status
          in: query
          required: false
          schema:
            type: array
            items: { type: string, enum: [backlog, playing, beaten, completed, dropped, shelved] }
        - name: packaging
          in: query
          required: false
          schema:
            type: array
            items: { type: string, enum: [sealed, cib, loose] }
        - name: region
          in: query
          required: false
          schema:
            type: array
            items: { type: string, enum: [ntsc_u, ntsc_j, pal, region_free] }
        - name: item_condition
          in: query
          required: false
          schema:
            type: array
            items: { type: string, enum: [mint, near_mint, very_good, good, acceptable, poor] }
        - name: platform_id
          in: query
          required: false
          description: IGDB platform ids (matches the creation-time snapshot).
          schema:
            type: array
            items: { type: integer, format: int64 }
        - name: tag_id
          in: query
          required: false
          description: Entries carrying ALL listed tags.
          schema:
            type: array
            items: { type: string, format: uuid }
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [name, release_date, purchased_at, created_at, value, paid, rating, backlog_rank]
            default: created_at
        - name: order
          in: query
          required: false
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: group_by
          in: query
          required: false
          schema:
            type: string
            enum: [platform, status, item_type, location, tag]
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: One page of the filtered entries, flat or grouped
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntryList" }
        "400":
          description: Invalid parameters
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "502": { $ref: "#/components/responses/UpstreamError" }
    post:
      operationId: createEntry
      summary: Add an entry (proxied, uncached)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EntryCreate" }
      responses:
        "201":
          description: The created entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "400":
          description: Invalid body
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: A referenced product or tag does not exist
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/entries/bulk-update:
    post:
      operationId: bulkUpdateEntries
      summary: Apply tag/status/storage-location changes across a batch of entries (proxied, uncached)
      description: >
        One transaction, all-or-nothing, on the collection service:
        tag removal, tag addition, and whichever scalar fields are
        present all apply in the same transaction; tag ids apply
        ownership-scoped. A status change to
        backlog manages backlog_rank like the single-entry update
        (newly-entering entries append at the end, already-backlog
        entries keep their position, leaving backlog clears it). If
        any targeted entry would end up holding more than 50 tags, the
        WHOLE transaction rolls back (400 code tag_cap_exceeded).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkUpdateRequest" }
      responses:
        "200":
          description: The count of the caller's own entries among entry_ids
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkUpdateResult" }
        "400":
          description: Bounds violated, no action specified, or the per-entry tag cap exceeded (code invalid_body or tag_cap_exceeded)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/entries/{entryId}:
    get:
      operationId: getEntry
      summary: Fetch one entry (proxied, uncached)
      parameters:
        - name: entryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
    put:
      operationId: updateEntry
      summary: Replace an entry's mutable state (proxied, uncached)
      parameters:
        - name: entryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EntryUpdate" }
      responses:
        "200":
          description: The updated entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "400":
          description: Invalid body
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: No such entry, pricing product, or tag
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
    delete:
      operationId: deleteEntry
      summary: Delete an entry (proxied)
      parameters:
        - name: entryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/entries/{entryId}/reorder:
    post:
      operationId: reorderEntry
      summary: Move a backlog entry between two neighbors (proxied)
      parameters:
        - name: entryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReorderRequest" }
      responses:
        "200":
          description: The entry at its new position
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "400":
          description: Invalid body
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Not in the backlog, or the neighbors do not straddle
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/entries/{entryId}/submission:
    post:
      operationId: createSubmission
      summary: Submit a custom entry as a catalog candidate (relay)
      description: >
        Relays collection verbatim: custom entries only (400
        entry_not_custom), one pending per entry (409
        submission_pending), per-user caps (429
        too_many_pending_submissions / submission_rate_limited).
      parameters:
        - name: entryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: The pending submission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Submission" }
        "400":
          description: The entry is not custom (code entry_not_custom)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: Not found (code entry_not_found)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: A submission is already pending (code submission_pending)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          description: A submission cap is exceeded (code too_many_pending_submissions or submission_rate_limited)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
    get:
      operationId: getSubmission
      summary: The entry's latest submission (relay)
      parameters:
        - name: entryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The latest submission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Submission" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: Not found (code entry_not_found or submission_not_found)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
    delete:
      operationId: cancelSubmission
      summary: Cancel the entry's pending submission (relay)
      parameters:
        - name: entryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Cancelled
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: Nothing pending (code submission_not_found)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/entries/{entryId}/submission/ack:
    post:
      operationId: ackSubmissionResolution
      summary: Acknowledge an approved submission (relay)
      description: >
        Relays collection verbatim: stamps the caller's approved
        submission for the entry so the approval banner does not
        reappear. Idempotent (204 on repeat).
      parameters:
        - name: entryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Acknowledged
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: Not found (code entry_not_found or submission_not_found)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/tags:
    get:
      operationId: listTags
      summary: List tags with usage counts (proxied, uncached)
      responses:
        "200":
          description: Tags
          content:
            application/json:
              schema:
                type: object
                required: [tags]
                properties:
                  tags:
                    type: array
                    items: { $ref: "#/components/schemas/Tag" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "502": { $ref: "#/components/responses/UpstreamError" }
    post:
      operationId: createTag
      summary: Create a tag (proxied)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TagCreate" }
      responses:
        "201":
          description: The created tag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tag" }
        "400":
          description: Invalid body
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409":
          description: Name already taken
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          description: Tag cap reached - at most 200 distinct tags per user (code cap_exceeded)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/tags/{tagId}:
    put:
      operationId: renameTag
      summary: Rename a tag (proxied)
      parameters:
        - name: tagId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TagCreate" }
      responses:
        "200":
          description: The renamed tag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tag" }
        "400":
          description: Invalid body
          content:
