  /api/profiles/{handle}/shelves/{slug}:
    get:
      operationId: getProfileShelfPage
      summary: A shared shelf resolved by owner handle and slug
      description: >
        Resolves the handle to its owner, then the slug to a shelf
        under that owner, applying the two-sided effective-visibility
        rule (the stricter of profile visibility and shelf visibility:
        both must be non-private). Every miss on this route - unknown
        handle, private owner, unknown slug, private shelf - answers
        the same 404 so a probing request cannot tell them apart. The
        composed payload carries the shelf UUID for all subsequent
        calls (entries, comments, likes).
      parameters:
        - name: handle
          in: path
          required: true
          schema: { type: string }
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Shelf page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShelfPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: Unknown or private (deliberately indistinguishable; code shelf_not_found)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/shelves/{shelfId}:
    get:
      operationId: getShelfPage
      summary: "A shared shelf's page: meta, owner card, and social counts"
      description: >
        Applies the two-sided effective-visibility rule (the stricter
        of profile visibility and shelf visibility: both must be
        non-private); unknown, private-shelf, and private-owner all
        answer the same 404. social is absent exactly when
        social_available is false.
      parameters:
        - name: shelfId
