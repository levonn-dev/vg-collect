openapi: 3.0.3
info:
  title: vg-collect bff
  version: 0.1.0
  description: >
    The browser-facing API. Authentication is a sealed HttpOnly cookie,
    never a header: the SPA calls these endpoints same-origin. Errors are
    application/problem+json with stable machine-readable codes. The
    login and callback endpoints are navigations (they redirect), not
    XHR targets.
paths:
  /api/auth/providers:
    get:
      operationId: listProviders
      summary: Login provider names currently enabled (drives the login page buttons)
      responses:
        "200":
          description: "Subset of: google, twitch, dev; display order"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Providers" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/auth/login:
    get:
      operationId: login
      summary: Begin a login; redirects the browser to the provider (or straight back for dev)
      parameters:
        - name: provider
          in: query
          required: true
          schema: { type: string }
          description: "google, twitch, or dev (when the dev provider is enabled)"
        - name: user
          in: query
          required: false
          schema: { type: string }
          description: "Dev provider only: fixture handle (alice, bob, admin)"
      responses:
        "302":
          description: >
            Location is the provider authorize URL; for the dev provider,
            / with the session cookie set; on failure, /login?error=<code>.
          headers:
            Location: { schema: { type: string } }
  /api/auth/callback:
    get:
      operationId: callback
      summary: The provider redirect URI; completes login and seals the session cookie
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: state
          in: query
          required: false
          schema: { type: string }
      responses:
        "302":
          description: / with Set-Cookie on success, /login?error=<code> otherwise
          headers:
            Location: { schema: { type: string } }
  /api/auth/logout:
    post:
      operationId: logout
      summary: Revoke the session (jti denylist + refresh chain) and clear the cookie; idempotent
      responses:
        "204":
          description: Logged out (also when no session existed)
        "403": { $ref: "#/components/responses/OriginForbidden" }
  /api/me:
    get:
      operationId: getMe
      summary: The signed-in user's profile (composed from the user service; briefly cached)
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503":
          description: Session refresh blocked on a dependency; retry (code user_unavailable)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    patch:
      operationId: updateMe
      summary: Edit the signed-in user's profile (display name, avatar URL)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMeRequest" }
      responses:
        "200":
          description: Updated profile (the /api/me cache is refreshed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400":
          description: Validation failure (code invalid_body; detail names the field)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/OriginForbidden" }
        "404":
          description: The signed-in account no longer exists (relayed from the user service)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
    delete:
      operationId: deleteMe
      summary: Delete the account everywhere (collection, linked logins, profile) and end the session
      description: >
        Orchestrated in self-healing order: collection purge, then auth
        identities + refresh revocation, then the user row, then session
        teardown. A mid-sequence failure answers 502 with the session
        intact so the request can be retried; an abandoned partial
        deletion re-attaches to the surviving account on next login.
      responses:
        "204":
          description: Account deleted; the session cookie is cleared
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/OriginForbidden" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/me/identities:
    get:
      operationId: getMyIdentities
      summary: Provider logins linked to the signed-in account
      responses:
        "200":
          description: Linked identities, oldest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Identities" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/me/identities/{identityId}:
    delete:
      operationId: deleteMyIdentity
      summary: Unlink a provider login from the signed-in account
      parameters:
        - name: identityId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Unlinked
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/OriginForbidden" }
        "404":
          description: No such linked login (code identity_not_found)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Refusing to remove the last login (code last_identity)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/auth/link:
    get:
      operationId: linkLogin
      summary: Begin linking another login to the signed-in account; redirects like login
      description: >
        A browser navigation, session-guarded (unlike /api/auth/login).
        Real providers redirect to the provider authorize URL and come
        back through /api/auth/callback; the dev provider links in one
        hop. Outcomes land on /account as query params: ?linked=<p> or
        ?link_error=<conflict|email_unverified|link_failed>.
      parameters:
        - name: provider
          in: query
          required: true
          schema: { type: string }
          description: "google, twitch, or dev (when the dev provider is enabled)"
        - name: user
          in: query
          required: false
          schema: { type: string }
          description: "Dev provider only: fixture handle (alice, bob, admin)"
      responses:
        "302":
          description: Provider authorize URL, or /account with the outcome params
          headers:
            Location: { schema: { type: string } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /api/otlp/v1/traces:
    post:
      operationId: proxyTraces
      summary: Relay browser OTLP trace batches to the in-cluster collector
      description: >-
        Accepts an OTLP/HTTP ExportTraceServiceRequest (protobuf or JSON
        encoding) from the SPA and forwards it verbatim to the
        collector agent. The collector's status and body pass through
        unchanged. Requires the session cookie like every other /api
        route; never cached.
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema:
              type: string
              format: binary
          application/json:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Collector export response, relayed verbatim
          content:
            application/x-protobuf:
              schema:
                type: string
                format: binary
        "400":
          description: Body unreadable or over the size cap
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/search:
    get:
      operationId: searchCatalog
      summary: Catalog discovery search (proxied to the enrichment service, uncached)
      parameters:
        - name: type
          in: query
          required: true
          schema: { type: string, enum: [game, hardware, pc_listing] }
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Search results (possibly degraded)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResults" }
        "400":
          description: Invalid parameters
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/products/resolve:
    post:
      operationId: resolveProduct
      summary: Find-or-create the canonical product for a selection (proxied, uncached)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolveRequest" }
      responses:
        "200":
          description: The canonical product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400":
          description: Invalid body
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: The provider does not know the requested id
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/products/{productId}:
    get:
      operationId: getProduct
      summary: Fetch a catalog product (proxied, uncached)
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/entries:
    get:
      operationId: listEntries
      summary: List collection entries (proxied to the collection service, uncached)
      parameters:
        - name: item_type
          in: query
          required: false
          schema:
            type: array
            items: { type: string, enum: [game, console, accessory] }
        - name: status
          in: query
          required: false
          schema:
            type: array
            items: { type: string, enum: [backlog, playing, beaten, completed, dropped, shelved] }
        - name: packaging
          in: query
          required: false
          schema:
            type: array
            items: { type: string, enum: [sealed, cib, loose] }
        - name: region
          in: query
          required: false
          schema:
            type: array
            items: { type: string, enum: [ntsc_u, ntsc_j, pal, region_free] }
        - name: item_condition
          in: query
          required: false
          schema:
            type: array
            items: { type: string, enum: [mint, near_mint, very_good, good, acceptable, poor] }
        - name: platform_id
          in: query
          required: false
          description: IGDB platform ids (matches the creation-time snapshot).
          schema:
            type: array
            items: { type: integer, format: int64 }
        - name: tag_id
          in: query
          required: false
          description: Entries carrying ALL listed tags.
          schema:
            type: array
            items: { type: string, format: uuid }
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [name, release_date, purchased_at, created_at, value, paid, rating, backlog_rank]
            default: created_at
        - name: order
          in: query
          required: false
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: group_by
          in: query
          required: false
          schema:
            type: string
            enum: [platform, status, item_type, location, tag]
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: One page of the filtered entries, flat or grouped
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntryList" }
        "400":
          description: Invalid parameters
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "502": { $ref: "#/components/responses/UpstreamError" }
    post:
      operationId: createEntry
      summary: Add an entry (proxied, uncached)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EntryCreate" }
      responses:
        "201":
          description: The created entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "400":
          description: Invalid body
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: A referenced product or tag does not exist
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/entries/{entryId}:
    get:
      operationId: getEntry
      summary: Fetch one entry (proxied, uncached)
      parameters:
        - name: entryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
    put:
      operationId: updateEntry
      summary: Replace an entry's mutable state (proxied, uncached)
      parameters:
        - name: entryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EntryUpdate" }
      responses:
        "200":
          description: The updated entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "400":
          description: Invalid body
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: No such entry, pricing product, or tag
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
    delete:
      operationId: deleteEntry
      summary: Delete an entry (proxied)
      parameters:
        - name: entryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/entries/{entryId}/reorder:
    post:
      operationId: reorderEntry
      summary: Move a backlog entry between two neighbors (proxied)
      parameters:
        - name: entryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReorderRequest" }
      responses:
        "200":
          description: The entry at its new position
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "400":
          description: Invalid body
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Not in the backlog, or the neighbors do not straddle
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/entries/{entryId}/submission:
    post:
      operationId: createSubmission
      summary: Submit a custom entry as a catalog candidate (relay)
      description: >
        Relays collection verbatim: custom entries only (400
        entry_not_custom), one pending per entry (409
        submission_pending), per-user caps (429
        too_many_pending_submissions / submission_rate_limited).
      parameters:
        - name: entryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: The pending submission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Submission" }
        "400":
          description: The entry is not custom (code entry_not_custom)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: Not found (code entry_not_found)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: A submission is already pending (code submission_pending)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          description: A submission cap is exceeded (code too_many_pending_submissions or submission_rate_limited)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
    get:
      operationId: getSubmission
      summary: The entry's latest submission (relay)
      parameters:
        - name: entryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The latest submission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Submission" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: Not found (code entry_not_found or submission_not_found)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
    delete:
      operationId: cancelSubmission
      summary: Cancel the entry's pending submission (relay)
      parameters:
        - name: entryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Cancelled
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: Nothing pending (code submission_not_found)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/entries/{entryId}/submission/ack:
    post:
      operationId: ackSubmissionResolution
      summary: Acknowledge an approved submission (relay)
      description: >
        Relays collection verbatim: stamps the caller's approved
        submission for the entry so the approval banner does not
        reappear. Idempotent (204 on repeat).
      parameters:
        - name: entryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Acknowledged
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: Not found (code entry_not_found or submission_not_found)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/tags:
    get:
      operationId: listTags
      summary: List tags with usage counts (proxied, uncached)
      responses:
        "200":
          description: Tags
          content:
            application/json:
              schema:
                type: object
                required: [tags]
                properties:
                  tags:
                    type: array
                    items: { $ref: "#/components/schemas/Tag" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "502": { $ref: "#/components/responses/UpstreamError" }
    post:
      operationId: createTag
      summary: Create a tag (proxied)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TagCreate" }
      responses:
        "201":
          description: The created tag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tag" }
        "400":
          description: Invalid body
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409":
          description: Name already taken
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/tags/{tagId}:
    put:
      operationId: renameTag
      summary: Rename a tag (proxied)
      parameters:
        - name: tagId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TagCreate" }
      responses:
        "200":
          description: The renamed tag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tag" }
        "400":
          description: Invalid body
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Name already taken
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
    delete:
      operationId: deleteTag
      summary: Delete a tag (proxied)
      parameters:
        - name: tagId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/views:
    get:
      operationId: listViews
      summary: List saved views (proxied, uncached)
      responses:
        "200":
          description: Views
          content:
            application/json:
              schema:
                type: object
                required: [views]
                properties:
                  views:
                    type: array
                    items: { $ref: "#/components/schemas/SavedView" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "502": { $ref: "#/components/responses/UpstreamError" }
    post:
      operationId: createView
      summary: Save a view (proxied)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ViewCreate" }
      responses:
        "201":
          description: The saved view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedView" }
        "400":
          description: Invalid body
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409":
          description: Name already taken
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/views/{viewId}:
    put:
      operationId: updateView
      summary: Replace a saved view (proxied)
      parameters:
        - name: viewId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ViewCreate" }
      responses:
        "200":
          description: The updated view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedView" }
        "400":
          description: Invalid body
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Name already taken
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
    delete:
      operationId: deleteView
      summary: Delete a saved view (proxied)
      parameters:
        - name: viewId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/dashboard:
    get:
      operationId: getDashboard
      summary: Collection dashboard (proxied; cached by the collection service, never here)
      description: >
        Accepts the entries-list filter dimensions and forwards them;
        the aggregates then cover exactly the filtered slice. Only the
        unfiltered dashboard is cached upstream.
      parameters:
        - name: item_type
          in: query
          required: false
          schema:
            type: array
            items: { type: string, enum: [game, console, accessory] }
        - name: status
          in: query
          required: false
          schema:
            type: array
            items: { type: string, enum: [backlog, playing, beaten, completed, dropped, shelved] }
        - name: packaging
          in: query
          required: false
          schema:
            type: array
            items: { type: string, enum: [sealed, cib, loose] }
        - name: region
          in: query
          required: false
          schema:
            type: array
            items: { type: string, enum: [ntsc_u, ntsc_j, pal, region_free] }
        - name: item_condition
          in: query
          required: false
          schema:
            type: array
            items: { type: string, enum: [mint, near_mint, very_good, good, acceptable, poor] }
        - name: platform_id
          in: query
          required: false
          description: IGDB platform ids (matches the creation-time snapshot).
          schema:
            type: array
            items: { type: integer, format: int64 }
        - name: tag_id
          in: query
          required: false
          description: Entries carrying ALL listed tags.
          schema:
            type: array
            items: { type: string, format: uuid }
      responses:
        "200":
          description: The dashboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
        "400":
          description: Invalid parameters
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/dashboard/value-history:
    get:
      operationId: getValueHistory
      summary: Collection value over time (proxied; cached by the collection service, never here)
      responses:
        "200":
          description: The value series, oldest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValueHistory" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/fx:
    get:
      operationId: getFx
      summary: Latest USD-based exchange rates (relayed from the enrichment service)
      description: >
        Rates are target-units-per-USD; USD is the base and omitted
        from the map. The SPA converts market values client-side with
        these; a failure only degrades display to USD.
      responses:
        "200":
          description: Rate snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FXRates" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/platforms:
    get:
      operationId: listPlatforms
      summary: The canonical platform catalog with aliases (relayed from enrichment)
      description: >
        Reference data for the custom-entry platform picker: igdb id +
        name + aliases, sorted by name.
      responses:
        "200":
          description: The platform catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformCatalog" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/recommendations:
    get:
      operationId: getRecommendations
      summary: Heuristic game recommendations for the signed-in user's library
      description: >
        Composed here (the bff caches only what it composes): the
        collection service's library summary is scored by the
        enrichment service, and the result is cached per user for
        about an hour. The caller's own entry mutations invalidate it
        immediately; degraded results (provider fetches skipped) are
        served but never cached.
      responses:
        "200":
          description: Ranked recommendations with display metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScoreResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/admin/products/unmatched:
    get:
      operationId: listUnmatchedProducts
      summary: Admin worklist of unmatched products (relay; enrichment enforces role admin)
      description: >
        Relays enrichment's admin worklist verbatim: every product
        with no PriceCharting mapping, held ones included and flagged
        with match_hold. The bff adds no role logic; a non-admin
        caller receives enrichment's 403 problem unchanged.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: One worklist page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnmatchedProductsPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Caller lacks the admin role (code forbidden)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/admin/products/community:
    get:
      operationId: listCommunityProducts
      summary: Admin listing of community products (relay; enrichment enforces role admin)
      description: >
        Relays enrichment's community listing verbatim: every
        admin-minted, un-promoted community product. The bff adds no
        role logic; a non-admin caller receives enrichment's 403
        problem unchanged.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: One community listing page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityProductsPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Caller lacks the admin role (code forbidden)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/admin/products/{productId}:
    delete:
      operationId: deleteProduct
      summary: Delete an unreferenced, unmatched product (orchestrated; enrichment enforces role admin)
      description: >
        The one orchestrated admin call: the bff first asks collection
        how many entries reference the product (collection enforces
        role admin on that read; its 403 relays verbatim). Any
        references answer 409 code product_referenced with the count
        in the detail - repoint or delete those entries first.
        Unreferenced products relay enrichment's guarded delete: 204
        on success, 404 product_not_found, 409 product_matched for
        matched products (clear the mapping first). Small disclosed
        race: an entry created between the check and the delete is not
        re-checked; a later resolve re-mints the family slot
        regardless, so delete is cleanup, not prevention.
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Caller lacks the admin role (code forbidden)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: No such product (code product_not_found)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Entries reference the product (code product_referenced) or it carries a mapping (code product_matched)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/admin/products/{productId}/pricecharting:
    put:
      operationId: setProductMapping
      summary: Correct or clear a product's PriceCharting mapping (relay; enrichment enforces role admin)
      description: >
        Relays enrichment's moderated correction verbatim. A null
        pc_product_id clears the mapping (the product becomes
        unmatched and held out of the nightly re-match walk); setting
        any mapping stores it verified and lifts the hold. 409 code
        identity_taken when another product of the same identity
        already carries the target listing, or a clear would collide
        with an existing unmatched product of that identity; the 409
        detail names the holding product (id and name) when the holder
        can be resolved. Clearing an already-unmatched product collides
        with nothing and simply parks it (sets match_hold,
        idempotently) - the admin lever for silencing permanent
        worklist residue.
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MappingRequest" }
      responses:
        "200":
          description: The product with its corrected mapping
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400":
          description: Invalid body (code invalid_body or invalid_param)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Caller lacks the admin role (code forbidden)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: No such product, or the provider does not know the mapping id
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Another product already carries that identity (code identity_taken)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/admin/refresh:
    post:
      operationId: triggerRefresh
      summary: Trigger an immediate price refresh walk (relay; enrichment enforces role admin)
      responses:
        "202":
          description: Walk started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefreshAccepted" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Caller lacks the admin role (code forbidden)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: A walk is already running (code refresh_in_progress)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/admin/submissions:
    get:
      operationId: listSubmissions
      summary: Pending catalog submissions with live proposals (relay; collection enforces role admin)
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: One queue page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSubmissionsPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Caller lacks the admin role (code forbidden)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/admin/submissions/{submissionId}/verdict:
    post:
      operationId: submitVerdict
      summary: Resolve one pending submission (relay; collection enforces role admin and orchestrates approve_new)
      parameters:
        - name: submissionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerdictRequest" }
      responses:
        "200":
          description: The resolved submission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Submission" }
        "400":
          description: Invalid body (code invalid_body or invalid_param)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Caller lacks the admin role (code forbidden)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: No such submission, the adopt target does not exist, or the entry vanished mid-race (code submission_not_found, unknown_product, or entry_not_found)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Another admin already resolved it (code submission_resolved)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/admin/products:
    post:
      operationId: createCommunityProduct
      summary: Mint a community product (relay; enrichment enforces role admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommunityProductCreate" }
      responses:
        "201":
          description: The minted community product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400":
          description: Invalid body (code invalid_body or invalid_param)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Caller lacks the admin role (code forbidden)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/admin/products/{productId}/promote:
    post:
      operationId: promoteProduct
      summary: Promote a community product to provider identity (relay; enrichment enforces role admin)
      description: >
        Relays enrichment's atomic attach+flip verbatim; a provider
        twin answers 409 identity_taken with the holder named, an
        already-provider product answers 409 product_not_community.
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromoteRequest" }
      responses:
        "200":
          description: The promoted product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400":
          description: Invalid body (code invalid_body or invalid_param)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Caller lacks the admin role (code forbidden)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: No such product, or the provider does not know the requested id
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: Not community-origin (code product_not_community) or a provider twin holds the identity (code identity_taken)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/admin/products/promote-candidates:
    get:
      operationId: listPromoteCandidates
      summary: Community products with plausible provider matches (relay; enrichment enforces role admin)
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: product_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: One candidates page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PromoteCandidatesPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Caller lacks the admin role (code forbidden)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/admin/products/{productId}/promote-candidates/dismiss:
    post:
      operationId: dismissPromoteCandidate
      summary: Dismiss one promote candidate (relay; enrichment enforces role admin)
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DismissCandidateRequest" }
      responses:
        "204":
          description: Dismissed
        "400":
          description: Invalid body (code invalid_body or invalid_param)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Caller lacks the admin role (code forbidden)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: No such product (code product_not_found)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502": { $ref: "#/components/responses/UpstreamError" }
components:
  responses:
    Unauthenticated:
      description: No valid session (cookie missing, malformed, expired, revoked, or denylisted)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    OriginForbidden:
      description: Mutating request from a foreign origin (code origin_forbidden)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UpstreamError:
      description: A downstream service failed (code upstream_error)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    FXRates:
      type: object
      required: [base, date, rates]
      properties:
        base:
          type: string
          description: Always USD.
        date:
          type: string
          description: Upstream snapshot date (YYYY-MM-DD).
        rates:
          type: object
          description: Target-units-per-USD by ISO 4217 code; USD omitted.
          additionalProperties: { type: number, format: double }
    Providers:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          description: "Subset of: google, twitch, dev"
          items: { type: string }
    Me:
      description: >
        Browser-facing projection of the user service's User. Timestamps
        are intentionally omitted; add fields only when the SPA has a
        concrete use for them.
      type: object
      required: [id, email, display_name, roles, preferred_currency]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string }
        avatar_url: { type: string }
        roles:
          type: array
          items: { type: string }
        preferred_currency:
          type: string
          description: Display currency for market values; USD until set.
    UpdateMeRequest:
      type: object
      description: Absent fields keep their value; an empty avatar_url clears it.
      properties:
        display_name: { type: string }
        avatar_url: { type: string }
        preferred_currency: { type: string, pattern: "^[A-Z]{3}$" }
    Identity:
      type: object
      required: [id, provider, created_at]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        email:
          type: string
          description: Informational; the email this login last asserted.
        created_at: { type: string, format: date-time }
    Identities:
      type: object
      required: [identities]
      properties:
        identities:
          type: array
          items: { $ref: "#/components/schemas/Identity" }
    # The catalog schemas below mirror the enrichment service contract
    # verbatim: these routes relay the upstream body without reshaping,
    # so the browser types must describe exactly what enrichment emits.
    PlatformRef:
      type: object
      required: [igdb_platform_id, name]
      properties:
        igdb_platform_id: { type: integer, format: int64 }
        name: { type: string }
        logo_url:
          type: string
          description: IGDB platform logo; the display fallback for products without cover art.
    CatalogPlatform:
      description: One platform-catalog row with its known aliases.
      type: object
      required: [igdb_id, name, aliases]
      properties:
        igdb_id: { type: integer, format: int64 }
        name: { type: string }
        aliases:
          description: Alternate spellings and abbreviations (compare case-insensitively).
          type: array
          items: { type: string }
    PlatformCatalog:
      type: object
      required: [platforms]
      properties:
        platforms:
          type: array
          items: { $ref: "#/components/schemas/CatalogPlatform" }
    SearchResult:
      description: >
        Flat result with a type discriminator. Game results carry the
        igdb_* fields; hardware results carry the pc_* fields plus the
        PriceCharting category (Systems, Controllers, Accessories).
        pc_listing results carry the pc_* fields, the PriceCharting
        category (empty when the provider lists none), and the standard
        per-listing loose/cib/new prices so variant prints are tellable
        apart.
      type: object
      required: [type, name]
      properties:
        type: { type: string, enum: [game, hardware, pc_listing] }
        name: { type: string }
        igdb_game_id: { type: integer, format: int64 }
        platforms:
          type: array
          items: { $ref: "#/components/schemas/PlatformRef" }
        first_release_date: { type: string, format: date }
        cover_url: { type: string }
        pc_product_id: { type: integer, format: int64 }
        console_name: { type: string }
        category: { type: string }
        loose_cents: { type: integer, format: int64 }
        cib_cents: { type: integer, format: int64 }
        new_cents: { type: integer, format: int64 }
        origin:
          type: string
          enum: [community]
          description: >
            Marks an interleaved community result (admin-minted,
            anchor-less); absent on provider results. Community results
            carry product_id + item_type + platform_name for the pick
            and community.cover_url as cover_url. They are scored against
            the query by name similarity and merged into results by
            descending score (a provider result precedes a community
            result of equal score), capped at 10, for game and hardware
            searches only (never pc_listing). The provider cache stores
            provider results only - community items attach fresh on every
            search.
        product_id: { type: string, format: uuid }
        item_type: { type: string, enum: [game, console, accessory] }
        platform_name: { type: string }
    SearchResults:
      type: object
      required: [degraded, results]
      properties:
        degraded:
          type: boolean
          description: True when the provider was unreachable and the local catalog answered instead.
        results:
          type: array
          items: { $ref: "#/components/schemas/SearchResult" }
    IgdbMeta:
      description: Projection of the raw IGDB payload held in igdb_raw; refreshed on its own cadence.
      type: object
      required: [game_id, name, genres, themes, franchises, similar_games, companies, fetched_at]
      properties:
        game_id: { type: integer, format: int64 }
        name: { type: string }
        cover_url: { type: string }
        genres:
          type: array
          items: { type: string }
        themes:
          type: array
          items: { type: string }
        franchises:
          type: array
          items: { type: string }
        similar_games:
          type: array
          items: { type: integer, format: int64 }
        companies:
          type: array
          items: { $ref: "#/components/schemas/CompanyCredit" }
        first_release_date:
          type: string
          format: date
          description: >
            Earliest date for the product's platform; the game-level
            first release when IGDB lists no dated rows for the
            platform.
        release_dates:
          description: >
            Per-region release dates for the product's platform, the
            earliest concrete date per region. Region values are
            canonical IGDB names (europe, north_america, australia,
            new_zealand, japan, china, asia, worldwide, korea, brazil).
            JP twin platforms fold into their sibling (SNES/Super Famicom,
            NES/Famicom).
          type: array
          items: { $ref: "#/components/schemas/ReleaseDate" }
        fetched_at: { type: string, format: date-time }
    CompanyCredit:
      type: object
      required: [name, developer, publisher]
      properties:
        name: { type: string }
        developer: { type: boolean }
        publisher: { type: boolean }
    ReleaseDate:
      type: object
      required: [region, date]
      properties:
        region: { type: string }
        date: { type: string, format: date }
    PricechartingMeta:
      description: >
        The PriceCharting mapping and current prices; refreshed daily.
        Absent from a product when no candidate cleared the match
        confidence threshold (no guessing) and the mapping has not been
        corrected by an admin.
      type: object
      required: [pc_product_id, pc_name, console_name, match_confidence, verified, as_of]
      properties:
        pc_product_id: { type: integer, format: int64 }
        pc_name: { type: string }
        console_name: { type: string }
        match_confidence: { type: number, format: double }
        verified: { type: boolean }
        loose_cents: { type: integer, format: int64 }
        cib_cents: { type: integer, format: int64 }
        new_cents: { type: integer, format: int64 }
        as_of: { type: string, format: date-time }
    Product:
      type: object
      required: [id, type, name, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [game, console, accessory, pc_listing] }
        name: { type: string }
        platform: { $ref: "#/components/schemas/PlatformRef" }
        region: { type: string }
        edition: { type: string }
        variant: { type: string }
        igdb: { $ref: "#/components/schemas/IgdbMeta" }
        pricecharting: { $ref: "#/components/schemas/PricechartingMeta" }
        match_hold:
          type: boolean
          description: >
            Present true when an admin clear holds this product out of
            the nightly re-match walk.
        origin:
          type: string
          enum: [community]
          description: >
            Emitted only for admin-minted community products (absent
            means provider-identified). Community products live
            outside the provider identity indexes; their curated name
            is their identity.
        community: { $ref: "#/components/schemas/CommunityMeta" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CommunityMeta:
      description: >
        Facts curated at community mint time; retained after promotion
        as gap-fill (provider blocks win per-field where present).
      type: object
      properties:
        platform_name: { type: string }
        first_release_date: { type: string, format: date }
        cover_url:
          type: string
          description: >
            User-supplied cover image URL (https, never fetched
            server-side; the client renders it with a broken-image
            fallback). Served as the product cover when no provider
            cover is present; retained after promotion as gap-fill.
    CommunityProductCreate:
      type: object
      required: [type, name]
      properties:
        type: { type: string, enum: [game, console, accessory] }
        name: { type: string, minLength: 1, maxLength: 200 }
        platform_name: { type: string, maxLength: 100 }
        region: { type: string, maxLength: 32 }
        edition:
          type: string
          maxLength: 128
          description: The entry idiom's single "Edition or variant" note.
        first_release_date: { type: string, format: date }
        cover_url:
          type: string
          maxLength: 512
          description: Optional https cover image URL (validated by shape only, never fetched).
    PromoteRequest:
      description: >
        Provider identity for an in-place promotion. type game
        products require igdb_game_id + platform_igdb_id and accept
        an optional pc_product_id (the listing can also arrive later
        via the nightly walk or the mapping fix, once provider);
        console and accessory products require pc_product_id. The
        identity the product re-enters the index with completes with
        the doc's stored region/edition/variant.
      type: object
      properties:
        igdb_game_id: { type: integer, format: int64 }
        platform_igdb_id: { type: integer, format: int64 }
        pc_product_id: { type: integer, format: int64 }
    PromoteCandidate:
      type: object
      required: [provider, provider_id, name, score, found_at]
      properties:
        provider: { type: string, enum: [igdb, pricecharting] }
        provider_id: { type: integer, format: int64 }
        name: { type: string }
        score: { type: number, format: double }
        found_at: { type: string, format: date-time }
    PromoteCandidatesPage:
      type: object
      required: [products, total_count]
      properties:
        products:
          type: array
          items: { $ref: "#/components/schemas/PromoteCandidateProduct" }
        total_count:
          type: integer
          format: int64
          description: Full count of flagged community products.
    PromoteCandidateProduct:
      type: object
      required: [product, candidates]
      properties:
        product: { $ref: "#/components/schemas/Product" }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/PromoteCandidate" }
    DismissCandidateRequest:
      type: object
      required: [provider, provider_id]
      properties:
        provider: { type: string, enum: [igdb, pricecharting] }
        provider_id: { type: integer, format: int64 }
    ResolveRequest:
      description: >
        type game requires igdb_game_id + platform_igdb_id (the
        platform must be one the game released on). Game identity is
        listing-keyed - (game, platform, PriceCharting listing) - so
        region/edition/variant on a game resolve are ignored
        (entry-level facts, like pc_listing). Without pc_product_id
        the resolve auto-matches by the plain game name through the
        shared listing-search cache and lands on the winning listing's
        product; below the confidence threshold, or with the provider
        down, it lands on the game+platform's single unmatched product
        instead - never guessed. Optional match_hint (game only,
        ignored elsewhere) reweights the scoring toward variant text
        without changing the search query; a hint nothing matches
        makes the resolve conservative (unmatched).
        With pc_product_id (a manual match: the exact listing the user
        chose) auto-match is skipped and the resolve finds or mints
        the product carrying that listing (match_confidence 1.0,
        verified false); unknown id answers 404 unknown_pc_product,
        provider failure 502 upstream_unavailable. Resolves never
        touch an existing product's mapping; corrections stay on the
        admin mapping endpoint.
        console/accessory require pc_product_id;
        region/edition/variant distinguish physical variants and are
        part of hardware identity. type pc_listing requires
        pc_product_id and mints a price-anchor product for that exact
        listing; region/edition/variant are ignored (the listing IS
        the exact variant).
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [game, console, accessory, pc_listing] }
        igdb_game_id: { type: integer, format: int64 }
        platform_igdb_id: { type: integer, format: int64 }
        pc_product_id: { type: integer, format: int64 }
        match_hint: { type: string, maxLength: 128 }
        region: { type: string, maxLength: 32 }
        edition: { type: string, maxLength: 128 }
        variant: { type: string, maxLength: 128 }
    Recommendation:
      type: object
      required: [igdb_game_id, name, genres, score]
      properties:
        igdb_game_id: { type: integer, format: int64 }
        name: { type: string }
        cover_url: { type: string }
        genres:
          type: array
          items: { type: string }
        first_release_date: { type: string, format: date }
        score: { type: number, format: double }
    ScoreResponse:
      type: object
      required: [degraded, recommendations]
      properties:
        degraded:
          type: boolean
          description: True when candidate metadata fetches failed and some candidates were skipped.
        recommendations:
          type: array
          items: { $ref: "#/components/schemas/Recommendation" }
    UnmatchedProductsPage:
      type: object
      required: [products, total_count]
      properties:
        products:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        total_count:
          type: integer
          format: int64
          description: Full count of unmatched products, beyond this page.
    CommunityProductsPage:
      type: object
      required: [products, total_count]
      properties:
        products:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        total_count:
          type: integer
          format: int64
          description: Full count of community products, beyond this page.
    MappingRequest:
      type: object
      required: [pc_product_id]
      properties:
        pc_product_id:
          type: integer
          format: int64
          nullable: true
          description: Null clears the mapping (the product becomes unmatched and held).
    RefreshAccepted:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [started] }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
    # The collection schemas below mirror the collection service
    # contract verbatim: these routes relay the upstream body without
    # reshaping, so the browser types must describe exactly what the
    # collection service emits.
    EntryPlatform:
      description: >
        The entry's platform: a creation-time snapshot of the product's
        platform (both fields) on product-backed entries, or a
        user-supplied platform on custom entries - both fields when
        picked from the catalog or normalized by the admin lever,
        name-only for escape-hatch free text. Absent when neither
        exists.
      type: object
      required: [name]
      properties:
        igdb_platform_id:
          type: integer
          format: int64
          description: Absent on name-only custom entries.
        name: { type: string }
    Entry:
      description: >
        One physical copy. On product-backed entries the catalog
        fields (item_type, display_name, platform, first_release_date,
        igdb_game_id) are immutable creation-time snapshots from the
        enrichment product and product_id remains the live join key
        for prices. A CUSTOM entry has no product_id: its display
        fields are user-owned and editable, platform carries the
        picked or normalized identity - name-only for escape-hatch
        free text - when supplied, and igdb_game_id is always absent.
        value_cents is composed at read time from the
        effective pricing product and the packaging-matched price
        field; (or, with pricing_mode custom, taken directly from
        custom_value_cents, packaging-independent); it is null when
        pricing_mode is disabled, the product is unmatched, no price
        exists for the packaging, or enrichment is temporarily
        unreachable.
      type: object
      required: [id, item_type, media_type, display_name, region,
                 packaging, has_box, has_manual, currency, pricing_mode, status,
                 pinned, source, tags, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        product_id:
          type: string
          format: uuid
          description: Absent on custom entries.
        item_type: { type: string, enum: [game, console, accessory] }
        media_type: { type: string, enum: [physical, digital] }
        display_name: { type: string }
        platform: { $ref: "#/components/schemas/EntryPlatform" }
        first_release_date: { type: string, format: date }
        cover_url:
          type: string
          description: >
            Cover art URL. For product-backed entries it is snapshotted
            from the product at creation (and refreshed on adoption).
            Custom entries may set their own (https, shape-validated).
            Absent on hardware and products without art (render a
            placeholder).
        igdb_game_id:
          type: integer
          format: int64
          description: >
            The recommendation identity: snapshotted from the entry's
            own product, or from the proxy target on custom game
            entries (owning a reproduction of X means playing X).
        region: { type: string, enum: [ntsc_u, ntsc_j, pal, region_free] }
        edition:
          type: string
          description: >
            Per-copy variant note ("first print (glitched rev)",
            "black edition"): the idiom for variants of cataloged
            items is an entry on the base product with the variant
            recorded here.
        packaging: { type: string, enum: [sealed, cib, loose] }
        has_box: { type: boolean }
        has_manual: { type: boolean }
        box_condition: { type: string, enum: [mint, near_mint, very_good, good, acceptable, poor] }
        manual_condition: { type: string, enum: [mint, near_mint, very_good, good, acceptable, poor] }
        item_condition: { type: string, enum: [mint, near_mint, very_good, good, acceptable, poor] }
        price_paid_cents: { type: integer, format: int64 }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        purchased_at: { type: string, format: date }
        purchased_from: { type: string }
        pricing_mode: { type: string, enum: [auto, proxy, custom, disabled] }
        pricing_product_id: { type: string, format: uuid }
        custom_value_cents:
          type: integer
          format: int64
          description: >
            The user-set market value (USD cents). With
            pricing_mode custom it IS the entry's value; under any
            other mode it persists as "last custom price" memory.
        custom_value_set_at:
          type: string
          format: date-time
          description: >
            Server-managed: stamped when custom_value_cents is first
            set or changes value, untouched otherwise. Read-only.
        custom_value_entered_cents:
          type: integer
          format: int64
          description: >
            The custom price exactly as the user typed it, in
            custom_value_entered_currency minor units (major units x
            100, including zero-decimal currencies). Display metadata
            only: no aggregation reads it; custom_value_cents remains
            the USD value used everywhere.
        custom_value_entered_currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: Currency of custom_value_entered_cents.
        status: { type: string, enum: [backlog, playing, beaten, completed, dropped, shelved] }
        rating: { type: integer, minimum: 1, maximum: 10 }
        notes: { type: string }
        storage_location: { type: string }
        pinned: { type: boolean }
        backlog_rank:
          type: string
          description: Present exactly while status is backlog; server-generated.
        source: { type: string, enum: [manual, steam, psn, epic] }
        external_ref: { type: string }
        tags:
          type: array
          items: { $ref: "#/components/schemas/TagRef" }
        value_cents: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Submission:
      description: >
        One catalog-submission lifecycle row for an entry. Rows
        persist as history (rejected and cancelled included; the
        rolling creation cap counts every attempt); deleting the entry
        removes them with it. product_id is the verdict's resolved
        product - recorded before adoption so an approve_new retry
        never mints twice.
      type: object
      required: [id, entry_id, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        entry_id: { type: string, format: uuid }
        status: { type: string, enum: [pending, approved, rejected, cancelled] }
        reject_reason: { type: string }
        product_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        reviewed_at: { type: string, format: date-time }
        resolution_ack_at:
          type: string
          format: date-time
          description: >
            When the submitter acknowledged an approved verdict (closed
            the approval banner). Absent until acknowledged.
    AdminSubmission:
      description: >
        One queue row: the submission plus the live proposal from the
        entry join (display_name, item_type, platform_name, region,
        edition, first_release_date pre-fill the curation form;
        entries carry no variant - the single edition field is the
        idiom).
      type: object
      required: [id, entry_id, user_id, status, display_name, item_type, region, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        entry_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        status: { type: string, enum: [pending, approved, rejected, cancelled] }
        display_name: { type: string }
        item_type: { type: string, enum: [game, console, accessory] }
        platform_name: { type: string }
        region: { type: string, enum: [ntsc_u, ntsc_j, pal, region_free] }
        edition: { type: string }
        first_release_date: { type: string, format: date }
        cover_url:
          type: string
          description: The entry's cover URL, live from the proposal join; prefills the curation cover field.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AdminSubmissionsPage:
      type: object
      required: [submissions, total_count]
      properties:
        submissions:
          type: array
          items: { $ref: "#/components/schemas/AdminSubmission" }
        total_count:
          type: integer
          format: int64
          description: Full pending count, beyond this page.
    CommunityProductSpec:
      description: >
        The curated fields for approve_new; mirrors the enrichment
        mint request (single edition field, no variant).
      type: object
      required: [type, name]
      properties:
        type: { type: string, enum: [game, console, accessory] }
        name: { type: string, minLength: 1, maxLength: 200 }
        platform_name: { type: string, maxLength: 100 }
        region: { type: string, maxLength: 32 }
        edition: { type: string, maxLength: 128 }
        first_release_date: { type: string, format: date }
        cover_url:
          type: string
          maxLength: 512
          description: Optional https cover image URL for the minted community product.
    VerdictRequest:
      description: >
        One admin verdict. approve_new requires product;
        approve_existing requires product_id; reject requires reason.
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [approve_new, approve_existing, reject] }
        product: { $ref: "#/components/schemas/CommunityProductSpec" }
        product_id: { type: string, format: uuid }
        reason: { type: string, maxLength: 1000 }
    EntryCreate:
      description: >
        Product-backed: product_id comes from a prior enrichment
        resolve and the catalog fields are snapshotted server-side
        (display_name/item_type/platform_name/first_release_date must
        NOT be sent). Custom (no product_id): display_name and
        item_type are required, platform_name and first_release_date
        optional; pricing_mode defaults to disabled and must not be
        auto. media_type accepts only physical (the column already
        allows digital: the API widens when platform sync arrives).
        source is server-set manual. pricing_product_id is required
        when pricing_mode is proxy; box_condition requires has_box and
        manual_condition requires has_manual. custom_value_cents is
        required when pricing_mode is custom.
      type: object
      required: [region, packaging]
      properties:
        product_id:
          type: string
          format: uuid
          description: Omit for a custom (off-catalog) entry.
        display_name:
          type: string
          maxLength: 200
          description: Custom entries only (required there).
        item_type:
          type: string
          enum: [game, console, accessory]
          description: Custom entries only (required there).
        platform_name:
          type: string
          maxLength: 100
          description: Custom entries only.
        platform_igdb_id:
          type: integer
          format: int64
          description: Custom entries only; the canonical platform id from the picker (surfaces the entry in the platform filter).
        cover_url:
          type: string
          maxLength: 512
          description: Custom entries only; an https cover image URL (validated by shape, never fetched).
        first_release_date:
          type: string
          format: date
          description: Custom entries only.
        media_type: { type: string, enum: [physical], default: physical }
        region: { type: string, enum: [ntsc_u, ntsc_j, pal, region_free] }
        edition:
          type: string
          maxLength: 200
          description: Per-copy variant note; the idiom for variants of cataloged items.
        packaging: { type: string, enum: [sealed, cib, loose] }
        has_box: { type: boolean, default: false }
        has_manual: { type: boolean, default: false }
        box_condition: { type: string, enum: [mint, near_mint, very_good, good, acceptable, poor] }
        manual_condition: { type: string, enum: [mint, near_mint, very_good, good, acceptable, poor] }
        item_condition: { type: string, enum: [mint, near_mint, very_good, good, acceptable, poor] }
        price_paid_cents: { type: integer, format: int64, minimum: 0 }
        currency: { type: string, pattern: "^[A-Z]{3}$", default: USD }
        purchased_at: { type: string, format: date }
        purchased_from: { type: string, maxLength: 200 }
        pricing_mode: { type: string, enum: [auto, proxy, custom, disabled], default: auto }
        pricing_product_id: { type: string, format: uuid }
        custom_value_cents: { type: integer, format: int64, minimum: 0, maximum: 1000000000 }
        custom_value_entered_cents: { type: integer, format: int64, minimum: 0, maximum: 1000000000 }
        custom_value_entered_currency: { type: string, pattern: "^[A-Z]{3}$" }
        status:
          type: string
          enum: [backlog, playing, beaten, completed, dropped, shelved]
          default: backlog
        rating: { type: integer, minimum: 1, maximum: 10 }
        notes: { type: string, maxLength: 10000 }
        storage_location: { type: string, maxLength: 200 }
        pinned: { type: boolean, default: false }
        tag_ids:
          type: array
          maxItems: 50
          items: { type: string, format: uuid }
    EntryUpdate:
      description: >
        Full replacement of the mutable state; an absent optional field
        is cleared (the edit form holds the whole entry). media_type
        and custom-ness are immutable. product_id accepts one narrow
        change - re-matching an auto-priced entry off an unmatched
        game product onto a product of the same game and platform
        (see the field description); anything else answers 400 code
        invalid_product_change. On custom entries
        display_name is required and platform_name/first_release_date
        replace like any optional field; on product-backed entries all
        three are rejected. tag_ids replaces the tag set; absent means
        no tags. custom_value_cents is required when pricing_mode is
        custom.
      type: object
      required: [region, packaging, pricing_mode, status, pinned]
      properties:
        display_name:
          type: string
          maxLength: 200
          description: Custom entries only (required there).
        platform_name:
          type: string
          maxLength: 100
          description: Custom entries only.
        platform_igdb_id:
          type: integer
          format: int64
          description: Custom entries only; the canonical platform id from the picker.
        cover_url:
          type: string
          maxLength: 512
          description: Custom entries only; an https cover image URL (validated by shape, never fetched).
        first_release_date:
          type: string
          format: date
          description: Custom entries only.
        product_id:
          type: string
          format: uuid
          description: >
            Narrow re-match. Accepted only when the entry is
            product-backed with pricing_mode auto, its current product
            is a game with no price mapping, and the new product is a
            game of the same family (same igdb game and platform);
            the same id as the entry already has is a no-op. Anything
            else answers 400 code invalid_product_change; enrichment
            unreachable answers 502 code enrichment_unavailable and
            leaves the entry unchanged. Snapshotted display fields
            stay as they are.
        region: { type: string, enum: [ntsc_u, ntsc_j, pal, region_free] }
        edition:
          type: string
          maxLength: 200
          description: Per-copy variant note; the idiom for variants of cataloged items.
        packaging: { type: string, enum: [sealed, cib, loose] }
        has_box: { type: boolean, default: false }
        has_manual: { type: boolean, default: false }
        box_condition: { type: string, enum: [mint, near_mint, very_good, good, acceptable, poor] }
        manual_condition: { type: string, enum: [mint, near_mint, very_good, good, acceptable, poor] }
        item_condition: { type: string, enum: [mint, near_mint, very_good, good, acceptable, poor] }
        price_paid_cents: { type: integer, format: int64, minimum: 0 }
        currency: { type: string, pattern: "^[A-Z]{3}$", default: USD }
        purchased_at: { type: string, format: date }
        purchased_from: { type: string, maxLength: 200 }
        pricing_mode: { type: string, enum: [auto, proxy, custom, disabled] }
        pricing_product_id: { type: string, format: uuid }
        custom_value_cents: { type: integer, format: int64, minimum: 0, maximum: 1000000000 }
        custom_value_entered_cents: { type: integer, format: int64, minimum: 0, maximum: 1000000000 }
        custom_value_entered_currency: { type: string, pattern: "^[A-Z]{3}$" }
        status: { type: string, enum: [backlog, playing, beaten, completed, dropped, shelved] }
        rating: { type: integer, minimum: 1, maximum: 10 }
        notes: { type: string, maxLength: 10000 }
        storage_location: { type: string, maxLength: 200 }
        pinned: { type: boolean }
        tag_ids:
          type: array
          maxItems: 50
          items: { type: string, format: uuid }
    EntryList:
      description: >
        One page of the sorted, filtered sequence. Exactly one of
        entries/groups is present (groups when group_by was requested,
        partitioning this page only).
      type: object
      required: [pricing_available, total_count]
      properties:
        pricing_available:
          type: boolean
          description: False when enrichment was unreachable; every value_cents is null.
        total_count:
          type: integer
          description: Size of the full filtered set, before pagination.
        entries:
          type: array
          items: { $ref: "#/components/schemas/Entry" }
        groups:
          type: array
          items: { $ref: "#/components/schemas/EntryGroup" }
    EntryGroup:
      type: object
      required: [key, label, entries]
      properties:
        key: { type: string }
        label: { type: string }
        entries:
          type: array
          items: { $ref: "#/components/schemas/Entry" }
    ReorderRequest:
      description: Neighbor entry ids around the drop slot; null marks a list edge. Both null is invalid.
      type: object
      properties:
        after_id: { type: string, format: uuid, nullable: true }
        before_id: { type: string, format: uuid, nullable: true }
    TagRef:
      description: A tag as embedded on an entry (no usage count).
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    Tag:
      type: object
      required: [id, name, entry_count]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        entry_count: { type: integer }
    TagCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
    SavedView:
      type: object
      required: [id, name, params, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        params:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ViewCreate:
      type: object
      required: [name, params]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        params:
          type: object
          additionalProperties: true
          description: Opaque frontend view state; at most 8192 marshaled bytes.
    PlatformCount:
      type: object
      required: [name, count]
      properties:
        name: { type: string }
        count: { type: integer }
    CurrencySpend:
      type: object
      required: [currency, total_cents]
      properties:
        currency: { type: string }
        total_cents: { type: integer, format: int64 }
    DashboardPricing:
      type: object
      required: [available, priced_entries, unpriced_entries, excluded_entries]
      properties:
        available:
          type: boolean
          description: False when enrichment was unreachable; total_value_cents is then absent.
        total_value_cents: { type: integer, format: int64 }
        priced_entries: { type: integer }
        unpriced_entries:
          type: integer
          description: Entries whose effective product is unmatched or lacks a price for their packaging.
        excluded_entries:
          type: integer
          description: Entries with pricing_mode disabled.
    Dashboard:
      type: object
      required: [total_entries, by_status, by_item_type, by_platform, spend, pricing]
      properties:
        total_entries: { type: integer }
        by_status:
          type: object
          additionalProperties: { type: integer }
        by_item_type:
          type: object
          additionalProperties: { type: integer }
        by_platform:
          type: array
          items: { $ref: "#/components/schemas/PlatformCount" }
        spend:
          type: array
          description: Sum of price_paid_cents per currency, over entries that record a price.
          items: { $ref: "#/components/schemas/CurrencySpend" }
        pricing: { $ref: "#/components/schemas/DashboardPricing" }
    ValuePoint:
      type: object
      required: [date, value_cents]
      properties:
        date: { type: string, format: date }
        value_cents: { type: integer, format: int64 }
    ValueHistory:
      type: object
      required: [available, points]
      properties:
        available:
          type: boolean
          description: False when enrichment was unreachable; points is then empty.
        points:
          type: array
          items: { $ref: "#/components/schemas/ValuePoint" }
